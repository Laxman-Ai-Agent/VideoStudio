<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="kit.js"></script><script src="hd.js"></script>
<style>/* 10_Diarrhea_ORS hd_l05_germs: broken sponge, contaminated water under a magnifier, viruses, bacteria + parasite (main culprits), hands spread germs */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, u, tl, E, at, mk, place, pop, out, move, cam } = X;
  const { K, float, bgl, base, push, card, pill, word, draw, ring, flow, tank, nope, tick, dots, icon, aside, enter, zin, bigNum } = HD;
  document.documentElement.style.setProperty("--u", u + "px");
  bgl();
  const p = (i, d) => at("p" + i, d);

  const t2 = p(2, 4.9), t3 = p(3, 9.5), t4 = p(4, 13.7), t5 = p(5, 18.4);
  /* 1. the sponge cracks */
  const sp = base("H07", W * .3, H * .1, W * .4, H * .7, { label: "sea sponge" });
  zin(sp, 0); tl.to(sp, { filter: "grayscale(.7)", rotation: -4, duration: 1.2, ease: E.io }, .8);
  draw(`M ${W * .42} ${H * .2} L ${W * .48} ${H * .38} L ${W * .45} ${H * .48} L ${W * .52} ${H * .66}`, K.red, 1, .5, { w: u * .6 });
  const q = card(`Why does it <em>fail</em>?<span class="te">ఒక్క కారణం ఉండదు</span>`, W * .05, H * .14, { bar: true, c: K.red }); pop(q, .4, { x: -u * 4, opacity: 0 }, .6, E.spring);
  /* 2. murky water + street food, a magnifier finds germs */
  HD.clear(t2 - .3);
  out(q, t2 - .3); out(sp, t2 - .3, { scale: .9 });
  const w = base("H08", W * .1, H * .1, W * .56, H * .72, { label: "murky water glass + street snack" });
  zin(w, t2 - .2); push(w, t2 + .6, t3 - t2, 1.1, u * 3, 0);
  const mg = place(mk("div", "hd-ic"), W * .62, H * .3, u * 20, u * 20); mg.style.setProperty("--c", K.ink); mg.style.borderWidth = u * .8 + "px"; mg.style.background = "#ffffffcc";
  tl.fromTo(mg, { x: W * .2, opacity: 0 }, { x: -W * .32, opacity: 1, duration: 1.4, ease: E.io, immediateRender: true }, t2 + .2);
  for (let i = 0; i < 6; i++) { const gm = place(mk("div", "hd-p", mg), u * (5 + (i % 3) * 4), u * (5 + Math.floor(i / 3) * 6), u * 2.4, u * 1.1); gm.style.background = K.red; gm.style.borderRadius = "99px";
    tl.to(gm, { rotation: 40, x: u, duration: .4, repeat: 7, yoyo: true, ease: "sine.inOut" }, t2 + 1.4 + i * .05); }
  const pg = pill("GERMS", K.red, W * .62, H * .7, { solid: true }); pop(pg, t2 + 1.8, { y: u * 2, opacity: 0 }, .5);
  /* 3. viruses */
  HD.clear(t3 - .3);
  [mg, pg].forEach((e) => out(e, t3 - .3)); out(w, t3 - .3);
  const v = base("H09", W * .22, H * .12, W * .56, H * .66, { label: "rotavirus + norovirus" });
  zin(v, t3 - .2); tl.to(v, { rotation: 4, duration: t4 - t3, ease: "sine.inOut" }, t3);
  const vR = pill("ROTAVIRUS", K.red, W * .2, H * .72); pop(vR, t3 + .2, { y: u * 2, opacity: 0 }, .5, E.spring);
  const vN = pill("NOROVIRUS", K.red, W * .62, H * .72); pop(vN, t3 + 1, { y: u * 2, opacity: 0 }, .5, E.spring);
  const vV = card(`<em>Viruses</em>`, W * .05, H * .1, { bar: true, c: K.red }); pop(vV, t3 + .3, { x: -u * 3, opacity: 0 }, .5, E.spring);
  /* 4. bacteria + parasite: roster, MAIN CULPRITS stamp */
  HD.clear(t4 - .3);
  [vR, vN].forEach((e) => out(e, t4 - .3)); aside(v, t4 - .3, W * .02, H * .52, W * .2, H * .24, .6); out(vV, t4 - .3);
  const b = base("H10", W * .26, H * .08, W * .5, H * .66, { label: "rod bacteria + Giardia parasite" }); enter(b, t4 - .2);
  ["VIRUSES", "BACTERIA", "PARASITES"].forEach((l, i) => { const c = card(`${l}`, W * .77, H * (.12 + i * .14), { bar: true, c: K.red, w: W * .19 }); pop(c, t4 + i * .9, { x: u * 4, opacity: 0 }, .5, E.spring); out(c, t5 - .3); });
  const st = word(`MAIN CULPRITS`, W * .3, H * .66, 6, {}); st.style.color = K.red; st.style.border = `${u * .5}px solid ${K.red}`; st.style.padding = `${u}px ${u * 2}px`; st.style.borderRadius = u + "px";
  tl.fromTo(st, { scale: 1.5, rotation: -10, opacity: 0 }, { scale: 1, rotation: -6, opacity: 1, duration: .45, ease: E.pop, immediateRender: true }, t5 - 1.6);
  /* 5. dirty hands spread them; soap halo */
  HD.clear(t5 - .3);
  [st, b, v].forEach((e) => out(e, t5 - .3));
  const so = base("H11", W * .56, H * .14, W * .38, H * .62, { label: "bar of soap with foam" }); zin(so, t5 - .2);
  const P = [.1, .24, .38].map((x, i) => { const e = icon("person", K.ink, W * x, H * .36, u * 9); pop(e, t5 + i * .4, { scale: .4, opacity: 0 }, .5, E.spring); return e; });
  [0, 1].forEach((i) => { draw(`M ${W * (.15 + i * .14)} ${H * .3} Q ${W * (.215 + i * .14)} ${H * .18}, ${W * (.28 + i * .14)} ${H * .3}`, K.red, t5 + 1 + i * .5, .5, { dash: true, head: true }); });
  ring(W * .75, H * .45, K.green, t5 + 1.8, { r: u * 16, n: 2 });
  const hw = pill("WASH HANDS", K.green, W * .66, H * .76, { solid: true }); pop(hw, t5 + 2, { y: u * 2, opacity: 0 }, .5, E.spring);
  cam(0, Math.max(D, 1), 1.02);
  X.done();
</script></body></html>
