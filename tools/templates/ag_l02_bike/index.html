<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l02_bike: L02 old bike myth: rusty bike, worn parts stamped, other scientists, Sinclair card at Harvard, cells forget instructions */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tBk = at("bike", 1.2), tPa = at("parts", 4.4), tBu = at("but", 7.3), tHv = at("harvard", 10.2), tSn = at("sinclair", 11.5), tIn = at("instr", 15.5), tAg = at("aging", 17.5);
  paper();
  photo("A05", { t: 0, d: tBu, mv: "push", a: .7, in: "fade", fx: .55, until: tBu + .1 });
  wash(.2, tBu, { a: .9 });
  kick("THE COMMON BELIEF", .3, { y: H * .2, until: tBu });
  head("Aging = an <em>old bike</em>", tBk - .3, { y: H * .27, size: 8, until: tBu });
  tel("parts అరిగిపోయాయి", tPa - .2, { y: H * .44, until: tBu });
  stamp("NO REPAIR", W * .66, H * .58, tPa + 1.2, { size: 5, until: tBu });
  photo("A06", { t: tBu - .1, d: D - tBu + .5, mv: "panR", a: .6, in: "blinds" });
  wash(tBu, null, { a: .96 });
  head("Some scientists <em>disagree</em>", tBu + .2, { y: H * .16, size: 6.5, until: tIn - .3 });
  kick("HARVARD MEDICAL SCHOOL", tHv - .2, { y: H * .36, c: K.green, until: tIn - .3 });
  card("David Sinclair", "GENETICIST · AGING RESEARCH", W * .06, H * .42, tSn - .3, { c: K.green, until: tIn - .3 });
  head("Cells don't <em>break</em>.", tIn - .3, { y: H * .2, size: 8 });
  head("They <em>forget</em> to read", tIn + .5, { y: H * .34, size: 8, c: K.red });
  kick("THEIR ORIGINAL INSTRUCTIONS", tAg - .4, { y: H * .5, c: K.ink });
  AT.done();
</script>
</body></html>
