<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_l05_raincoat: L05 why acid does not burn the stomach: thick mucus raincoat; the esophagus has no raincoat */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 83.2);
  shot("A03", { t: 0, d: 3.1, mv: "push", in: "fade", until: T(86.3) });
  head("WHY DOESN'T IT <b>BURN</b> THE STOMACH?", T(83.6), { y: H * .14, size: 5, c: K.fl, until: T(86.2) });
  const s = shield(W * .08, H * .24, W * .84, H * .56, T(86.3), { mucus: true, drops: T(86.8), until: T(94.6) });
  tag("THICK LAYER", T(88.2), { y: H * .1, c: K.por, until: T(94.6) });
  callout(W * .3, H * .53, W * .06, -H * .2, "MUCUS", T(88.9), { c: K.por, until: T(90.2) });
  AC.morph(s, T(90.3), [W * .04, H * .22, W * .46, H * .52]);
  shot("A16", { t: T(90.3), d: 4.4, mv: "rise", in: "slide", box: [W * .53, H * .1, W * .43, H * .64], fr: true, fig: "RAINCOAT", no: "3", c: K.por, until: T(94.6) });
  te("<b>Raincoat</b> లాగా కాపాడుతుంది", T(91.0), { y: H * .82, c: K.por, until: T(94.6) });
  shield(W * .08, H * .3, W * .84, H * .5, T(94.8), { mucus: false, drops: T(95.4) });
  tag("ESOPHAGUS LINING", T(95.2), { y: H * .1, c: K.fl });
  head("<b>NO</b> RAINCOAT HERE", T(95.9), { y: H * .16, c: K.fl, size: 6 });
  drench(T(98.4) - .02, { part: "in" });
  AC.done();
</script>
</body></html>
