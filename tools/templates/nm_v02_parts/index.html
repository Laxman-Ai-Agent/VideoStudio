<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}"><div id="stage"></div></div>

  /* A: built from Mars hardware */

  const t1 = tag("TEST BODY", "CURIOSITY'S EARTH TEST ROVER", "check", "#121722", W * .07, H * .74); pop(t1, tBo - .3, { x: -u * 4, opacity: 0 });

  /* B: Blue Origin's Mark 1 carries it, end of 2028 */
  [h, t1, t2, c0].forEach((e) => out(e, tBl - .6, { y: -u * 3 })); hide(s, tBl - .4, "u", .7);
