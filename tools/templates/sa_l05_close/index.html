<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l05_close: L05 in some the tube narrows or closes; vibration = snoring; fully closed: no air to the lungs, blood oxygen falls */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 89.7);
  airway(W * .06, H * .1, W * .88, H * .5, 0, { g: [[0, .72], [T(91.4), .72], [T(92.4), .28], [T(93.9), .28], [T(94.9), 0]], m: "SOME PEOPLE", until: T(96.0) });
  head("IT <b>NARROWS</b>", T(92.1), { x: W * .06, y: H * .68, size: 6, until: T(94.6) });
  head("OR <b>CLOSES</b>", T(94.7), { x: W * .06, y: H * .68, size: 6, until: T(95.9) });
  shot("A01", { t: T(96.0), d: 5, mv: "breathe", in: "blink", box: [0, 0, W * .46, H], until: T(101.1) });
  airway(W * .5, H * .12, W * .46, H * .38, T(96.2), { g: [[0, .3]], vib: [[T(98.1), T(101.2)]], m: "VIBRATING", until: T(101.1) });
  trace(W * .5, H * .56, W * .46, H * .2, T(97.0), { ev: [[0, T(120), "snore"]], label: "SOUND · SNORE", until: T(101.1) });
  head("VIBRATION = <b>SNORE</b>", T(99.1), { x: W * .5, y: H * .82, size: 4.6, c: K.moon, until: T(101.0) });
  shot("A12", { t: T(101.1), d: 3.7, mv: "push", in: "iris", fx: .55, until: T(104.8) });
  focus(W * .52, H * .5, u * 10, T(102.6), { label: "FULLY BLOCKED", until: T(104.7) });
  shot("A13", { t: T(104.8), d: 5.6, mv: "drift", in: "dim" });
  airway(W * .06, H * .12, W * .42, H * .3, T(104.9), { g: [[0, 0]], m: "CLOSED", r: "✕ LUNGS" });
  trace(W * .06, H * .48, W * .42, H * .18, T(105.3), { ev: [[0, T(120), "apnea"]], label: "AIRFLOW" });
  spo2(W * .62, H * .14, T(107.4), [[T(107.4), 96], [T(108.4), 96], [T(110.1), 84]]);
  head("OXYGEN <b>FALLS</b>", T(108.8), { x: W * .62, y: H * .52, size: 5.4 });
  NW.done();
</script>
</body></html>
