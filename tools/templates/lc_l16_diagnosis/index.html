<style>/* 16_Lung_Cancer lc_l16_diagnosis: L16 diagnosis: chest X-ray or CT, biopsy confirms, small piece of tumour, gene tests on the same tissue */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 274.3);
  shot("A56", { t: 0, d: 4.6, mv: "push", in: "scan", until: T(278.9) });
  head("<b>DIAGNOSIS</b>", T(274.6), { y: H * .1, size: 7, c: K.ice, until: T(278.8) });
  film("A55", W * .06, H * .3, W * .36, H * .56, T(276.0), { scan: [T(276.5)], until: T(278.8) });
  shot("A09", { t: T(277.3), d: 2, mv: "push", in: "rise", box: [W * .52, H * .3, W * .42, H * .56], panel: true, cap: "CT SCAN", c: K.ice, until: T(278.9) });
  shot("A57", { t: T(278.9), d: 8, mv: "push", in: "smoke", fx: .5, until: T(287.0) });
  head("<b>BIOPSY</b> CONFIRMS", T(282.1), { y: H * .12, size: 6.6, until: T(286.9) });
  focus(W * .5, H * .5, u * 8, T(284.1), { label: "TUMOUR SAMPLE", until: T(286.9) });
  te("చిన్న <b>ముక్క</b> తీసి పరీక్ష", T(285.0), { y: H * .74, until: T(286.9) });
  shot("A58", { t: T(287.0), d: 3, mv: "drift", in: "wipe" });
  doc(`<h3>Histopathology report</h3><div style="color:#6b625a">Specimen: CT-guided lung biopsy</div><div class="rule"></div>
    <b>Diagnosis:</b> non-small cell lung cancer<br><br><b>Gene tests on the same tissue:</b><br><span class="hl">EGFR · ALK · ROS1 · PD-L1</span><br><br><span style="color:#6b625a">Results guide the choice of treatment.</span>`,
    W * .52, H * .1, W * .42, H * .66, T(287.4));
  tag("GENE TESTS", T(288.1), { x: W * .06, y: H * .2, c: K.ice });
  SM.done();
</script>
</body></html>
