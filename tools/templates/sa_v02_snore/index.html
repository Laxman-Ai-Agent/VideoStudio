<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_v02_snore: V02 this is sleep apnea; snoring is thought to be deep sleep; but the sound stops, seconds later a gasp: not normal snoring; the throat airway closes */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 12.9);
  shot("B05", { t: 0, d: 5.8, mv: "push", a: .6, in: "dim", until: T(18.7) });
  head("SLEEP <b>APNEA</b>", T(13.4), { y: H * .1, size: 10, until: T(15.3) });
  myth("గురక = <b>గాఢ నిద్ర</b>", T(15.4), T(18.8), { x: W * .08, y: H * .14, until: T(19.2) });
  shot("B01", { t: T(18.7), d: 4.4, mv: "breathe", in: "fade", until: T(23.0) });
  trace(W * .05, H * .42, W * .9, H * .18, T(19.0), { ev: [[0, T(20.8), "snore"], [T(20.8), T(23.0), "apnea"], [T(23.0), T(25), "gasp"], [T(25), T(40), "snore"]], label: "ONE SNORE", warn: "SILENCE", until: T(26.5) });
  num(0, 8, T(21.8), { x: W * .08, y: H * .64, unit: "sec", d: 1.2, until: T(23.0) });
  shot("B02", { t: T(23.0), d: 3.6, mv: "push", a: 1.2, in: "cut", z: 3, until: T(26.6) });
  flash(T(23.0), .4);
  head("<b>GASP</b>", T(23.1), { y: H * .1, size: 13, z: 20, until: T(24.8) });
  head("NOT NORMAL <b>SNORING</b>", T(24.9), { y: H * .1, size: 7, z: 20, until: T(26.5) });
  shot("B03", { t: T(26.6), d: 3.8, mv: "push", a: .8, in: "iris" });
  focus(W * .5, H * .48, u * 14, T(28.4), { label: "AIRWAY CLOSED", side: -1 });
  NW.done();
</script>
</body></html>
