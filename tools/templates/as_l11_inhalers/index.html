<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l11_inhalers: L11 two inhalers: reliever relaxes the muscle and opens fast; preventer = low-dose steroid, swelling down slowly */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 203.0);
  shot("A46", { t: 0, d: 4, mv: "push", a: .6, in: "mist", until: T(206.9) });
  num(0, 2, T(205.0), { x: W * .07, y: H * .1, size: 18, unit: "INHALERS", d: .6, until: T(206.8) });
  shot("A47", { t: T(206.9), d: 8.6, mv: "push", a: .5, in: "rise", box: [W * .04, H * .1, W * .44, H * .62], glass: true, cap: "RELIEVER", until: T(215.5) });
  puff(W * .2, H * .36, T(207.9), { ang: 180, len: u * 16 });
  head("<b>RELIEVER</b>", T(207.6), { x: W * .04, y: H * .78, size: 5.6, until: T(215.4) });
  airway(W * .73, H * .42, u * 15, T(208.2), { id: "r", squeeze: T(208.4), open: T(212.3), until: T(215.5) });
  te("కండరాలు <b>వదులు</b>", T(212.4), { x: W * .55, y: H * .74, until: T(215.4) });
  flow({ n: 90, alpha: .8, band: .16, cx: .73, cy: .42, t: T(213.4), z: 9, until: T(215.4) });
  tag("OPENS FAST", T(213.9), { x: W * .62, y: H * .08, until: T(215.4) });
  shot("A46", { t: T(215.5), d: 8.7, mv: "drift", in: "wipeL", fx: .7, box: [W * .52, H * .1, W * .44, H * .62], glass: true, cap: "PREVENTER · CONTROLLER", c: K.hn });
  head("<b>PREVENTER</b>", T(216.2), { x: W * .52, y: H * .78, size: 5.6, c: K.hn });
  airway(W * .26, H * .42, u * 15, T(215.6), { id: "p", swell: T(215.7), open: T(222.4) });
  tag("LOW-DOSE STEROID", T(219.4), { x: W * .06, y: H * .08, c: K.hn });
  te("వాపు <b>క్రమంగా</b> తగ్గుతుంది", T(223.0), { x: W * .06, y: H * .76 });
  BK.done();
</script>
</body></html>
