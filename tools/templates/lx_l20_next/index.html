<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l20_next: L20 what's next: Nov 18 price set, Nov 19 Nasdaq trading, until then nobody can buy */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tNx = at("next", .1), t18 = at("n18", 2), t19 = at("n19", 4.6), tNb = at("nobody", 8);
  shot("A25", { t: 0, d: tNb + .5, mv: "push", a: .7, in: "line", until: tNb });
  dim(0, tNb, .7, { bg: "linear-gradient(90deg, #07090f 45%, #07090f30)" });
  head("What's <em>next</em>?", tNx + .1, { y: H * .1, size: 9 });
  [["NOV 18", "FINAL PRICE", t18, K.gold], ["NOV 19", "NASDAQ TRADING", t19, K.green]].forEach(([d, s, t, c], i) => {
    const y = H * (.32 + i * .22);
    big(d, t - .2, { y, size: 11, col: c, until: tNb });
    mono(s, t + .1, { x: W * .5, y: y + u * 4, size: 2.2, c: K.ink, until: tNb });
  });
  shot("A10", { t: tNb - .1, d: D - tNb, mv: "push", a: .5, in: "fade" });
  dim(tNb, null, .75, { bg: "#07090f" });
  stamp("UNTIL THEN · NO ONE CAN BUY", W * .5, H * .42, tNb + .2, { size: 3.4, rot: -2 });
  LK.done();
</script>
</body></html>
