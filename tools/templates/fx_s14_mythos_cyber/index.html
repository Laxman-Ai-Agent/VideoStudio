<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 14 (235.3-262 s): Mythos best at cyber -> vulnerabilities = weak spots, +14.4% -> 1 in 6 bugs no other AI found */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, move, fit, bg, title, retitle, card, chip, label, icon, num, count, vcard } = X;
  bg("lavender");
  const tM = at("mythos", 0.45), tC = at("cyber", 2.5), tPw = at("powerful", 5.1), tWk = at("weak", 8.2), tV = at("vuln", 9.0), t14 = at("p144", 16.0);
  const tCo = at("company", 19.3), t6 = at("six", 22.4), tN = at("none", 25.6);

  // A. the Mythos card starts centre, moves left; a big shield + CYBER SECURITY / MOST POWERFUL fill the right
  const t1 = title("Mythos 5.2: cyber expert", "Anthropic దగ్గర ఉన్న అత్యంత powerful cyber security model", 0.1, { kick: "MYTHOS 5.2", kickColor: PAL.violet });
  const cw = W * 0.24, ch = H * 0.5, m = vcard("myt", W / 2 - cw / 2, H * 0.34, cw, ch); pop(m, tM, { y: u * 6, opacity: 0 }, 0.6);
  move(m, tC - 0.3, W * 0.1, H * 0.34);
  const sh = icon("shield", W * 0.48, H * 0.36, u * 18, PAL.violet); pop(sh, tC, { scale: 0.4, opacity: 0 }, 0.5, E.pop);
  const c1 = chip("Cyber security", W * 0.66, H * 0.42, PAL.violet), c2 = chip("Most powerful", W * 0.66, H * 0.56, PAL.coral);
  [c1, c2].forEach((c) => (c.style.fontSize = u * 4.6 + "px")); pop(c1, tC + 0.2); pop(c2, tPw);

  // B. vulnerabilities: the code picture centre, then left; bug icon + definition right; +14.4% vs 5.1
  out([m, sh, c1, c2], tWk - 0.6); const t2 = retitle(t1, "What are vulnerabilities?", "Software లో దొంగలు దూరగలిగే weak spots", tWk - 0.3);
  const vc = card({ i: "vuln", x: W * 0.18, y: H * 0.3, w: W * 0.64, h: H * 0.6 }); pop(vc, tWk, { scale: 0.92, opacity: 0 }, 0.6);
  fit(vc, tV + 0.4, W * 0.05, H * 0.32, W * 0.5, H * 0.56);
  const bg1 = icon("bug", W * 0.62, H * 0.36, u * 9, PAL.red); pop(bg1, tV + 0.6, { scale: 0.3, opacity: 0 }, 0.45, E.pop);
  const cW = chip("Weak spot = vulnerability", W * 0.57, H * 0.52, PAL.red); pop(cW, tV + 0.8);
  const n = num(W * 0.6, H * 0.62, PAL.violet, 10); fade(n, t14 - 0.2, 0.3); count(n, 0, 14.4, t14 - 0.2, 0.9, (v) => "+" + v.toFixed(1) + "%");
  const l = label("more known bugs found vs 5.1", W * 0.76, H * 0.8); fade(l, t14 + 0.5);

  // C. a security company's report: six big bug icons across the frame, one turns violet = 1 IN 6
  out([vc, bg1, cW, n, l], tCo - 0.6); retitle(t2, "1 in 6 bugs", "మిగతా పెద్ద AI models ఏవీ పట్టుకోలేకపోయాయి", tCo - 0.3);
  const cR = chip("Security company report", W * 0.06, H * 0.33, PAL.violet); pop(cR, tCo);
  const bs = W * 0.1, gap = W * 0.04, bx = W / 2 - (6 * bs + 5 * gap) / 2;
  const bugs = [...Array(6)].map((_, i) => { const b = icon("bug", bx + i * (bs + gap), H * 0.44, bs, "#9AA0B4"); pop(b, tCo + 0.6 + i * 0.1, { y: u * 4, opacity: 0 }); return b; });
  const hot = icon("bug", bx + 3 * (bs + gap), H * 0.44, bs, PAL.violet); fade(hot, t6, 0.3); tl.fromTo(hot, { scale: 1 }, { scale: 1.25, duration: 0.4, ease: E.pop }, t6);
  const n6 = num(W * 0.4, H * 0.68, PAL.violet, 11); n6.textContent = "1 in 6"; pop(n6, t6 + 0.3, { scale: 0.8, opacity: 0 });
  const cN = chip("No other AI found it", W * 0.39, H * 0.88, PAL.coral); pop(cN, tN - 0.3);
  X.done();
</script></body></html>
