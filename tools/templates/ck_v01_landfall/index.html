<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ck.js"></script><script src="ck_geo.js"></script><script src="ck2.js"></script>
<style>/* 10 Cyclone_Akwan ck_v01_landfall: V01 Akwan: landfall Nov 20 anywhere between Nellore and Visakhapatnam; winds 110-130 km/h */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 0.0);
  const VIZ = [83.22, 17.69], VZN = [83.4, 18.11], NEL = [79.99, 14.44];
  const AP = [[82.25, 16.99, "KAKINADA"], [82.0, 16.58, "KONASEEMA"], [81.8, 17.0, "EAST GODAVARI"], [81.52, 16.54, "WEST GODAVARI"], [81.1, 16.71, "ELURU"], [81.14, 16.19, "KRISHNA"], [80.47, 15.9, "BAPATLA"]];

  atmo({ low: [.5, .3] });
  shot("A01", { t: 0, d: 8.4, mv: "spin", a: .7, in: "cloud", box: [0, 0, W, H * .46], sat: "SAT · BAY OF BENGAL", until: T(8.5) });
  head("CYCLONE <b>AKWAN</b>", .3, { y: H * .48, size: 10.5 });
  const m = bay([0, H * .58, W, H * .42], T(1.5), { view: [77.5, 12, 88, 19.5], until: T(8.5) });
  m.track([[87.5, 12.3, "", T(1.8)], [85.4, 14.2, "", T(2.4)], [83.3, 15.4, "NOV 20", T(2.9)]], { dash: true });
  m.pin(...NEL, "NELLORE", T(4.0), { c: K.yl });
  m.pin(...VIZ, "VISAKHAPATNAM", T(4.9), { c: K.yl, dx: -1.6, anchor: "end" });
  m.cone([[NEL[0] - .3, NEL[1]], [VIZ[0] - .2, VIZ[1] + .2], [VIZ[0] + 1.2, VIZ[1] - .3], [NEL[0] + 1.4, NEL[1] - .4]], T(5.9), { c: K.red });
  tag("LANDFALL · NOV 20", T(2.8), { y: H * .04, c: K.red, until: T(8.5) });
  shot("B08", { t: T(8.5), d: 6.6, mv: "push", in: "wipeU", box: [0, 0, W, H * .46] });
  dial(W * .5, H * .76, u * 30, T(8.7), { k: [[T(9), 60], [T(10.7), 110], [T(13.1), 130], [T(14.2), 120]], band: [110, 130] });
  te("గాలి వేగం <b>110 - 130 km/h</b>", T(10.9), { y: H * .58, align: "center" });
  CK.done();
</script>
</body></html>
