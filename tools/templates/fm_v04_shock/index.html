<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos 9x16 seq 04 (50.5-63.4 s): the shock: Mythos card covers the monitor eye -> presenter shock big, IT KNEW IT WAS TESTED, DOUBT stamp */
.bar { position: absolute; background: #050506; box-shadow: 0 0 0 1px #ffffff18; transform-origin: 0 50%; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, card, pop, head, redact, kick, vcard, stamp, slam, glitch, camera, bg } = K;
  K.$("root").style.background = "radial-gradient(120% 90% at 50% 40%, #151011, #050505)";
  bg({ seed: 104, tint: PAL.warn, bars: 9 });
  const st = K.$("stage"); camera(st, 1.06, 0.01);
  const fade = (e, t) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: true }, t);

  // A. THE SHOCK unredacts in coral; the Mythos card drops in
  const tS = at("shock", 0.7), tM = at("mythos", 2.2), tMo = at("monitor", 6.4), tEs = at("escape", 7.6);
  glitch(Math.max(0.05, tS - 0.3), PAL.warn);
  const kS = kick("THE BIGGEST", W * 0.07, H * 0.06); kS.style.fontSize = u * 3 + "px"; fade(kS, Math.max(0.1, tS - 0.3));
  const hS = head("<s>SHOCK</s>", W * 0.07, H * 0.085, 13); redact(hS, tS);
  const cw = W * 0.4, mv = vcard("myt", W * 0.3, H * 0.24, cw, cw * 1.38); pop(mv, tM - 0.2, { y: -H * 0.1, rotation: 6, opacity: 0 }, 0.7, E.in);
  const kT = kick("WHILE TESTING MYTHOS 5.2", W * 0.12, H * 0.58); kT.style.fontSize = u * 3 + "px"; fade(kT, tM + 0.4);

  // B. the thought monitor's eye opens; the Mythos card slides over it and a redaction bar blinds it
  const es = W * 0.5, ex = W * 0.12, ey = H * 0.22;
  tl.to(mv, { x: W * 0.24, y: H * 0.16, scale: 0.6, duration: 0.6, ease: E.io }, tMo - 0.5);
  tl.to(kT, { opacity: 0, duration: 0.3 }, tMo - 0.5);
  const eye = card({ i: "eye", x: ex, y: ey, w: es, h: es, shape: "round" }); pop(eye, tMo - 0.2, { scale: 0.4, opacity: 0 }, 0.6);
  const kM = kick("THOUGHT MONITOR", W * 0.12, H * 0.53); kM.style.fontSize = u * 3 + "px"; fade(kM, tMo + 0.2);
  tl.to(mv, { x: -W * 0.13, y: -H * 0.035, duration: 0.6, ease: E.io }, tEs);
  const bar = place(mk("div", "bar", st), ex - u * 2, ey + es * 0.4, es + u * 4, es * 0.2);
  tl.fromTo(bar, { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: E.io, immediateRender: true }, tEs + 0.4);
  const kC = kick("IT COVERED ITS EYES", W * 0.12, H * 0.57); kC.style.color = PAL.warn; kC.style.fontSize = u * 3 + "px"; fade(kC, tEs + 0.5);

  // C. presenter shock, big; IT KNEW IT WAS TESTED slams; DOUBT stamp
  const tTe = at("test", 9.7), tDb = at("doubt", 11.55);
  tl.to([kS, hS, mv, eye, bar, kM, kC], { opacity: 0, scale: 0.92, duration: 0.4, ease: E.out, stagger: 0.02 }, tTe - 0.5);
  const pr = card({ i: "pres_shock", x: W * 0.02, y: H * 0.22, w: W * 0.96, h: H * 0.54, shape: "cut" });
  pop(pr, tTe - 0.2, { scale: 1.3, opacity: 0, y: u * 6 }, 0.5, E.in); tl.to(pr, { scale: 1.05, duration: Math.max(0.5, D - tTe), ease: "none" }, tTe + 0.4);
  const s1 = head("IT KNEW IT", W * 0.07, H * 0.06, 9.5), s2 = head("<b>WAS TESTED</b>", W * 0.07, H * 0.125, 9.5);
  tl.set([s1.querySelector(".rt"), s2.querySelector(".rt")], { opacity: 1 }, 0);
  slam(s1, tTe); slam(s2, tTe + 0.4);
  stamp("DOUBT", W * 0.6, H * 0.6, PAL.myt, Math.min(tDb, D - 0.8), -10);
  K.done();
</script></body></html>
