<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l20_end: L20 close: fake online anti-aging pill ad stamped, ask a doctor, share, would you take 150? comment */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tOn = at("online", .4), tDo = at("doctor", 6), tSh = at("share", 7.9), tTk = at("take", 11.2), tCm = at("comment", 14.2);
  paper();
  photo("A35", { t: 0, d: tDo + .5, mv: "push", a: .5, in: "fade", until: tDo + .2 });
  wash(0, tDo, { a: .9 });
  const ad = place(mk("div", "at-card"), W * .56, H * .14); ad.style.setProperty("--c", K.gold);
  ad.innerHTML = `<div class="rl">SPONSORED · ONLINE AD</div><div class="nm">Reverse 20 years<br>in 30 days!</div><div class="rl" style="color:${K.warn}">MIRACLE ANTI-AGING PILL</div>`;
  ff(ad, tOn + .4, { opacity: 0, y: u * 6, rotation: 4 }, { opacity: 1, y: 0, rotation: 2 }, .6, E.snap); out(ad, tDo);
  head("Don't be <em>fooled</em>", tOn + .2, { y: H * .2, size: 8.5, until: tDo });
  stamp("FAKE", W * .74, H * .34, tOn + 2.2, { size: 7, until: tDo });
  photo("A36", { t: tDo - .2, d: tTk - tDo + 1, mv: "push", a: .5, in: "wipe", until: tTk });
  wash(tDo, tTk - .1, { a: .92 });
  head("Ask your <em>doctor</em> first", tDo, { y: H * .18, size: 7.5, c: K.green, until: tTk - .1 });
  kick("SHARE WITH FRIENDS & FAMILY", tSh, { y: H * .4, c: K.ink, until: tTk - .1 });
  photo("A02", { t: tTk - .2, mv: "push", a: .7, in: "iris" });
  wash(tTk, null, { bg: `radial-gradient(ellipse at 50% 45%, ${K.bg}f2 30%, ${K.bg}40 80%)` });
  head("Would you take <em>150</em> years?", tTk, { align: "center", y: H * .28, size: 8 });
  chip("YES", W * .38, H * .48, tTk + 1, { c: K.green, size: 3.4 });
  chip("NO", W * .56, H * .48, tTk + 1.2, { c: K.warn, size: 3.4 });
  kick("TELL US IN THE COMMENTS ↓", tCm - .3, { align: "center", y: H * .62, c: K.ink });
  AT.done();
</script>
</body></html>
