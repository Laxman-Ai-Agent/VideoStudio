<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l15_calment: L15 real record: Jeanne Calment 122 y 164 d (Arles, died 1997), unbroken; 2016 study ~115 limit on a 100-130 ruler */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tJe = at("jeanne", .6), tDi = at("died", 6.3), tNb = at("nobody", 8.6), tY = at("y2016", 11), tL = at("y115", 14.2);
  paper();
  photo("A25", { t: 0, d: tNb + .5, mv: "panL", a: .7, in: "wipe", until: tNb + .2 });
  wash(0, tNb, { a: .94 });
  kick("THE REAL RECORD", .1, { y: H * .12, until: tNb });
  card("Jeanne Calment", "ARLES, FRANCE · 1875–1997", W * .06, H * .18, tJe, { c: K.red, until: tNb });
  count(0, 122, tJe + 1, { y: H * .4, size: 22, unit: "YEARS", c: K.red, d: 1.8, until: tNb });
  kick("+ 164 DAYS", tJe + 2.6, { y: H * .64, c: K.ink, until: tNb });
  chip("DIED 1997", W * .32, H * .66, tDi, { c: K.ink, until: tNb });
  photo("A26", { t: tNb - .2, d: D - tNb + .5, mv: "push", a: .5, in: "drop", box: [W * .6, H * .06, W * .32, H * .34], plate: true, fig: "STILL UNBROKEN", rot: 2.5 });
  head("No one has <em>beaten</em> it", tNb, { y: H * .12, size: 6.5 });
  kick("2016 STUDY", tY, { y: H * .34, c: K.vio });
  const R = ruler(100, 130, [W * .08, H * .66, W * .84], tY + .1, { step: 1, major: 5 });
  R.mark(115, tL - .2, "~115 LIMIT", K.vio, { hi: 7 });
  R.mark(122, tL + .6, "CALMENT 122", K.red, { hi: 11 });
  AT.done();
</script>
</body></html>
