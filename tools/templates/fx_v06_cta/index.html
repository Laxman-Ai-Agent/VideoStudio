<style>/* 04_Fable_Mythos explainer 9x16 seq 06 (76.4-end): CTA: presenter points (lower 68%), comment box types FABLE, full video link */
.cm { position: absolute; padding: calc(var(--u) * 3) calc(var(--u) * 4); border-radius: calc(var(--u) * 2.4); background: #fff; color: #1B2140;
      font: 800 calc(var(--u) * 8) var(--font-head); box-shadow: 0 calc(var(--u) * 1.6) calc(var(--u) * 4) #0004; }
.cm small { display: block; font: 600 calc(var(--u) * 3.6) var(--font-head); color: #5B6178; margin-bottom: calc(var(--u) * 1); }
.lk { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: calc(var(--u) * 2); background: #10B981; color: #fff;
      font: 800 calc(var(--u) * 6) var(--font-head); }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, fade, pop, bg, title, typeIn, cut } = X;
  bg("purple");
  const tC = at("comment", 2.5), tF = at("fable", 3.2), tL = Math.min(at("link", 5.8), D - 0.9);

  title("Want the full video?", "కింద comment లో Fable అని type చేయండి", 0.1, { color: "#fff" });
  const pr = cut("pres_point", 0, H * 0.32, W, H * 0.68); pop(pr, 0.2, { y: H * 0.1, opacity: 0 }, 0.7);
  const cm = place(mk("div", "cm", undefined, "<small>Add a comment…</small><span></span>"), W * 0.08, H * 0.24, W * 0.84); pop(cm, Math.max(0.4, tC - 0.4));
  typeIn(cm.querySelector("span"), "Fable", tF, 10);
  const lk = place(mk("div", "lk", undefined, "Full video link ✓"), W * 0.14, H * 0.37, W * 0.72, H * 0.07); pop(lk, tL - 0.3, { scale: 0.7, opacity: 0 }, 0.45, E.pop);
  X.done();
</script></body></html>
