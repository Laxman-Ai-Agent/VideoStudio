<style>/* 17_Sleep_Apnea sa_l10_aiims: L10 AIIMS study: ~13% of men and ~5% of women; risk factors do not guarantee apnea but raise the chance; now the symptoms */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 203.0);
  shot("A02", { t: 0, d: 6.5, mv: "drift", a: .5, in: "dim", until: T(209.5) });
  tag("AIIMS STUDY · INDIA", T(203.3), { until: T(209.4) });
  tank(W * .56, H * .14, W * .08, H * .5, T(204.6), 13, { c: K.co, label: "MEN", until: T(209.4) });
  tank(W * .78, H * .14, W * .08, H * .5, T(206.2), 5, { c: K.moon, label: "WOMEN", until: T(209.4) });
  shot("A66", { t: T(209.5), d: 8, mv: "push", a: .6, in: "blink", until: T(217.5) });
  myth("Risk factor = <b>sleep apnea</b>", T(210.1), T(213.0), { x: W * .06, y: H * .16, stamp: "NOT ALWAYS", sc: K.lil, until: T(214.1) });
  head("BUT THE ODDS GO <b>UP</b>", T(215.2), { y: H * .7, size: 6, until: T(217.4) });
  shot("A30", { t: T(217.5), d: 2.2, mv: "push", in: "blink" });
  tag("THE SIGNS", T(217.9), { y: H * .1, c: K.moon });
  NW.done();
</script>
