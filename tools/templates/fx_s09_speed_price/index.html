<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 09 (128-148 s): 5.1 vs 5.2 speed bars -> 30% faster; price tag -20%; text splits into tokens; $8 input / $40 output */
.vh { position: absolute; left: 7%; top: 9%; font: 800 calc(var(--u) * 3.4) var(--font-head); color: #1B2140; }
.tr { position: absolute; left: 7%; right: 7%; height: calc(var(--u) * 3); border-radius: 99px; background: #EEF0F6; overflow: hidden; }
.tr div { height: 100%; border-radius: 99px; transform-origin: 0 50%; }
.wd { position: absolute; padding: calc(var(--u) * 1.2) calc(var(--u) * 2); border-radius: calc(var(--u) * 1); background: #fff; color: #1B2140;
      font: 700 calc(var(--u) * 4.4) var(--font-head); white-space: nowrap; box-shadow: 0 calc(var(--u) * .6) calc(var(--u) * 2) #1B214020; }
.pc b { display: block; font: 800 calc(var(--u) * 13) var(--font-head); letter-spacing: -.03em; line-height: 1; }
.pc i { display: block; margin-top: calc(var(--u) * 1.2); font: 700 calc(var(--u) * 2.8) var(--font-head); font-style: normal; color: #5B6178; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, fade, pop, out, move, bg, title, box, label, icon, num, count } = X;
  bg("cream");
  const tS = at("speed", 0.5), t30 = at("thirty", 5.75), t20 = at("twenty", 8.6), tPi = at("pieces", 12.4), tTo = at("tokens", 14.2), t8 = at("eight", 17.0), t40 = at("forty", 18.6);

  // A. speed: two wide panels race (5.1 grey, 5.2 green); on "30%" the green bar runs 30% further and the number lands right
  const t1 = title("Speed &amp; Price", "పాత Fable 5.1 తో పోలిస్తే Fable 5.2", tS);
  const pw = W * 0.88, ph = H * 0.2, rows = [["Fable 5.1", PAL.mute, 0.6, H * 0.36], ["Fable 5.2", PAL.green, 0.86, H * 0.6]];
  const panels = rows.map(([nm, c, f, y], i) => {
    const b = box(W * 0.06, y, pw, ph); b.innerHTML = `<div class="vh">${nm}</div><div class="tr" style="top:56%"><div style="background:${c}"></div></div>`;
    const bo = icon("bolt", 0, ph * 0.12, u * 3.2, c, b); bo.style.left = "auto"; bo.style.right = u * 3 + "px";
    pop(b, tS + 0.6 + i * 0.25, { x: -u * 6, opacity: 0 });
    tl.fromTo(b.querySelector(".tr div"), { scaleX: 0 }, { scaleX: f, duration: 2.4, ease: E.io, immediateRender: true }, tS + 1.4);
    return b;
  });
  panels.forEach((b, i) => move(b, t30 - 0.5, W * 0.06, rows[i][3], W * 0.56));
  tl.to(panels[1].querySelector(".tr div"), { scaleX: 1, duration: 0.8, ease: E.in }, t30);
  const n30 = num(W * 0.66, H * 0.38, PAL.green); fade(n30, t30 - 0.1, 0.3); count(n30, 0, 30, t30 - 0.1, 0.9, (v) => Math.round(v) + "%");
  const k30 = label("faster answers", W * 0.78, H * 0.56); fade(k30, t30 + 0.4);

  // B. price: the panels slide away, a big price tag drops in the centre and "-20%" takes the right half
  out(panels, t20 - 0.6, { x: -u * 10 }); out([n30, k30], t20 - 0.6);
  const t2 = title("Price 20% down", "price కూడా 20% తగ్గింది", t20 - 0.4); out(t1, t20 - 0.7);
  const tg = icon("tag", W / 2 - W * 0.17, H * 0.36, W * 0.34, PAL.coral);
  pop(tg, t20 - 0.4, { y: -u * 12, rotation: -12, opacity: 0 }, 0.7, E.pop);
  move(tg, t20 + 0.6, W * 0.08, H * 0.4, W * 0.3, W * 0.3 * 0.625);
  const n20 = num(W * 0.48, H * 0.42, PAL.coral, 16); fade(n20, t20 + 1.3, 0.3); count(n20, 0, 20, t20 + 1.3, 0.8, (v) => "-" + Math.round(v) + "%");

  // C. tokens (sky): one sentence in a white bar, then it splits into word chips spread across the frame
  bg("sky", tPi - 0.6);
  out([t2, tg, n20], tPi - 0.6);
  const t3 = title("What are tokens?", "AI చదివే, రాసే text ని చిన్న ముక్కలుగా లెక్కపెడతారు", tPi - 0.4);
  const words = ["AI", "reads", "text", "in", "tiny", "pieces"], chips = [];
  let sx = W * 0.08;
  words.forEach((w, i) => { const c = place(mk("div", "wd", undefined, w), sx, H * 0.5); sx += (w.length * 2.6 + 6.5) * u; chips.push(c);
    tl.fromTo(c, { opacity: 0, y: u * 3 }, { opacity: 1, y: 0, duration: 0.3, ease: E.in, immediateRender: true }, tPi + i * 0.06); });
  chips.forEach((c, i) => {
    tl.to(c, { left: W * (0.08 + (i % 3) * 0.31), top: H * (0.4 + Math.floor(i / 3) * 0.2), duration: 0.7, ease: E.io }, tTo - 0.2 + i * 0.05);
    tl.to(c, { backgroundColor: ["#DCEBFF", "#FDE7DD", "#E7F8EF"][i % 3], duration: 0.3 }, tTo + 0.4);
  });
  const kT = label("each piece = 1 token", W / 2, H * 0.84); fade(kT, tTo + 0.6);

  // D. price per one million tokens (mint): two big price cards fill the two halves
  bg("mint", t8 - 0.8);
  out([...chips, kT, t3], t8 - 0.8);
  title("Price per 1M tokens", "పది లక్షల tokens కి ధర", t8 - 0.6);
  [["$8", "input tokens", PAL.green, t8], ["$40", "output tokens", PAL.violet, t40]].forEach(([v, k, c, t], i) => {
    const b = box(W * (0.06 + i * 0.46), H * 0.36, W * 0.42, H * 0.5); b.className += " pc";
    b.innerHTML = `<div style="position:absolute;left:10%;top:18%"><b style="color:${c}"></b><i>${k}</i></div>`;
    icon(i ? "chat" : "file", W * 0.42 * 0.62, H * 0.12, W * 0.12, c, b);
    pop(b, t - 0.3, { y: u * 8, opacity: 0 }, 0.6);
    count(b.querySelector("b"), 0, parseInt(v.slice(1)), t - 0.1, 0.7, (x) => "$" + Math.round(x));
  });
  X.done();
</script></body></html>
