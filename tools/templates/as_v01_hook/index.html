<style>/* 15_Asthma as_v01_hook: V01 not just a cough, can be life-threatening, the inhaler you fear saves lives */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 0.0);
  shot("B01", { t: 0, d: 7.2, mv: "dive", a: .5, in: "mist", fy: .4, until: T(7.3) });
  head("NOT JUST", T(1.0), { y: H * .1, align: "center", size: 8, until: T(3.7) });
  head("A <b>COUGH</b>", T(1.5), { y: H * .17, align: "center", size: 10, until: T(3.7) });
  te("దగ్గు, ఆయాసం <b>మాత్రమే కాదు</b>", T(1.8), { y: H * .74, align: "center", until: T(3.7) });
  flow({ n: 110, alpha: .7, band: .2, cy: .5, t: T(3.7), choke: [[T(3.8), T(7.2), .85]], until: T(7.3) });
  head("LIFE", T(4.6), { y: H * .1, align: "center", size: 12, c: K.co, until: T(7.2) });
  head("THREATENING", T(4.9), { y: H * .19, align: "center", size: 8.4, c: K.co, until: T(7.2) });
  shot("B02", { t: T(7.2), d: 5.2, mv: "push", a: .6, in: "mist" });
  puff(W * .5, H * .45, T(8.4), { ang: -90, len: u * 40, n: 50 });
  head("THE INHALER", T(8.0), { y: H * .09, align: "center", size: 8 });
  head("YOU <b>FEAR</b>", T(8.4), { y: H * .16, align: "center", size: 8, c: K.hn });
  head("SAVES <b>LIVES</b>", T(9.8), { y: H * .7, align: "center", size: 9.5, c: K.mt });
  tag("DID YOU KNOW?", T(11.2), { align: "center", y: H * .82 });
  BK.done();
</script>
