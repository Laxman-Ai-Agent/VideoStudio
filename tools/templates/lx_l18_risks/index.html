<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l18_risks: L18 risks: 300-page filing fans out, 90 pages risks (AP), red AI sphere, company's own words, anthropic.com */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tP3 = at("p300", 1.4), tP9 = at("p90", 3.6), tAp = at("ap", 6.2), tDg = at("danger", 8.4), tWr = at("wrote", 12.5);
  grid();
  mono("THE IPO FILING", .1, { y: H * .08 });
  const pg = pages(5, [W * .62, H * .14, W * .2, H * .58], .2, { until: tDg - .2 });
  num(0, 300, tP3 - .2, { y: H * .16, unit: "PAGES", size: 13, d: 1, until: tDg - .2 });
  const pr = pages(3, [W * .62, H * .2, W * .2, H * .58], tP9, { red: true, until: tDg - .2 });
  num(0, 90, tP9, { y: H * .38, unit: "ON RISKS", size: 13, col: K.red, c: K.ink, d: .8, until: tDg - .2 });
  mono("SOURCE · AP", tAp, { y: H * .62, c: K.mute, until: tDg - .2 });
  shot("A23", { t: tDg - .1, d: D - tDg, mv: "orbit", a: .8, in: "flash" });
  dim(tDg, null, .5, { bg: "linear-gradient(90deg, #07090f 30%, #07090f00)" });
  head("In its <em>own</em> words", tDg + .2, { y: H * .2, size: 8, c: K.red });
  te("AI వల్ల <b>పెద్ద ప్రమాదం</b> రావచ్చు", tDg + .8, { y: H * .36, c: K.red, size: 3.6 });
  const fb = [W * .5, H * .44, W * .44, H * .3];
  shot("anthropic_site", { t: tWr - 1.5, d: D, mv: "push", a: .3, in: "slideR", box: fb, framed: true, clean: true, fx: .5, fy: .2 });
  mono("ANTHROPIC.COM", tWr - 1.2, { x: W * .5, y: H * .38, size: 1.6, c: K.mute });
  LK.done();
</script>
</body></html>
