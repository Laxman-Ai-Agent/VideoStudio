<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">

</div>

  const T = (x) => Math.max(0, x - 302.4);
  flow({ n: 110, alpha: .5, band: .7, choke: [[T(303), T(305), .5]], until: T(305.1) });
  head("IF <b>IGNORED</b>?", T(302.7), { y: H * .38, align: "center", size: 8.6, c: K.hn, until: T(305) });

  shot("A60", { t: T(306.8), d: 5.5, mv: "push", in: "wipeL", box: [W * .52, H * .1, W * .44, H * .6], glass: true, cap: "YEARS UNTREATED", c: K.co, until: T(312.3) });
  tag("OVER TIME", T(306.9), { align: "center", y: H * .04, c: K.hn, until: T(312.2) });

  shot("A08", { t: T(312.3), d: 6.7, mv: "push", a: .5, in: "mist" });
  tag("SEVERE ATTACKS", T(312.8), { c: K.co });
  shot("A59", { t: T(315.6), d: 3.4, mv: "push", in: "rise", box: [W * .38, H * .14, W * .28, H * .5], glass: true, cap: "OXYGEN" });
  shot("A58", { t: T(316.4), d: 2.6, mv: "push", in: "rise", box: [W * .69, H * .14, W * .28, H * .5], glass: true, cap: "NEBULISER" });
  BK.done();
</script>
