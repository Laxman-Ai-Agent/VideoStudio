<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l13_hotel: L13 hotel analogy: supplier panel -> hotel panel, arrow, labels, both grow */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tHo = at("hotel", 1.2), tVg = at("veg", 2), tSt = at("stake", 4.6), tGr = at("grow", 7.6);
  grid();
  mono("THINK OF IT LIKE THIS", 0, { align: "center", y: H * .04, c: K.gold });
  const bl = [W * .04, H * .12, W * .42, H * .5], br = [W * .54, H * .12, W * .42, H * .5];
  shot("A14", { t: .1, d: D, mv: "panR", a: .6, in: "wipe", box: bl, framed: true });
  mono("SUPPLIER = CHIP MAKERS", tVg, { x: W * .04, y: H * .66, size: 1.9 });
  shot("A15", { t: tSt - .5, d: D, mv: "push", a: .6, in: "wipe", dir: -1, box: br, framed: true });
  mono("HOTEL = ANTHROPIC", tSt - .3, { x: W * .54, y: H * .66, size: 1.9 });
  arrow(W * .47, H * .37, W * .53, H * .37, tSt, { c: K.gold, d: .4 });
  stamp("BUYS A STAKE", W * .5, H * .2, tSt + .2, { size: 2.4, c: K.gold, rot: -4 });
  arrow(W * .25, H * .8, W * .25, H * .7, tGr, { c: K.green });
  arrow(W * .75, H * .8, W * .75, H * .7, tGr + .2, { c: K.green });
  head("Both <em>grow</em>", tGr, { align: "center", y: H * .7, size: 7, c: K.green });
  LK.done();
</script>
</body></html>
