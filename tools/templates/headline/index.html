<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<style>
.card { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
        text-align: center; gap: calc(var(--u) * 3); }
#t { font-weight: 900; font-size: calc(var(--u) * 13); line-height: 1.15; max-width: 90%; }
.portrait #t { font-size: calc(var(--u) * 14); }
#t .word:last-child { color: var(--accent); }
#t .word:only-child { color: var(--text); }
#bar { width: calc(var(--u) * 22); height: calc(var(--u) * 1.1); background: var(--accent); transform-origin: left; }
#sub { font-size: calc(var(--u) * 4.5); opacity: .8; }
#glow { position: absolute; width: calc(var(--u) * 90); height: calc(var(--u) * 90); left: 50%; top: 50%;
        margin: calc(var(--u) * -45) 0 0 calc(var(--u) * -45); border-radius: 50%;
        background: radial-gradient(circle, rgba(255,196,0,.18), rgba(255,196,0,0) 65%); }
.grid { position: absolute; inset: 0; opacity: .07;
        background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
        background-size: calc(var(--u) * 8) calc(var(--u) * 8); }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div class="grid"></div><div id="glow"></div>
  <div class="safe"><div class="card"><div id="t"></div><div id="bar"></div><div id="sub"></div></div></div>
</div>
<script>
  const S = window.SCENE, p = S.params || {}, tl = gsap.timeline({ paused: true });
  tl.fromTo("#glow", { scale: 0.6, opacity: 0 }, { scale: 1.2, opacity: 1, duration: S.duration, ease: "sine.out" }, 0);
  const n = kinetic(document.getElementById("t"), S.text || "", tl, 0.1, 0.18);
  tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 0.2 + n * 0.18);
  document.getElementById("sub").textContent = p.sub || "";
  tl.fromTo("#sub", { opacity: 0 }, { opacity: 0.8, duration: 0.3 }, 0.4 + n * 0.18);
  finish(tl);
</script></body></html>
