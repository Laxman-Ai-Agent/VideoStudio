<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_v02_acid: V02 stomach makes hydrochloric acid to digest food, very strong, the walls are safe thanks to a protective layer; why does it rise? */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 10.6);
  shot("B03", { t: 0, d: 4.3, mv: "orbit", in: "melt", until: T(14.9) });
  head("HYDROCHLORIC <b>ACID</b>", T(12.8), { y: H * .1, size: 6.6, until: T(14.8) });
  fizz({ t: T(12.4), dens: [[0, .9]], until: T(14.8) });
  shot("A14", { t: T(14.9), d: 4.9, mv: "drift", in: "fade", until: T(19.8) });
  phScale(W * .07, H * .4, W * .86, T(15.4), { band: [1.5, 3.5, "STOMACH 1.5–3.5"], bandAt: T(16.0), marks: [[2, T(15.9), "VERY STRONG"]], until: T(19.7) });
  te("కడుపు గోడలకు <b>సమస్య రాదు</b>", T(17.6), { y: H * .7, c: K.por, until: T(19.7) });
  shield(0, H * .3, W, H * .4, T(19.8), { mucus: true, drops: T(20.2) });
  head("PROTECTIVE <b>LAYER</b>", T(21.1), { y: H * .14, size: 6.4, c: K.por, until: T(22.6) });
  head("SO WHY DOES IT <b>RISE</b>?", T(22.7), { y: H * .14, size: 5.8, c: K.fl });
  AC.done();
</script>
</body></html>
