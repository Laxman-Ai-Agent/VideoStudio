<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l02_myths: L02 myths: IPO = profit? / buy ANT now? panels stamped MYTH, velvet rope not on sale yet, red loss quarter */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tPf = at("profit", 3), tAnt = at("ant", 8.5), tWr = at("wrong", 11.5), tNy = at("notyet", 13.8), tLs = at("loss", 17.5);
  grid();
  const bl = [W * .04, H * .1, W * .44, H * .52], br = [W * .52, H * .1, W * .44, H * .52];
  const p1 = shot("A02", { t: 0, d: tNy, mv: "push", a: .6, in: "wipe", box: bl, framed: true, until: tNy });
  mono("MYTH 01", .3, { x: W * .04, y: H * .68, until: tNy });
  head("IPO = <em>profit</em>?", tPf - .4, { x: W * .04, y: H * .72, size: 6.5, until: tNy });
  const p2 = shot("A03", { t: tAnt - .5, d: tNy - tAnt + 1, mv: "push", a: .7, in: "wipe", dir: -1, box: br, framed: true, until: tNy });
  mono("MYTH 02", tAnt - .3, { x: W * .52, y: H * .68, until: tNy });
  head("Buy <em>ANT</em> now?", tAnt, { x: W * .52, y: H * .72, size: 6.5, until: tNy });
  tl.to([p1, p2], { filter: "grayscale(1) brightness(.6)", duration: .4 }, tWr);
  stamp("WRONG", W * .26, H * .36, tWr, { size: 6, until: tNy });
  stamp("WRONG", W * .74, H * .36, tWr + .25, { size: 6, rot: 6, until: tNy });
  flash(tWr, .25);
  shot("A04", { t: tNy - .1, d: tLs - tNy + .5, mv: "push", a: .8, in: "line", until: tLs });
  dim(tNy, tLs, .65, { bg: "linear-gradient(0deg, #07090f 10%, #07090f00 70%)" });
  mono("SHARES · NOT ON SALE", tNy + .2, { y: H * .56, c: K.gold, until: tLs - .1 });
  head("Not on sale <em>yet</em>", tNy + .4, { y: H * .62, size: 10, c: K.gold, until: tLs - .1 });
  shot("A17", { t: tLs - .1, d: D - tLs, mv: "crash", a: .6, in: "flash" });
  dim(tLs, null, .7, { bg: "linear-gradient(90deg, #07090f 25%, #07090f20)" });
  mono("LATEST QUARTER", tLs + .1, { y: H * .4, c: K.red });
  head("<em>Loss</em>, not profit", tLs + .3, { y: H * .47, size: 10, c: K.red });
  LK.done();
</script>
</body></html>
