<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_v02_book: V02 DNA = instruction book: cells photo + helix, 3D book, cells stop following, Sinclair card + THEORY */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tDn = at("dna", 2.4), tBk = at("book", 3.6), tFo = at("follow", 6.4), tHv = at("harvard", 8.5), tTh = at("theory", 10.1);
  paper();
  photo("A08", { t: 0, d: tBk + .5, mv: "push", a: .8, in: "iris", box: [0, 0, W, H * .5], until: tFo });
  helix([W * .5, H * .25, H * .36], .3, { r: W * .14, n: 18, c1: "#7CF3C0", c2: "#B9AEFF", until: tFo });
  head("<em>DNA</em>", tDn - .2, { y: H * .54, size: 16, c: K.green, until: tBk - .1 });
  const bk = book([W * .14, H * .54, W * .72, H * .14], tBk, { ribbons: [["EYE", K.vio, .62], ["SKIN", K.red, .84]], flips: 3, until: D });
  tl.to(bk, { y: H * .06, duration: .8, ease: E.io }, tBk + .2);
  head("= instruction <em>book</em>", tBk, { y: H * .5, size: 8.5, until: tFo });
  scatter(bk, tFo);
  head("Cells <em>stop following</em> it", tFo, { y: H * .12, size: 8 });
  card("David Sinclair", "HARVARD · GENETICIST", W * .07, H * .25, tHv - .3, { c: K.green });
  stamp("THEORY", W * .7, H * .44, tTh, { c: K.vio, size: 7 });
  AT.done();
</script>
</body></html>
