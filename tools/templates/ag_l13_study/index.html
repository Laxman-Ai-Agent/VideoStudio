<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l13_study: L13 where 150 comes from: big question over a 0-150 ruler, Nature Communications 2021, blood tests measure recovery = resilience */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tNa = at("nature", 3.6), tBl = at("blood", 7.3), tRe = at("res", 12.3);
  paper({ blob: .22 });
  head("Where does <em>150</em> come from?", .1, { align: "center", y: H * .26, size: 8.5, until: tNa - .2 });
  const R = ruler(0, 150, [W * .1, H * .56, W * .8], .4, { step: 10, major: 5, until: tNa - .2 });
  R.mark(150, 1.6, "150?", K.red);
  photo("A23", { t: tNa - .2, d: D - tNa + .5, mv: "push", a: .5, in: "page", box: [W * .56, H * .1, W * .38, H * .6], plate: true, fig: "FIG. 04 · BLOOD SAMPLES", rot: 1.5 });
  kick("2021 STUDY", tNa, { y: H * .14 });
  card("Nature Communications", "PEER-REVIEWED JOURNAL", W * .06, H * .2, tNa + .2, { c: K.ink });
  chip("BLOOD TESTS", W * .06, H * .44, tBl, { c: K.red, size: 2.3 });
  arrow(W * .2, H * .465, W * .27, H * .465, tBl + .5, { c: K.ink });
  chip("HOW FAST THE BODY RECOVERS", W * .28, H * .44, tBl + .8, { c: K.green, size: 2.3 });
  head("= <em>Resilience</em>", tRe - .2, { y: H * .54, size: 9, c: K.green });
  AT.done();
</script>
</body></html>
