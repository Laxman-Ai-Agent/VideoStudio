<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="cine.js"></script>
<style>/* 11_Thyroid cx_l15_options: L15 hyper options: 4-way split beta-blockers / anti-thyroid / radioactive iodine / surgery with labels, DOCTOR DECIDES */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, shot, split, title, te, kick, num, tag, ring, flash, leak, scope, embers, cam, out, arrow, slam } = CX;
  document.documentElement.style.setProperty("--u", u + "px");
  shot("T38", { t: 0, d: 2, mv: "push", a: .8, in: "fade" });
  kick("TREATING HYPER", .2, { align: "center", y: H * .12, until: 1.8 });
  split(["T38", "T27", "T39", "T40"], 1.9, { stag: 2, d: 8.2, until: 10 });
  const lab = (t, j, s) => kick(s, t, { x: W * (j * .25 + .025), y: H * .72, until: 10 });
  lab(2.1, 0, "BETA-BLOCKERS"); lab(4.5, 1, "ANTI-THYROID"); lab(5.9, 2, "RADIOACTIVE"); lab(7.9, 3, "SURGERY");
  title("OPTIONS", 9, { align: "center", y: H * .1, size: 12, until: 10 });
  shot("T36", { t: 10, d: D - 10, mv: "push", a: .8, in: "zoom" });
  title("DOCTOR <em>DECIDES</em>", 10.8, { slam: true, align: "center", y: H * .3, size: 15, c: K.teal });
  CX.done();
</script>
</body></html>
