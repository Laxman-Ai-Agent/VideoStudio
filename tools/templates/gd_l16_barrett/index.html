<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_l16_barrett: L16 narrowing (hard to swallow), lining turns intestine-like = Barrett's esophagus, a very small cancer risk */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 239.1);
  shot("A45", { t: 0, d: 2.5, mv: "push", in: "cut", until: T(241.4) });
  tag("NARROWING", .3, { c: K.fl, until: T(241.3) });
  shot("A46", { t: T(241.4), d: 2.2, mv: "push", in: "melt", until: T(243.6) });
  te("ఆహారం <b>మింగడం కష్టం</b>", T(241.8), { until: T(243.5) });
  shot("A47", { t: T(243.6), d: 7, mv: "orbit", a: .6, in: "zoom", until: T(250.3) });
  callout(W * .5, H * .5, W * .16, -H * .2, "LINING CHANGES", T(244.6), { until: T(250.2) });
  te("పేగుల పొరలాగా <b>మారిపోతుంది</b>", T(245.5), { until: T(250.2) });
  head("BARRETT'S <b>ESOPHAGUS</b>", T(247.9), { y: H * .12, size: 6, until: T(250.2) });
  shot("A47", { t: T(250.3), d: 5.5, mv: "drift", in: "fade" }); tl.to($("stage").lastChild, { opacity: .3, duration: .4 }, T(251.0));
  fizz({ t: T(250.3), dens: [[0, .25]] });
  chain([["వాపు", T(250.3), K.acid], ["పుండ్లు", T(250.5), K.fl], ["సన్నబడటం", T(250.7), K.fl], ["Barrett's", T(250.9), K.red], ["cancer (అరుదు)", T(253.7), "#8a1c2b"]], W * .08, H * .4, W * .84, T(250.3));
  head("A <b>SMALL</b> RISK · BUT REAL", T(252.2), { y: H * .14, align: "center", size: 5 });
  drench(T(255.8) - .02, { part: "in" });
  AC.done();
</script>
</body></html>
