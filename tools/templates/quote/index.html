<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<style>
.grid { position: absolute; inset: 0; opacity: .06;
        background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
        background-size: calc(var(--u) * 6) calc(var(--u) * 6); }
#col { margin: auto; width: 74%; display: flex; flex-direction: column; gap: calc(var(--u) * 2.4); }
.portrait #col { width: 100%; }
#qm { width: calc(var(--u) * 14); height: calc(var(--u) * 14); }
#qm path { fill: var(--accent); }
#q { font-weight: 800; font-size: calc(var(--u) * 7.2); line-height: 1.3; }
.portrait #q { font-size: calc(var(--u) * 8); }
#q .w { display: inline-block; white-space: pre; }
#bar { width: calc(var(--u) * 16); height: calc(var(--u) * 1); background: var(--accent); transform-origin: left; }
#by { font-weight: 900; font-size: calc(var(--u) * 5); }
#role { font-weight: 600; font-size: calc(var(--u) * 3.6); opacity: .7; margin-top: calc(var(--u) * -1.4); }
#role:empty { display: none; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div class="grid"></div>
  <div class="safe"><div id="col">
    <svg id="qm" viewBox="0 0 24 24"><path d="M3 21c0-6 1-11 5-14l2 2c-2 2-3 4-3 6h4v6H3zm11 0c0-6 1-11 5-14l2 2c-2 2-3 4-3 6h4v6h-8z"/></svg>
    <div id="q"></div><div id="bar"></div><div id="by"></div><div id="role"></div>
  </div></div>
</div>
<script>
  // Quote card: params.quote = {text, by, role}. The text must be the real quote (script / source), never invented.
  const S = window.SCENE, q = (S.params || {}).quote || {}, tl = gsap.timeline({ paused: true }), d = S.duration;
  const box = document.getElementById("q");
  const words = String(q.text || S.text || "").split(/(\s+)/).filter(Boolean);  // keep spaces so wrapping stays natural
  words.forEach(t => { const s = document.createElement("span"); s.className = "w"; s.textContent = t; box.appendChild(s); });
  const ws = [...box.querySelectorAll(".w")].filter(s => s.textContent.trim());
  const step = Math.min(0.12, Math.max(0.03, (d * 0.55) / Math.max(1, ws.length)));
  tl.fromTo("#qm", { scale: 0, opacity: 0, rotate: -20 }, { scale: 1, opacity: 1, rotate: 0, duration: 0.45, ease: "back.out(2.5)" }, 0);
  tl.fromTo(ws, { opacity: 0, y: U * 1.5 }, { opacity: 1, y: 0, duration: 0.3, stagger: step, ease: "power2.out" }, 0.25);
  const t = 0.25 + ws.length * step + 0.3;
  document.getElementById("by").textContent = q.by ? "— " + q.by : "";
  document.getElementById("role").textContent = q.role || "";
  tl.fromTo("#bar", { scaleX: 0 }, { scaleX: 1, duration: 0.35, ease: "power2.out" }, t);
  tl.fromTo("#by,#role", { opacity: 0, x: -U * 2 }, { opacity: 1, x: 0, duration: 0.35, stagger: 0.1 }, t + 0.1);
  finish(tl);
</script></body></html>
