<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ck.js"></script><script src="ck_geo.js"></script><script src="ck2.js"></script>
<style>/* 10 Cyclone_Akwan ck_l08_form: L08 how a cyclone forms: sea above 26.5 C, warm moist air rises, low pressure, air rushes in, Earth's spin turns it */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 100.9);
  atmo();
  shot("A09", { t: 0, d: 4.3, mv: "push", in: "cloud", until: T(105.2) });
  head("HOW DOES A <b>CYCLONE</b> FORM?", .3, { y: H * .66, size: 7.6, until: T(105.2) });
  xsec([W * .3, H * .08, W * .66, H * .86], T(105.2), { k: { heat: T(106.0), rise: T(110.7), low: T(115.5), inflow: T(118.3), spin: T(122.4) } });
  tag("SEA SURFACE", T(105.4), { x: W * .04, y: H * .1 });
  num(20, 26.5, T(106.3), { x: W * .04, y: H * .2, unit: "°C +", fmt: (v) => v.toFixed(1), c: K.or, d: 2 });
  list([["వేడి గాలి <b>పైకి</b>", T(110.7), "n"], ["<b>Low Pressure</b>", T(115.5), "n"], ["గాలి <b>లోపలికి</b>", T(118.3), "n"],
        ["భూమి తిరగడం → <b>spin</b>", T(122.4), "n"]], W * .04, H * .44, { size: 4 });
  CK.done();
</script>
</body></html>
