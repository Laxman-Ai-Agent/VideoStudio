<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_v06_fix: V06 sleep study finds it; CPAP machine keeps the airway open; losing weight and side sleeping help */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 72.4);
  shot("B09", { t: 0, d: 2.7, mv: "push", in: "dim", until: T(75.1) });
  head("<b>SLEEP STUDY</b>", T(73.6), { y: H * .1, size: 9, c: K.mint, until: T(75.0) });
  trace(W * .05, H * .6, W * .9, H * .12, T(73.0), { wave: "ecg", win: 4, label: "HEART", until: T(75.0) });
  shot("B06", { t: T(75.1), d: 4.8, mv: "breathe", in: "blink", until: T(79.9) });
  head("<b>CPAP</b>", T(75.8), { y: H * .08, size: 16, c: K.mint, until: T(79.8) });
  airway(W * .05, H * .56, W * .9, H * .2, T(77.6), { g: [[0, 0], [T(78.1), 0], [T(79.0), 1]], m: "HELD OPEN", until: T(79.8) });
  shot("B12", { t: T(79.9), d: 3, mv: "drift", in: "fade" });
  list([["బరువు తగ్గడం", T(79.9), true], ["పక్కకు తిరిగి పడుకోవడం", T(80.8), true]], W * .08, H * .16, { size: 4.4 });
  NW.done();
</script>
</body></html>
