<style>/* 12_Anthropic_IPO lx_l04_founders: L04 founders: real Dario photo framed, ex-OpenAI, Dario + Daniela name cards, founded 2021, Claude logo */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tOa = at("openai", .6), tDa = at("dario", 2.1), tDn = at("daniela", 3.3), tY = at("y2021", 4.6), tCl = at("claude", 6.6);
  grid();
  const fb = [W * .52, H * .08, W * .42, H * .7];
  shot("dario_stage", { t: 0, d: D, mv: "push", a: .5, in: "slideR", box: fb, fx: .45, fy: .3, framed: true });
  mono("PHOTO · TECHCRUNCH · CC BY 2.0", .6, { x: W * .52, y: H * .8, size: 1.4, c: K.mute });
  mono("THE FOUNDERS", 0, { y: H * .1 });
  chip("EX-OPENAI", W * .06, H * .16, tOa, { size: 2.2 });
  head("Dario <em>Amodei</em>", tDa, { y: H * .27, size: 7.5 });
  head("Daniela <em>Amodei</em>", tDn, { y: H * .4, size: 7.5 });
  mono("SIBLINGS · CO-FOUNDERS", tDn + .4, { y: H * .52, c: K.mute, size: 1.7 });
  num(2015, 2021, tY - .3, { y: H * .58, unit: "FOUNDED", size: 9, d: .8 });
  logo("claude_logo_w", [W * .06, H * .72, W * .26, H * .07], tCl, { in: "wipe" });
  LK.done();
</script>
</body></html>
