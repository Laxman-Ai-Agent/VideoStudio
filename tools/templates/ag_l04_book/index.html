<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l04_book: L04 instruction book: cell -> DNA helix -> 3D book opens, ribbons EYE / SKIN, bookmarks scatter with age, cell confused */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tDn = at("dna", .9), tBk = at("book", 2.4), tEy = at("eye", 4.6), tSk = at("skin", 6.2), tSc = at("scatter", 10.6), tSa = at("same", 13.6), tCf = at("confuse", 15.8);
  paper();
  photo("A08", { t: 0, d: tBk + .5, mv: "push", a: 1, in: "iris", until: tBk + .3 });
  kick("INSIDE EVERY CELL", .2, { y: H * .12, c: "#fff", shadow: 1, until: tBk });
  helix([W * .74, H * .48, H * .7], tDn - .3, { r: H * .1, n: 22, c1: "#7CF3C0", c2: "#B9AEFF", until: tBk + .2 });
  head("<em>DNA</em>", tDn, { x: W * .06, y: H * .3, size: 14, col: "#fff", c: "#7CF3C0", shadow: 1, until: tBk });
  photo("A09", { t: tBk - .2, d: D - tBk, mv: "drift", a: .5, in: "fade", until: D });
  wash(tBk - .1, null, { bg: `linear-gradient(90deg, ${K.bg}f8 35%, ${K.bg}c0 100%)` });
  const bk = book([W * .5, H * .22, W * .42, H * .48], tBk, { ribbons: [["EYE CELL", K.vio, .58], ["SKIN CELL", K.red, .8]], flips: 4 });
  head("A giant <em>instruction book</em>", tBk + .2, { y: H * .14, size: 6, until: tSc - .3 });
  kick("BOOKMARKS TELL EACH CELL WHICH PAGE", tEy - .2, { y: H * .32, c: K.ink, size: 1.7, until: tSc - .3 });
  tel("కంటి cell → <b>ఈ page</b>", tEy, { y: H * .4, until: tSc - .3 });
  tel("చర్మం cell → <b>ఆ page</b>", tSk, { y: H * .5, until: tSc - .3 });
  scatter(bk, tSc);
  kick("WITH AGE", tSc, { y: H * .24, until: tCf - .2 });
  head("Bookmarks <em>scatter</em>", tSc + .2, { y: H * .3, size: 7.5, until: tCf - .2 });
  tl.to(bk, { filter: "sepia(.6) saturate(.7)", duration: 1.2 }, tSc + .3);
  head("Book intact. <em>Cell lost.</em>", tSa, { y: H * .5, size: 6.2 });
  chip("WHICH PAGE?", W * .62, H * .74, tCf, { c: K.red, size: 2.4 });
  AT.done();
</script>
</body></html>
