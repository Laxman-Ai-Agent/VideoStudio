<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l12_kidney: L12 pig kidney with 10 gene edits worked ~130 days (Towana Looney); Life Biosciences eye trial FDA OK Jan 2026 */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tTn = at("ten", 2.6), tKd = at("kidney", 3.6), tDy = at("days", 5.4), tLf = at("life", 6.9), tJa = at("jan", 11.7);
  paper();
  photo("A21", { t: 0, d: tLf + .5, mv: "push", a: .6, in: "fade", until: tLf + .2 });
  wash(0, tLf, { a: .93 });
  card("Towana Looney", "PATIENT · GENE-EDITED PIG KIDNEY", W * .06, H * .12, .2, { c: K.red, until: tLf });
  dots(10, 10, [W * .07, H * .36, W * .3], tTn - .3, { cols: 10, c: K.vio, d: .8, until: tLf });
  kick("10 GENETIC CHANGES", tTn, { y: H * .44, c: K.vio, until: tLf });
  count(0, 130, tDy - 1, { y: H * .5, size: 17, pre: "~", unit: "DAYS WORKING", c: K.green, d: 1.4, until: tLf });
  photo("A22", { t: tLf - .2, d: D - tLf + .5, mv: "push", a: .9, in: "iris", fx: .5, fy: .5 });
  wash(tLf, null, { bg: `linear-gradient(90deg, ${K.bg}f2 30%, ${K.bg}00 70%)` });
  card("Life Biosciences", "REJUVENATION GENES → HUMAN EYE", W * .06, H * .14, tLf + .2, { c: K.vio });
  ["OCT4", "SOX2", "KLF4"].forEach((g, i) => toggle(W * (.07 + i * .11), H * .38, tLf + .8 + i * .2, tLf + 2 + i * .3, g, { c: K.vio }));
  stamp("FDA OK · JAN 2026", W * .22, H * .66, tJa, { c: K.green, size: 4, rot: -5 });
  kick("FIRST HUMAN TRIAL", tJa + .5, { y: H * .56, c: K.ink });
  AT.done();
</script>
</body></html>
