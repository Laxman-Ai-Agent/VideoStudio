<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>
/* 03_Wireless_Power seq 18 (258-277 s): the future: three goals (efficiency, distance, safe power) -> first uses: IoT sensors in remote places, implants, small drones */
.goal { position: absolute; display: flex; align-items: center; gap: calc(var(--u) * 2); font: 800 calc(var(--u) * 3.6) var(--font-head); color: var(--text); white-space: nowrap; }
.goal i { font-style: normal; width: calc(var(--u) * 6); height: calc(var(--u) * 6); border-radius: 50%; display: grid; place-items: center;
          background: var(--accent); color: #0A0E17; font-size: calc(var(--u) * 3); }
.up { color: var(--accent); }
.use { position: absolute; text-align: center; font: 800 calc(var(--u) * 2.5) var(--font-head); letter-spacing: .12em; color: var(--text); }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, $, mk, place, card, pop, out, dim, ring, type, rise, chip, camera, circuits } = K;
  circuits({ seed: 258, sparks: 60 });
  const st = $("stage"); camera(st, 1.04, 0.01);
  const tFu = at("future", 0.9), tTh = at("three", 3.7), tEf = at("eff", 5.8), tDi = at("dist", 7.1), tSa = at("safety", 8.2), tIo = at("iot", 13.5), tRe = at("remote", 14.5), tIm = at("implant", 17), tDr = at("drone", 18);

  // A. WHAT NEXT?: the researchers clip as a tall 4:5 card on the left, the question rises on the right
  const cw = H * 0.62 * 4 / 5, ch = H * 0.62, lab = card({ i: "lab2_clip", video: "lab2_clip_v", vstart: 0, vdur: 5.2, x: W * 0.06, y: H * 0.08, w: cw, h: ch, focus: [0.5, 0.45, 1.05] });
  pop(lab, 0.1, { x: -W * 0.2, opacity: 0, rotation: -3 }, 0.8, E.in);
  const q = place(mk("div", "kh", st, "What <em>next?</em>"), W * 0.42, H * 0.08); q.style.cssText += `font-size:${u * 8}px;opacity:0`; rise(q, tFu - 0.2, 0.12);
  const k = place(mk("div", "kt", st), W * 0.42, H * 0.24); k.style.cssText += `font-size:${u * 2.6}px;color:${PAL.text2}`; type(k, "RESEARCHERS FOCUS ON *3* THINGS", tTh - 0.2, 28);

  // B. the three goals type in as a numbered list on their words, each with a rising arrow
  [[tEf, "1", "Efficiency"], [tDi, "2", "Distance"], [tSa, "3", "Power, within safety limits"]].forEach(([t, n, s], i) => {
    const g = place(mk("div", "goal", st, `<i>${n}</i><span></span><b class="up">↑</b>`), W * 0.42, H * (0.32 + i * 0.12));
    tl.fromTo(g, { opacity: 0, x: u * 4 }, { opacity: 1, x: 0, duration: 0.35, ease: E.in }, t - 0.15);
    type(g.querySelector("span"), s, t, 26);
    tl.fromTo(g.querySelector(".up"), { y: u * 2, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: E.pop }, t + 0.5);
  });

  // C. FIRST USES: everything clears; three use cards of three shapes arrive on their words
  const tU = tIo - 0.9;
  tl.to(st.children, { opacity: 0, y: -u * 5, duration: 0.5, ease: E.out, stagger: 0.02 }, tU);
  const lay = mk("div", ""); lay.style.cssText = "position:absolute;inset:0"; $("shake").append(lay);
  const fu = place(mk("div", "kt", lay), W * 0.06, H * 0.06); fu.style.fontSize = u * 3 + "px"; type(fu, "FIRST USES", tU + 0.4, 20);
  const uses = [["iot", tIo, W * 0.06, H * 0.32, H * 0.32, "round", [0.5, 0.62, 1.4], "IOT SENSORS"],
                ["tower_drone", tRe, W * 0.29, W * 0.26, W * 0.26 * 9 / 16, "", [0.5, 0.5, 1.05], "REMOTE PLACES"],
                ["implant", tIm, W * 0.6, H * 0.3, H * 0.4, "", [0.62, 0.38, 1.5], "MEDICAL IMPLANTS"],
                ["drone", tDr, W * 0.8, H * 0.3, H * 0.3, "round", [0.5, 0.42, 1.3], "SMALL DRONES"]];
  uses.forEach(([nm, t, x, w, h, sh, f, lab], i) => {
    const y = H * 0.16 + (H * 0.42 - h) / 2, c = card({ i: nm, x, y, w, h, shape: sh, focus: f, parent: lay });
    pop(c, t - 0.15, { y: H * 0.25, opacity: 0, rotation: (i % 2 ? 4 : -4) }, 0.6, E.pop);
    const l = place(mk("div", "use", lay, lab), x - u * 2, H * 0.62, w + u * 4); tl.fromTo(l, { opacity: 0, y: u * 2 }, { opacity: 1, y: 0, duration: 0.3 }, t);
  });
  K.done();
</script></body></html>
