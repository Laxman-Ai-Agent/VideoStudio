<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_l18_prevent: L18 WHO: 25% preventable: helmet, pregnancy and birth care, child fever, BP and sugar, wash vegetables, cook meat, clean hands */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 260.3);
  hud("WHO ESTIMATE · PREVENTABLE", .1, { c: K.cy, until: T(265.4) });
  dots(100, 25, 20, [W * .08, H * .24, W * .5, H * .26], T(261.4), { c: K.cy, until: T(265.4) });
  num(0, 25, T(262.2), { x: W * .62, y: H * .2, unit: "%", size: 18, until: T(265.4) });
  te("epilepsy cases ని <b>ముందే ఆపొచ్చు</b>", T(263.2), { x: W * .08, y: H * .62, until: T(265.4) });
  const L = [["E51", "HELMET", 265.6], ["E39", "PREGNANCY CARE", 267.2], ["E15", "BIRTH CARE", 268.2], ["E52", "CHILD FEVER", 270.0],
             ["E53", "BP · SUGAR", 272.0], ["E54", "WASH VEGETABLES", 275.4], ["E55", "COOK MEAT WELL", 277.0], ["E56", "CLEAN HANDS", 278.9]];
  L.forEach(([k, lab, t], i) => { const col = i % 4, row = Math.floor(i / 4), x = W * (.03 + col * .2425), y = H * (.08 + row * .37);
    shot(k, { t: T(t), d: 4, mv: i % 2 ? "push" : "panR", in: i % 2 ? "lift" : "scan", box: [x, y, W * .225, H * .33], glass: true, cap: lab, until: T(280.6) }); });
  shot("E61", { t: T(280.6), d: 2, mv: "push", in: "through" });
  head("REAL <b>PROTECTION</b>", T(281.0), { y: H * .4, align: "center", size: 7.5 });
  SK.done();
</script>
</body></html>
