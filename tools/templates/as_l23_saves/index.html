<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l23_saves: L23 the small inhaler keeps asthma in control and saves lives; don't stop out of fear, no self-treatment, doctor's advice */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 395.4);
  shot("A03", { t: 0, d: 4.3, mv: "orbit", a: .7, in: "mist", until: T(399.7) });
  puff(W * .6, H * .4, T(396.6), { ang: 200 });
  head("THE SMALL <b>INHALER</b>", T(396.2), { y: H * .12, size: 6.4, until: T(399.6) });
  tag("KEEPS ASTHMA IN CONTROL", T(398.3), { y: H * .26, until: T(399.6) });
  shot("A69", { t: T(399.6), d: 10.2, mv: "breathe", a: 1, in: "mist" });
  flow({ n: 110, breathe: 4, alpha: .5, band: .5, cy: .4, t: T(400) });
  head("SAVES <b>LIVES</b>", T(400.0), { y: H * .12, align: "center", size: 8.6, until: T(401.6) });
  list([["భయంతో <b>మందులు ఆపకండి</b>", T(402.3), false], ["<b>సొంత చికిత్స</b> వద్దు", T(404.1), false], ["<b>Doctor సలహా</b> తప్పనిసరి", T(407.5), true]], W * .05, H * .14);
  BK.done();
</script>
</body></html>
