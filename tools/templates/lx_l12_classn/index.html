<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l12_classn: L12 Class N: same IPO price, non-voting shares, ballot crossed, boardroom */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tPr = at("price", .8), tCn = at("classn", 2.5), tVo = at("vote", 5.2);
  shot("A24", { t: 0, d: D, mv: "push", a: .7, in: "wipe" });
  dim(0, null, .7, { bg: "linear-gradient(90deg, #07090f 35%, #07090f30)" });
  mono("SAME IPO PRICE", tPr, { y: H * .18, c: K.gold });
  big("CLASS N", tCn - .2, { y: H * .26, size: 13 });
  mono("SUPPLIER SHARES", tCn + .3, { y: H * .46, c: K.mute, size: 1.8 });
  head("<em>No</em> vote", tVo - .2, { y: H * .56, size: 11, c: K.red });
  const bx = W * .72, by = H * .42, s = H * .3;
  const box = mk("div", "lk-fx"); box.style.inset = "auto"; place(box, bx - s / 2, by - s / 2, s, s);
  box.innerHTML = `<svg viewBox="0 0 100 100" width="${s}" height="${s}"><rect x="15" y="25" width="70" height="60" fill="none" stroke="${K.ink}" stroke-width="3"/>
    <rect x="35" y="15" width="30" height="16" fill="${K.bg}" stroke="${K.ink}" stroke-width="3"/><path class="x1" d="M10 10 L90 90" stroke="${K.red}" stroke-width="7"/>
    <path class="x2" d="M90 10 L10 90" stroke="${K.red}" stroke-width="7"/></svg>`;
  tl.fromTo(box, { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: .5, ease: E.pop, immediateRender: true }, tCn);
  box.querySelectorAll("path").forEach((p, i) => { p.style.strokeDasharray = 115;
    tl.fromTo(p, { strokeDashoffset: 115 }, { strokeDashoffset: 0, duration: .3, ease: E.io, immediateRender: true }, tVo + i * .2); });
  LK.done();
</script>
</body></html>
