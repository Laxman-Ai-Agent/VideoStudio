<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sm.js"></script><script src="sm2.js"></script>
<style>/* 16_Lung_Cancer lc_l14_survival: L14 US five-year survival: 67% when found in the lung, 12% after it spreads */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 233.4);
  shot("A51", { t: 0, d: 9, mv: "drift", in: "wipe", until: T(242.5), box: [0, 0, W * .5, H] });
  tag("US DATA · 5-YEAR SURVIVAL", T(233.7), { y: H * .07, until: T(249.2) });
  tag("FOUND IN THE LUNG", T(235.8), { x: W * .55, y: H * .16, c: K.ice, until: T(242.4) });
  people(100, 67, 10, [W * .55, H * .26, W * .26, H * .5], T(236.4), { c: K.ice, lag: 1.6, until: T(242.4) });
  num(0, 67, T(238.4), { x: W * .83, y: H * .4, size: 9, unit: "%", c: K.ice, until: T(242.4) });
  te("<b>ఐదేళ్ల</b> తర్వాత కూడా జీవించి", T(240.1), { x: W * .55, y: H * .82, size: 3, c: K.ice, until: T(242.4) });
  shot("A52", { t: T(242.5), d: 7, mv: "push", in: "wipe", box: [0, 0, W * .5, H] });
  tag("AFTER IT SPREADS", T(243.2), { x: W * .55, y: H * .16 });
  people(100, 12, 10, [W * .55, H * .26, W * .26, H * .5], T(243.4), { c: K.em, lag: 2.2 });
  num(0, 12, T(247.6), { x: W * .83, y: H * .4, size: 9, unit: "%" });
  te("కేవలం <b>12%</b> మాత్రమే", T(247.4), { x: W * .55, y: H * .82, size: 3 });
  SM.done();
</script>
</body></html>
