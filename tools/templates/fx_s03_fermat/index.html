<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 03 (31-49.5 s): 350 years -> Fermat card; proof -> computer check; 11 days vs 30 hours */
.tr { position: absolute; height: calc(var(--u) * 3.4); border-radius: 99px; background: #EEF0F6; overflow: hidden; }
.tr div { height: 100%; border-radius: 99px; transform-origin: 0 50%; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, move, fit, bg, title, retitle, card, chip, box, label, icon, num, count } = X;
  bg("cream");
  const tY = at("years", 0.4), tF = at("fermat", 5.2), tC = at("computer", 7.6), tD = at("days", 12.2), tFa = at("fable", 14.85), tH = at("hours", 16.5);

  // A. 350 YEARS counts up in the centre; on "Fermat" it slides left and the real portrait fills the right
  const t1 = title("A 350-year-old puzzle", "350 ఏళ్లుగా mathematicians ని తికమక పెట్టిన లెక్క", 0.1);
  const n = num(W * 0.36, H * 0.42, PAL.ink, 16); fade(n, tY, 0.3); count(n, 0, 350, tY, 1.4, (v) => Math.round(v) + " yrs");
  move(n, tF - 0.3, W * 0.07, H * 0.42);
  const fm = card({ i: "fermat", x: W * 0.58, y: H * 0.3, w: W * 0.34, h: H * 0.56, label: "Pierre de Fermat" }); pop(fm, tF, { x: u * 8, opacity: 0 }, 0.6);
  const cT = chip("Fermat's Last Theorem", W * 0.07, H * 0.62, PAL.coral); pop(cT, tF + 0.4);

  // B. the proof goes into a computer check: Fermat card -> arrow -> laptop with a check
  out([n, cT], tC - 0.5); const t2 = retitle(t1, "Proof → computer check", "proof ని computer check చేసే రూపంలోకి మార్చడం", tC - 0.2);
  fit(fm, tC - 0.3, W * 0.08, H * 0.32, W * 0.3, H * 0.5);
  const ar = icon("arrow", W * 0.42, H * 0.55, W * 0.14, PAL.ink); pop(ar, tC + 0.3, { x: -u * 4, opacity: 0 });
  const lp = icon("laptop", W * 0.6, H * 0.4, W * 0.3); pop(lp, tC + 0.5);
  const ck = icon("check", W * 0.72, H * 0.47, u * 7, PAL.green); pop(ck, tC + 1.0, { scale: 0.3, opacity: 0 }, 0.4, E.pop);

  // C. the race: 11 days (before) vs 30 hours (Fable 5.2), two full-width bars
  out([fm, ar, lp, ck], tD - 0.6); retitle(t2, "11 days → 30 hours", "ఇంతకుముందు 11 రోజులు, ఇప్పుడు Fable 5.2 తో 30 గంటలు", tD - 0.3);
  [["Before: 11 days", PAL.mute, 1, tD, H * 0.42], ["Fable 5.2: 30 hours", PAL.green, 0.11, tH, H * 0.64]].forEach(([t, c, f, at0, y]) => {
    const l = label(t, W * 0.06, y - u * 5.5); l.style.transform = "none"; fade(l, at0 - 0.2);
    const r = place(mk("div", "tr"), W * 0.06, y, W * 0.88); r.innerHTML = `<div style="background:${c}"></div>`; fade(r, at0 - 0.2);
    tl.fromTo(r.firstChild, { scaleX: 0 }, { scaleX: f, duration: f > 0.5 ? 1.6 : 0.5, ease: E.io, immediateRender: true }, at0);
  });
  const c2 = icon("check", W * 0.06 + W * 0.88 * 0.11 + u * 2, H * 0.64 - u * 1.8, u * 7, PAL.green); pop(c2, tH + 0.6, { scale: 0.3, opacity: 0 }, 0.4, E.pop);
  const kF = chip("Fable 5.2", W * 0.3, H * 0.78, PAL.green); pop(kF, tFa > tD ? tFa : tH);
  X.done();
</script></body></html>
