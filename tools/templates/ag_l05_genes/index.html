<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l05_genes: L05 2020 experiment: mouse, 3 Yamanaka genes as switches, optic nerve path eye -> brain regrows */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tTm = at("team", .5), tTh = at("three", 3), tYa = at("yama", 4.3), tSw = at("switch", 8.5), tRe = at("result", 10.8), tNv = at("nerve", 12), tGr = at("grew", 16.4);
  paper();
  photo("A03", { t: 0, d: tYa + 1, mv: "push", a: .6, in: "split", box: [0, 0, W * .5, H], until: tRe });
  kick("2020 · SINCLAIR LAB", .3, { x: W * .56, y: H * .14, until: tRe - .2 });
  head("Three genes<br>into the <em>eye</em>", tTh - .4, { x: W * .56, y: H * .2, size: 7, until: tRe - .2 });
  kick("YAMANAKA FACTORS", tYa, { x: W * .56, y: H * .44, c: K.green, until: tRe - .2 });
  ["OCT4", "SOX2", "KLF4"].forEach((g, i) => toggle(W * (.57 + i * .13), H * .52, tYa + .2 + i * .25, tSw + i * .3, g, { until: tRe - .2 }));
  tel("cell ని మళ్లీ <b>young state</b> వైపు", tSw + .3, { x: W * .56, y: H * .68, size: 3.2, until: tRe - .2 });
  photo("A12", { t: tRe - .2, d: D - tRe + .5, mv: "drift", a: .7, in: "fade" });
  wash(tRe - .1, null, { a: .55, bg: "linear-gradient(180deg, #0b1611b0, #0b161140 50%, #0b1611c0)" });
  kick("THE RESULT", tRe, { y: H * .1, c: "#fff", shadow: 1 });
  head("Optic nerve <em>regrew</em>", tRe + .2, { y: H * .15, size: 7.5, col: "#fff", c: "#7CF3C0", shadow: 1 });
  const ex = W * .16, ey = H * .55, bx = W * .84, by = H * .45;
  path(`M${ex} ${ey} C ${W * .35} ${H * .8}, ${W * .6} ${H * .2}, ${bx} ${by}`, tNv, { c: "#7CF3C0", w: .8, glow: 1, d: tGr - tNv, pulse: 1, pc: "#fff", rep: 4 });
  chip("EYE", ex - u * 3, ey + u * 3, tNv, { c: K.green });
  chip("BRAIN", bx - u * 4, by + u * 3, tNv + .4, { c: K.vio });
  rings(ex, ey, tNv, { c: "#7CF3C0" }); rings(bx, by, tGr, { c: "#B9AEFF", r: u * 9 });
  AT.done();
</script>
</body></html>
