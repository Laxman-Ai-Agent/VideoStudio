<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, shot, split, title, te, kick, num, tag, ring, flash, leak, scope, embers, cam, out, arrow, slam } = CX;
  document.documentElement.style.setProperty("--u", u + "px");
  shot("T15", { t: 0, d: D, mv: "push", a: .5, in: "fade" });

  title("UNDER-<em>ACTIVE</em>", 5.4, { x: W * .08, y: H * .7, size: 7, c: K.teal });
  arrow(false, W * .66, H * .45, H * .26, K.teal, 6.7); kick("TSH", 6.9, { x: W * .6, y: H * .64, c: K.teal });
  arrow(true, W * .8, H * .45, H * .26, K.amber, 7.7); kick("THYROID", 7.9, { x: W * .73, y: H * .64, c: K.amber });
  title("OVER-<em>ACTIVE</em>", 8.1, { x: W * .58, y: H * .7, size: 7 });
  CX.done();
</script>
