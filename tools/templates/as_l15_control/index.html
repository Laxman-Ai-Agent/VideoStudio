<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l15_control: L15 reliever needed often = asthma not controlled (tracker app) -> see the doctor, do not change medicines yourself */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 263.6);
  const bg = shot("A53", { t: 0, d: 10.4, mv: "push", a: .5, in: "mist" });
  tl.to(bg, { opacity: .3, duration: .5 }, 0);
  phone(`<div style="padding:12% 9% 0"><div style="font:700 ${u * 2.2}px var(--font-head)">Inhaler Log</div>
    <div style="font:600 ${u * 1.3}px var(--font-script);color:${K.mute};letter-spacing:.12em;margin-bottom:${u * 1.4}px">RELIEVER · THIS WEEK</div>
    ${["MON 2", "TUE 1", "WED 3", "THU 0", "FRI 2", "SAT 3", "SUN 2"].map((d) => { const [a, n] = d.split(" "); return `<div style="display:flex;align-items:center;gap:${u * .8}px;margin:${u * .5}px 0;font:600 ${u * 1.4}px var(--font-script)">
      <span style="width:${u * 3.4}px">${a}</span><span style="height:${u * 1.2}px;width:${n * u * 2.4 + 2}px;border-radius:${u}px;background:${+n > 1 ? K.co : K.mt}"></span><span>${n}</span></div>`; }).join("")}
    <div style="margin-top:${u * 1.6}px;font:700 ${u * 3.4}px var(--font-head);color:${K.co}">13 puffs</div>
    <div style="margin-top:${u * .8}px;background:${K.co}26;border:1px solid ${K.co};border-radius:${u}px;padding:${u * .8}px;font:600 ${u * 1.35}px var(--font-script)">
    ⚠ Asthma not well controlled. Talk to your doctor.</div></div>`, W * .62, H * .06, H * .82, T(264.4), { rot: 5, until: T(269.6) });
  head("OFTEN <b>NEEDED</b>?", T(265.4), { x: W * .06, y: H * .2, size: 6.6, c: K.hn, until: T(269.5) });
  meter(W * .08, H * .42, W * .3, u * 4, T(266.8), { from: 1, to: 1, steps: [[T(267.6), .25, K.co]], label: "ASTHMA CONTROL", until: T(269.5) });
  te("సరైన <b>Control</b> లో లేదు", T(268.0), { x: W * .06, y: H * .66, c: K.co, until: T(269.5) });
  tl.to(bg, { opacity: 1, duration: .6 }, T(269.5));
  te("సొంతంగా మందులు <b>మార్చకండి</b>", T(270.4), { x: W * .06, y: H * .12, c: K.co, size: 4.6 });
  tag("SEE YOUR DOCTOR", T(272.3), { x: W * .06, y: H * .26 });
  ring(W * .5, H * .45, T(272.6), { r: u * 22, n: 3 });
  BK.done();
</script>
</body></html>
