<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ck.js"></script><script src="ck_geo.js"></script><script src="ck2.js"></script>
<style>/* 10 Cyclone_Akwan ck_l05_birth: L05 how it started: circulation over the South Andaman Sea -> Low Pressure Area -> Depression Nov 15 (31-61 km/h) */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 61.3);
  const VIZ = [83.22, 17.69], CHE = [80.27, 13.08], NEL = [79.99, 14.44], MAC = [81.14, 16.19], BAP = [80.47, 15.9], ONG = [80.05, 15.5], AND = [92.73, 11.62];

  cloudwipe(0, { part: "out" });
  atmo({ low: [.7, .55] });
  const m = bay([0, 0, W, H], 0, { view: [76, 4, 100, 22], frame: false, start: [82, 5, 98, 16] });
  m.go([84, 6, 97, 15], .2, 2);
  m.pin(...AND, "ANDAMAN", T(62.4), { c: K.cy, s: .8 });
  const p = m.scr(93.5, 9.2, m.view([84, 6, 97, 15]));
  swirl(p[0], p[1], u * 13, T(63.6), { k: [[0, 0], [T(66.5), .25], [T(68.2), .45], [T(70.8), .7]], z: 8, until: T(78.4) });
  tag("SOUTH ANDAMAN SEA", T(61.8), { y: H * .1, until: T(66) });
  head("A <b>CIRCULATION</b>", T(64.0), { y: H * .74, size: 7, until: T(67.2) });
  ladder([["LOW PRESSURE", "", T(67.3)], ["DEPRESSION", "NOV 15", T(70.8)]], W * .05, H * .2, W * .36, H * .3, { until: T(78.4) });
  dial(W * .24, H * .72, u * 15, T(72.0), { k: [[T(72.2), 31], [T(76.0), 31], [T(77.5), 61]], band: [31, 61], max: 120, until: T(78.4) });
  te("గాలి వేగం <b>31 - 61 km/h</b>", T(76.0), { x: W * .45, y: H * .84, until: T(78.4) });
  CK.done();
</script>
</body></html>
