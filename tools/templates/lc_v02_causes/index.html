<!doctype html><html><head><meta charset="utf-8">

<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sm.js"></script><script src="sm2.js"></script>
<style>/* 16_Lung_Cancer lc_v02_causes: V02 causes: cigarette, beedi, second-hand smoke, pollution, chulha, diesel, asbestos, silica, radon, family history */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 9.95);
  const bgd = (k, t, until, o = .32) => { const e = shot(k, { t, d: until - t, mv: "push", a: .5, in: "fade", until }); tl.to(e, { opacity: o, duration: .6 }, t + .6); return e; };
  bgd("B10", T(10.0), T(25.0));
  const bw = W * .86, bh = bw * 9 / 16, bx = W * .07;
  shot("A02", { t: T(10.1), d: 4, mv: "push", in: "rise", box: [bx, H * .14, bw, bh], panel: true, cap: "CIGARETTE", until: T(12.7) });
  shot("A32", { t: T(10.7), d: 3.4, mv: "pull", in: "rise", box: [bx, H * .14 + bh + H * .03, bw, bh], panel: true, cap: "BEEDI", until: T(12.7) });
  shot("A33", { t: T(12.6), d: 1.6, mv: "push", in: "wipe", box: [bx, H * .2, bw, bh], panel: true, cap: "SECOND-HAND SMOKE", until: T(14.1) });
  te("పక్కవాళ్ళు వదిలే <b>పొగ</b>", T(12.8), { y: H * .2 + bh + H * .04, size: 4.4, until: T(14.0) });
  shot("B10", { t: T(14.0), d: 1.2, mv: "push", in: "smoke", cap: "AIR POLLUTION", until: T(15.1) });
  shot("B02", { t: T(15.0), d: 1.4, mv: "push", in: "wipe", cap: "CHULHA SMOKE", until: T(16.3) });
  shot("A38", { t: T(16.1), d: 2.4, mv: "panR", in: "zoom", box: [bx, H * .3, bw, bh], panel: true, cap: "DIESEL SMOKE", until: T(18.4) });
  const G = [["A37", "ASBESTOS", T(18.4)], ["A36", "SILICA DUST", T(19.2)], ["A39", "RADON GAS", T(22.0)], ["A40", "FAMILY HISTORY", T(23.0)]];
  const gw = W * .43, gh = gw * 9 / 16;
  G.forEach(([k, c, t], i) => shot(k, { t, d: 7, mv: i % 2 ? "pull" : "push", in: "rise", box: [W * .05 + (i % 2) * (gw + W * .04), H * .22 + Math.floor(i / 2) * (gh + H * .03), gw, gh], panel: true, cap: c }));
  head("ALL RAISE <b>RISK</b>", T(20.1), { y: H * .1, size: 8 });
  te("ఇవన్నీ <b>కారణాలు</b> కావచ్చు", T(23.9), { y: H * .5, size: 4.6 });
  SM.done();
</script>
</body></html>
