<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_v05_twist: V05 twist: no proof for 150; Jeanne Calment 122 on a ruler; can AI extend life or is it nature's limit? */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tTw = at("twist", .5), tJe = at("jeanne", 7), tAi = at("ai", 12.6), tLi = at("limit", 16.6);
  paper();
  photo("B07", { t: 0, d: tJe + .5, mv: "push", a: .6, in: "fade", until: tJe + .2 });
  wash(0, tJe, { bg: `linear-gradient(180deg, ${K.bg}f5 40%, ${K.bg}20 75%)` });
  kick("THE TWIST", tTw, { y: H * .08, until: tJe });
  head("No proof for <em>150</em>", tTw + .3, { y: H * .13, size: 10, until: tJe });
  photo("B09", { t: tJe - .2, d: D - tJe + .5, mv: "push", a: .5, in: "wipe" });
  wash(tJe, null, { bg: `linear-gradient(180deg, ${K.bg}f8 45%, ${K.bg}30 80%)` });
  card("Jeanne Calment", "WORLD'S LONGEST LIFE", W * .07, H * .07, tJe, { c: K.red });
  count(0, 122, tJe + .6, { y: H * .17, size: 26, unit: "YEARS", c: K.red, d: 1.6 });
  const R = ruler(0, 150, [W * .08, H * .42, W * .84], tJe + 1, { step: 10, major: 5 });
  R.mark(122, tJe + 2.4, "122", K.red, { hi: 7 }); R.mark(150, tAi - .6, "150?", K.vio, { hi: 7 });
  chip("AI EXTENDS LIFE?", W * .08, H * .52, tAi, { c: K.vio, size: 4 });
  chip("OR NATURE'S LIMIT?", W * .3, H * .6, tLi - .4, { c: K.ink, size: 4 });
  AT.done();
</script>
</body></html>
