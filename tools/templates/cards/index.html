<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<style>
.grid { position: absolute; inset: 0; opacity: .06;
        background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
        background-size: calc(var(--u) * 6) calc(var(--u) * 6); }
#col { margin: auto; width: fit-content; min-width: 40%; max-width: 70%; display: flex; flex-direction: column; gap: calc(var(--u) * 2.2); align-items: stretch; }
.portrait #col { width: 100%; }
#t { font-weight: 900; font-size: calc(var(--u) * 8); text-align: center; line-height: 1.1; }
#t:empty { display: none; }
.card { background: var(--panel); border-radius: calc(var(--u) * 2); padding: calc(var(--u) * 2.4) calc(var(--u) * 3);
        box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 3) rgba(0,0,0,.18); }
.tone-light .card { background: #fff; }
.item { display: flex; align-items: center; gap: calc(var(--u) * 1.6); font-weight: 800; font-size: calc(var(--u) * 4.6);
        padding: calc(var(--u) * .9) 0; border-bottom: 1px solid rgba(127,127,127,.25); }
.item:last-child { border-bottom: 0; }
.chk { flex: none; width: calc(var(--u) * 3.6); height: calc(var(--u) * 3.6); border-radius: 50%; background: var(--accent); position: relative; }
.chk::after { content: ""; position: absolute; left: 32%; top: 18%; width: 25%; height: 45%; border: solid #fff;
              border-width: 0 calc(var(--u) * .5) calc(var(--u) * .5) 0; transform: rotate(45deg); }
#col.wide { min-width: 62%; max-width: 86%; }
.rowcard .rt { font-weight: 900; font-size: calc(var(--u) * 3.8); padding-bottom: calc(var(--u) * .8); margin-bottom: calc(var(--u) * 1.6);
               border-bottom: calc(var(--u) * .35) solid var(--accent); display: inline-block; align-self: flex-start; }
.rowcard .tiles { display: flex; gap: calc(var(--u) * 2); }
.tile { flex: 1; display: flex; flex-direction: column; align-items: center; gap: calc(var(--u) * 1); padding: calc(var(--u) * 1.8) calc(var(--u) * 1);
        background: color-mix(in srgb, var(--accent) 22%, transparent); border-radius: calc(var(--u) * 1.6); }
.tile .ic { font-size: calc(var(--u) * 7.5); line-height: 1.15; font-family: "Segoe UI Emoji", "Noto Color Emoji", sans-serif; }
.tile .lb { font-weight: 800; font-size: calc(var(--u) * 3.4); text-align: center; line-height: 1.2; }
#btn { align-self: center; display: flex; align-items: center; gap: calc(var(--u) * 1.4); background: var(--accent); color: #fff;
       font-weight: 900; font-size: calc(var(--u) * 5); padding: calc(var(--u) * 1.6) calc(var(--u) * 4); border-radius: calc(var(--u) * 5);
       box-shadow: 0 calc(var(--u) * 1) calc(var(--u) * 2.5) rgba(0,0,0,.25); }
#btn svg { width: calc(var(--u) * 5); height: calc(var(--u) * 5); }
#stat .lab { font-weight: 700; font-size: calc(var(--u) * 4); opacity: .7; }
#stat .row { display: flex; align-items: center; justify-content: space-between; gap: calc(var(--u) * 2); }
#stat .val { font-weight: 900; font-size: calc(var(--u) * 13); line-height: 1; white-space: nowrap; }
.portrait #stat .val { font-size: calc(var(--u) * 20); }
.portrait #stat .lab { font-size: calc(var(--u) * 5.5); }
#stat .arrow { font-weight: 900; font-size: calc(var(--u) * 10); line-height: 1; }
#stat > svg { width: 100%; height: calc(var(--u) * 12); margin-top: calc(var(--u) * 1); }
#stat > svg path { fill: none; stroke-width: calc(var(--u) * .7); stroke-linecap: round; stroke-linejoin: round; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div class="grid"></div>
  <div class="safe"><div id="col"><div id="t"></div></div></div>
</div>
<script>
  // UI cards: optional title, a checklist card (params.items), a stat card (params.stat: value from the
  // script/plan only; no trend line: it would be invented data), and a call-to-action button.
  const S = window.SCENE, p = S.params || {}, tl = gsap.timeline({ paused: true }), d = S.duration;
  const col = document.getElementById("col"), add = (html, cls, id) => {
    const el = document.createElement("div");
    if (cls) el.className = cls;
    if (id) el.id = id;
    el.innerHTML = html;
    col.appendChild(el);
    return el;
  };
  kinetic(document.getElementById("t"), S.text, tl, 0.05);
  let t = 0.35;
  const items = (p.items || []).slice(0, 5);
  if (items.length) {
    const card = add("", "card");
    tl.fromTo(card, { opacity: 0, y: U * 4, scale: 0.96 }, { opacity: 1, y: 0, scale: 1, duration: 0.35, ease: "power3.out" }, t);
    const step = Math.min(0.45, Math.max(0.2, (d * 0.6) / items.length));
    items.forEach((txt, i) => {
      const row = document.createElement("div");
      row.className = "item";
      row.innerHTML = '<i class="chk"></i><span></span>';
      row.querySelector("span").textContent = txt;
      card.appendChild(row);
      tl.fromTo(row, { opacity: 0, x: -U * 3 }, { opacity: 1, x: 0, duration: 0.3, ease: "power2.out" }, t + 0.2 + i * step);
      tl.fromTo(row.querySelector(".chk"), { scale: 0 }, { scale: 1, duration: 0.25, ease: "back.out(3)" }, t + 0.3 + i * step);
    });
    t += 0.3 + items.length * step;
  }
  const rows = (p.rows || []).slice(0, 3);  // info card: [{title, items: [{icon: "⏰", label}]}], up to 4 tiles a row
  if (rows.length) col.classList.add("wide");
  rows.forEach(r => {
    const card = add("", "card rowcard"), items = (r.items || []).slice(0, 4);
    const title = document.createElement("div");
    title.className = "rt";
    title.textContent = r.title || "";
    const tiles = document.createElement("div");
    tiles.className = "tiles";
    card.append(title, tiles);
    tl.fromTo(card, { opacity: 0, y: U * 5 }, { opacity: 1, y: 0, duration: 0.4, ease: "power3.out" }, t);
    items.forEach((it, i) => {
      const tile = document.createElement("div");
      tile.className = "tile";
      tile.innerHTML = '<div class="ic"></div><div class="lb"></div>';
      tile.querySelector(".ic").textContent = it.icon || "";
      tile.querySelector(".lb").textContent = it.label || "";
      tiles.appendChild(tile);
      tl.fromTo(tile, { scale: 0.5, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(2.2)" }, t + 0.25 + i * 0.12);
    });
    t += 0.5 + items.length * 0.12;
  });
  if (p.stat) {
    // no invented data (user 2026-11-11, "800 W down arrow"): an arrow only when params.stat.trend is given, never a drawn trend line
    const trend = ["up", "down"].includes(p.stat.trend) ? p.stat.trend : "", up = trend === "up", c = up ? "#1f9d55" : "var(--warn)";
    const card = add('<div class="lab"></div><div class="row"><div class="val"></div><div class="arrow"></div></div>', "card", "stat");
    card.querySelector(".lab").textContent = p.stat.label || "";
    const val = card.querySelector(".val");
    val.textContent = String(p.stat.value || "").replace(/(\d)\s*:\s*(\d)/g, "$1:$2");  // "1 : 811" reads as the ratio 1:811
    const ar = card.querySelector(".arrow");  // SVG arrow: brand fonts may not have the arrow glyph
    if (trend) ar.innerHTML = `<svg viewBox="0 0 24 24" style="width:calc(var(--u)*10);height:calc(var(--u)*10)"><path fill="${up ? "#1f9d55" : "currentColor"}" d="${
      up ? "M12 3l8 9h-5v9H9v-9H4z" : "M12 21l8-9h-5V3H9v9H4z"}"/></svg>`;
    ar.style.color = c;
    const row = card.querySelector(".row");  // the value stays on ONE line: shrink the font until it fits next to the arrow
    const fit = () => {
      let fs = parseFloat(getComputedStyle(val).fontSize);
      for (let i = 0; i < 40 && val.offsetWidth + ar.offsetWidth + U * 2 > row.clientWidth && fs > U * 4; i++) { fs *= 0.94; val.style.fontSize = fs + "px"; }
    };
    fit();
    if (document.fonts && document.fonts.ready) document.fonts.ready.then(fit);
    tl.fromTo(card, { opacity: 0, y: U * 4 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, t);
    tl.fromTo(ar, { opacity: 0, y: up ? U * 3 : -U * 3 }, { opacity: 1, y: 0, duration: 0.3 }, t + 0.7);
    t += 0.8;
  }
  if (p.button) {
    const b = add('<svg viewBox="0 0 24 24"><path fill="#fff" d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg><span></span>', "", "btn");
    b.querySelector("span").textContent = p.button;
    tl.fromTo(b, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(2.5)" }, t);
    tl.to(b, { scale: 0.93, duration: 0.1, yoyo: true, repeat: 1 }, Math.min(d - 0.4, t + 0.8));  // a tap
  }
  finish(tl);
</script></body></html>
