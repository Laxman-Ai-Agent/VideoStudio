<style>/* 18 Acidity_GERD gd_l11_triggers: L11 triggers in some people: coffee, tea, fatty food, spicy food, tomato, chocolate; not the same for everyone */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">

</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 176.0);
  const b = shot("A37", { t: 0, d: 11, mv: "drift", in: "fade" });
  tag("COMMON TRIGGERS", .1, { y: H * .08 });
  [["COFFEE", T(176.4)], ["TEA", T(177.1)], ["FATTY FOOD", T(177.6)], ["SPICY FOOD", T(178.5)], ["TOMATO", T(179.6)], ["CHOCOLATE", T(180.2)]].forEach(([n, t0], i) =>
    tag(n, t0, { x: W * (i % 2 ? .52 : .3), y: H * (.22 + Math.floor(i / 2) * .12), c: [K.acid, K.por, K.fl][i % 3], until: T(183.7) }));
  head("CAN <b>TRIGGER</b> IT", T(182.4), { y: H * .64, size: 5.4, until: T(183.7) });
  tl.to(b, { opacity: .3, duration: .5 }, T(183.6));
  people(21, 3, W * .2, H * .2, W * .6, T(183.8), { cols: 7, off: 1, lit: T(184.9), c: K.fl });
  head("NOT THE <b>SAME</b> FOR EVERYONE", T(184.4), { y: H * .74, align: "center", size: 5 });
  AC.done();
</script>
