<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_l14_hospital: L14 go to hospital when: over 5 min, back to back, breathing, not waking, injury, in water, pregnant, first seizure */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 189.0);
  const bg = shot("E40", { t: 0, d: 14, mv: "drift", in: "fade" }); tl.to(bg.im, { filter: "brightness(.35) blur(4px)", duration: .6 }, .2);
  hud("HOSPITAL · IMMEDIATELY IF", .1, { c: K.mg });
  num(0, 5, T(189.8), { x: W * .05, y: H * .18, unit: "MIN +", c: K.mg, d: .9, size: 15 });
  const I = [["ఒకదాని వెంట ఒకటి", 191.3], ["ఊపిరి ఆడకపోతే", 193.1], ["మెలకువ రాకపోతే", 194.5], ["గాయం అయితే", 196.1],
             ["నీళ్లలో వస్తే", 197.1], ["గర్భిణీకి వస్తే", 198.3], ["మొదటి seizure", 200.0]];
  list(I.slice(0, 4).map(([h, t]) => [h, T(t), null]), W * .05, H * .44, { until: T(201.4) });
  list(I.slice(4).map(([h, t]) => [h, T(t), null]), W * .36, H * .44, { until: T(201.4) });
  shot("E50", { t: T(197.1), d: 2, mv: "push", in: "lift", box: [W * .68, H * .1, W * .28, H * .3], glass: true, cap: "IN WATER", c: K.mg, until: T(201.4) });
  shot("E39", { t: T(198.3), d: 2, mv: "push", in: "lift", box: [W * .68, H * .44, W * .28, H * .3], glass: true, cap: "PREGNANT", c: K.mg, until: T(201.4) });
  shot("E38", { t: T(201.5), d: 2.2, mv: "dive", a: .5, in: "flash" });
  head("<b>HOSPITAL</b> NOW", T(201.6), { y: H * .4, align: "center", c: K.mg, size: 10 });
  SK.done();
</script>
</body></html>
