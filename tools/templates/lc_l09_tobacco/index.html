<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 138.55);
  smoke({ dens: [[0, .9], [9, .6], [14, 1]], alpha: .25, c: "#c7b6a6" });
  shot("A31", { t: 0, d: 9.4, mv: "push", in: "smoke", until: T(147.9) });
  head("WHY DOES IT <b>HAPPEN</b>?", T(138.8), { y: H * .12, size: 6.4, until: T(141.4) });
  doc(`<h3>Lung cancer · key facts</h3><div style="color:#6b625a">World Health Organization</div><div class="rule"></div>
    <b>Main cause:</b> tobacco smoking<br><br>Share of preventable lung cancer cases caused by tobacco:<br><span class="hl"><b>60–70%</b></span><br><br>
    Other causes: second-hand smoke, air pollution, indoor smoke from solid fuels, radon, asbestos.`, W * .52, H * .1, W * .42, H * .64, T(141.4), { until: T(147.8) });
  num(0, 70, T(144.4), { x: W * .06, y: H * .3, unit: "%", fmt: (v) => v < 60 ? Math.round(v) : "60–" + Math.round(v), d: 1.2, until: T(147.8) });
  tag("TOBACCO", T(146.4), { x: W * .06, y: H * .62, until: T(147.8) });
  shot("A02", { t: T(147.9), d: 4.2, mv: "push", in: "rise", box: [W * .04, H * .1, W * .45, H * .62], panel: true, cap: "CIGARETTE", until: T(152.0) });
  shot("A32", { t: T(148.9), d: 3.2, mv: "pull", in: "rise", box: [W * .51, H * .1, W * .45, H * .62], panel: true, cap: "BEEDI", until: T(152.0) });
  te("రెండిటి <b>పొగ</b> ప్రమాదమే", T(150.5), { y: H * .8, align: "center", until: T(151.9) });
  shot("A33", { t: T(152.0), d: 5.4, mv: "push", in: "smoke", fx: .4 });
  head("SECOND-HAND <b>SMOKE</b>", T(153.7), { y: H * .14, size: 6 });
  te("పక్కవాళ్ళ <b>పొగ</b> వల్ల కూడా risk", T(155.0), { y: H * .76 });
  SM.done();
</script>
