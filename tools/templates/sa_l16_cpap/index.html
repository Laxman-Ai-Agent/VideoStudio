<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l16_cpap: L16 CPAP machine: a mask sends steady air pressure that keeps the throat open; must be used every night; more options */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 314.5);
  shot("A46", { t: 0, d: 5, mv: "push", a: .7, in: "dim", until: T(319.4) });
  tag("THE MOST USED TREATMENT", T(316.4), { until: T(319.3) });
  head("<b>CPAP</b>", T(317.8), { x: W * .62, y: H * .34, size: 15, c: K.mint, until: T(319.3) });
  shot("A47", { t: T(319.4), d: 6.4, mv: "breathe", in: "blink", box: [0, 0, W * .52, H], until: T(325.8) });
  airway(W * .55, H * .14, W * .41, H * .36, T(320.0), { g: [[0, 0], [T(321.0), 0], [T(322.4), 1]], l: "MASK · AIR PRESSURE", m: "HELD OPEN", until: T(325.7) });
  trace(W * .55, H * .55, W * .41, H * .18, T(322.4), { ev: [[0, T(340), "calm"]], label: "STEADY BREATHING", until: T(325.7) });
  te("గాలి దారి <b>మూసుకుపోదు</b>", T(323.5), { x: W * .55, y: H * .78, size: 3.4, until: T(325.7) });
  shot("A57", { t: T(325.8), d: 7.4, mv: "drift", in: "dim" });
  head("EVERY <b>NIGHT</b>", T(328.5), { y: H * .14, size: 6.4, c: K.moon });
  ["MON", "TUE", "WED", "THU", "FRI", "SAT", "SUN"].forEach((d, i) => tag(d + " ✓", T(328.8) + i * .2, { x: W * .07 + i * W * .125, y: H * .36, c: K.mint, until: T(331.2) }));
  head("MORE <b>OPTIONS</b>", T(331.4), { y: H * .7, size: 5.6, c: K.lil });
  NW.done();
</script>
</body></html>
