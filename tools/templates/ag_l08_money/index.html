<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l08_money: L08 money: real Altman photo + $180M into Retro (10 healthy years goal), Altos Labs ~$3B (Bezos-backed) */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tAl = at("altman", .2), tM = at("m180", 2.6), tTn = at("ten", 4.4), tBz = at("bezos", 7.6), tAo = at("altos", 8.9), tB3 = at("b3", 10.6);
  paper();
  photo("altman", { t: 0, d: tBz + 1, mv: "push", a: .5, in: "slide", dir: -1, box: [W * .06, H * .1, W * .34, H * .6], plate: true, fig: "SAM ALTMAN · TECHCRUNCH · CC BY 2.0", fy: .3, rot: -2, until: tBz });
  kick("INVESTED IN RETRO BIOSCIENCES", tAl + .3, { x: W * .48, y: H * .16, until: tBz - .1 });
  count(0, 180, tM - .4, { x: W * .48, y: H * .22, size: 20, pre: "$", unit: "MILLION", c: K.green, d: 1.4, until: tBz - .1 });
  chip("GOAL", W * .48, H * .5, tTn - .2, { c: K.red, size: 2.2, until: tBz - .1 });
  head("+10 <em>healthy</em> years", tTn, { x: W * .48, y: H * .56, size: 7, c: K.green, until: tBz - .1 });
  photo("A14", { t: tBz - .2, d: D - tBz + .5, mv: "panL", a: .6, in: "wipe" });
  wash(tBz, null, { a: .95 });
  kick("JEFF BEZOS-BACKED (REPORTED)", tBz, { y: H * .18, c: K.ink });
  card("Altos Labs", "ANTI-AGING BIOTECH · LAUNCH FUNDING", W * .06, H * .25, tAo - .2, { c: K.vio });
  count(0, 3, tB3 - .4, { y: H * .48, size: 22, pre: "~$", unit: "BILLION", c: K.vio, d: 1 });
  AT.done();
</script>
</body></html>
