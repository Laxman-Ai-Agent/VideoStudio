<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l21_end: L21 one line: suppliers -> shareholders, money in, compute cost up; when does revenue win; market decides; not advice; buy or wait; comment */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tLn = at("line", 1.5), tSh = at("share", 4.2), tMo = at("money", 5.2), tCo = at("cost", 7), tRv = at("rev", 10.2), tAn = at("answer", 12.5), tMk = at("market", 14.4),
        tAd = at("advice", 16), tBy = at("buy", 19.6), tWt = at("wait", 21), tCm = at("comment", 22.6), tLk = at("like", 25);
  shot("A26", { t: 0, d: tRv + .3, mv: "push", a: .7, in: "wipe", until: tRv });
  dim(0, tRv, .7, { bg: "linear-gradient(90deg, #07090f 45%, #07090f30)" });
  mono("IN ONE LINE", tLn - .5, { y: H * .12, c: K.gold, until: tRv - .1 });
  [["SUPPLIERS → SHAREHOLDERS", tSh, K.coral], ["MONEY POURING IN ▲", tMo, K.green], ["COMPUTE COST RISING ▲", tCo, K.red]].forEach(([s, t, c], i) =>
    chip(s, W * .06, H * (.22 + i * .12), t, { c, size: 2.6, until: tRv - .1 }));
  shot("A26", { t: tRv - .2, d: tBy - tRv, mv: "push", a: .4, in: "fade", until: tBy });
  dim(tRv, tBy, .85, { bg: "#07090f" });
  grid();
  const bx = [W * .08, H * .14, W * .84, H * .42];
  chart([[0, .2], [.3, .35], [.6, .6], [1, .95]], tRv - .2, { box: bx, c: K.red, d: 1.4, until: tAd - .2 });
  chart([[0, .1], [.3, .3], [.6, .5], [1, .8]], tRv + .1, { box: bx, c: K.green, d: 1.4, until: tAd - .2 });
  mono("COMPUTE COST", tRv + 1, { x: W * .78, y: H * .08, c: K.red, size: 1.7, until: tAd - .2 });
  mono("REVENUE", tRv + 1.2, { x: W * .82, y: H * .3, c: K.green, size: 1.7, until: tAd - .2 });
  head("When does revenue <em>win</em>?", tRv + .4, { y: H * .62, size: 7, c: K.green, until: tMk - .1 });
  head("The <em>market</em> decides.", tMk, { y: H * .62, size: 8, c: K.gold, until: tAd - .2 });
  stamp("NOT INVESTMENT ADVICE · NEWS EXPLAINED", W * .5, H * .4, tAd, { size: 2.8, c: K.gold, rot: 0, until: tBy - .2 });
  shot("A27", { t: tBy - .3, d: D - tBy, mv: "push", a: .6, in: "wipe", dir: -1, box: [W * .52, 0, W * .48, H], fx: .45 });
  chip("BUY ANT?", W * .06, H * .2, tBy, { c: K.green, size: 3.4, w: W * .2 });
  chip("WAIT?", W * .3, H * .2, tWt, { c: K.gold, size: 3.4, w: W * .14 });
  head("Tell us in the <em>comments</em>", tCm, { y: H * .38, size: 7 });
  chip("▲ LIKE", W * .06, H * .56, tLk, { c: K.green, size: 2.6 });
  logo("anthropic_logo_w", [W * .06, H * .7, W * .2, H * .04], tLk + .3);
  tape([["ANT", 1], ["NASDAQ", 0], ["NOV 19", 0], ["$70-$78", 1], ["$1.4T", 1], ["THE DARK WORLD", 0]], tCm);
  LK.done();
</script>
</body></html>
