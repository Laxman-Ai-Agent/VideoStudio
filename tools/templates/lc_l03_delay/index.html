<style>/* 16_Lung_Cancer lc_l03_delay: L03 India: not rare, hospital study 14% got TB drugs first, ~4 months delay, why it matters */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 35.3);
  smoke({ dens: [[0, .2], [12, .2], [13.5, .8]], alpha: .22 });
  shot("A10", { t: 0, d: 8.6, mv: "panR", in: "smoke", until: T(43.9) });
  head("NOT <b>RARE</b> IN INDIA", T(35.7), { y: H * .14, size: 6.6, until: T(38.1) });
  doc(`<h3>Delayed diagnosis of lung cancer</h3><div style="color:#6b625a">Hospital-based study · India</div><div class="rule"></div>
    Patients who first received <b>anti-TB treatment</b><br>before the cancer was found: <span class="hl"><b>~14%</b></span><br><br>
    Extra time lost before the right diagnosis:<br><span class="hl"><b>about 4 months</b></span><br><br><span style="color:#6b625a">Lesson: a cough that does not improve on TB drugs needs a CT scan.</span>`,
    W * .5, H * .1, W * .44, H * .62, T(38.2), { until: T(43.8) });
  num(0, 14, T(39.8), { x: W * .06, y: H * .1, unit: "%", d: 1.2, until: T(43.8) });
  people(50, 7, 10, [W * .06, H * .42, W * .36, H * .3], T(40.0), { c: K.em, lag: 1, until: T(43.8) });
  te("మొదట <b>TB మందులు</b>", T(42.1), { x: W * .06, y: H * .8, until: T(43.8) });
  shot("A12", { t: T(43.9), d: 7.8, mv: "push", a: .8, in: "wipe" });
  cal(["MONTH 1", "MONTH 2", "MONTH 3", "MONTH 4"], W * .1, H * .12, W * .8, H * .12, T(45.0), { from: T(46.6), step: .45 });
  head("4 MONTHS <b>LOST</b>", T(47.4), { y: H * .62, align: "center", size: 7.4, until: T(48.6) });
  head("WHY THAT <b>MATTERS</b>", T(49.4), { y: H * .62, align: "center", size: 6.4 });
  SM.done();
</script>
