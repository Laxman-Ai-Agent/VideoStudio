<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ck.js"></script><script src="ck_geo.js"></script><script src="ck2.js"></script>
<style>/* 10 Cyclone_Akwan ck_l13_landfall: L13 when and where: Nov 20 between Nellore and Visakhapatnam (Andhra / Yanam coast); the point moved: Machilipatnam, then Bapatla, now a range */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 188.2);
  const VIZ = [83.22, 17.69], VZN = [83.4, 18.11], CHE = [80.27, 13.08], NEL = [79.99, 14.44], MAC = [81.14, 16.19], BAP = [80.47, 15.9], YAN = [82.21, 16.73];
  const AP = [[82.25, 16.99, "KAKINADA"], [82.0, 16.58, "KONASEEMA"], [81.8, 17.0, "EAST GODAVARI"], [81.52, 16.54, "WEST GODAVARI"], [81.1, 16.71, "ELURU"], [81.14, 16.19, "KRISHNA"], [80.47, 15.9, "BAPATLA"]];

  cloudwipe(0, { part: "out" });
  atmo();
  const m = bay([0, 0, W, H], 0, { view: [74, 8, 92, 22], frame: false, start: [77, 9, 91, 20] });
  head("WHEN? <b>WHERE?</b>", .3, { x: W * .05, y: H * .12, size: 8, until: T(193.8) });
  m.track([[87.0, 10.0, "NOV 16", .5], [85.3, 12.6, "", T(191.4)], [83.3, 15.4, "NOV 20", T(192.4)]], { dash: true, until: T(201.3) });
  m.go([78, 12.5, 86, 18.8], T(193.9), 1.6);
  tag("LATEST REPORTS · NOV 20", T(194.2), { x: W * .05, y: H * .1 });
  m.pin(...NEL, "NELLORE", T(196.2), { c: K.yl, s: .9, until: T(206.0) });
  m.pin(...VIZ, "VISAKHAPATNAM", T(197.5), { c: K.yl, s: .9, until: T(206.0) });
  m.cone([[NEL[0] - .3, NEL[1]], [VIZ[0] - .2, VIZ[1] + .2], [VIZ[0] + 1.2, VIZ[1] - .3], [NEL[0] + 1.4, NEL[1] - .4]], T(198.4), { c: K.red, until: T(206.0) });
  m.pin(...YAN, "YANAM", T(199.4), { c: K.cy, s: .9, dx: -1.6, anchor: "end", until: T(206.0) });
  head("THE POINT KEEPS <b>MOVING</b>", T(203.9), { x: W * .05, y: H * .8, size: 6.4, c: K.or, until: T(210.4) });
  m.pin(...MAC, "MACHILIPATNAM?", T(206.4), { c: K.or, s: .9, until: T(208.7) });
  m.pin(...BAP, "BAPATLA?", T(208.8), { c: K.or, s: .9, dx: -1.6, anchor: "end", until: T(210.4) });
  m.pin(...NEL, "NELLORE", T(210.6), { c: K.red, s: .9, pulse: false });
  m.pin(...VIZ, "VISAKHAPATNAM", T(211.6), { c: K.red, s: .9, pulse: false });
  m.cone([[NEL[0] - .3, NEL[1]], [VIZ[0] - .2, VIZ[1] + .2], [VIZ[0] + 1.2, VIZ[1] - .3], [NEL[0] + 1.4, NEL[1] - .4]], T(211.8), { c: K.red });
  te("ఇప్పుడు <b>నెల్లూరు - విశాఖ</b> మధ్య", T(211.0), { x: W * .05, y: H * .82 });
  CK.done();
</script>
</body></html>
