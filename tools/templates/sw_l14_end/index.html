        tSw = at("sweat", 14.5), tSh = at("shake", 15.2), tDz = at("dizzy", 15.7), tHy = at("hypo", 17.1), tDc = at("doc", 20.1), tHb = at("hb", 22.6), tSo = at("so", 24.8),
        tPl = at("plate", 29.4), tWa = at("walk", 31.0), tSl = at("sleep", 32.0), tCe = at("cells", 33.8), tLi = at("listen", 35.3), tSh2 = at("share", 39.5), tQ = at("q", 41.5);

  /* A. medicines: never stop on your own */

  out(sg, tDc - .5, { x: -u * 3 });

  const gm = png("P24_glucometer", W * .2, H * .64, H * .26, { c: K.cyan }); pop(gm, tHb - .4, { scale: .4, opacity: 0 }, .9, SP); breathe(gm, tHb + .6, u * .5, 3);
  const bH = badge("<b>HbA1c</b> EVERY 3 MONTHS", K.amber, W * .32, H * .62); bH.style.fontSize = u * 2.6 + "px"; pop(bH, tHb, { x: -u * 3, opacity: 0 }, .8, SP);

  const h5 = rehead(h4, 'Small habits, <em class="g">big change</em>', "sugar అంటే శరీరం insulin మాట వినకపోవడం", tSo - .2, { kick: "RECAP", w: W * .56, x: W * .05, y: H * .1, size: 7.6 });
  const ce = cell(W * .74, H * .52, H * .2, { c: K.red }); tl.fromTo(ce, { scale: .4, opacity: 0 }, { scale: 1, opacity: 1, duration: .9, ease: SP, immediateRender: true }, tSo); breathe(ce, tSo + 1, u * .5, 3);
  const RC = [["P16_vegdal", "RIGHT PLATE", tPl], ["P18_walker", "WALK AFTER MEALS", tWa], ["P26_clock", "GOOD SLEEP", tSl]].map(([k, n, t], i) => {
    const o = png(k, W * (.09 + i * .16), H * .6, H * .2, { c: K.green }); pop(o, t, { scale: .3, opacity: 0, y: u * 4 }, .9, SP); breathe(o, t + .9, u * .4, 2.6 + i * .3);
    const b = badge(n, K.green, W * (.04 + i * .16), H * .75); pop(b, t + .1, { y: u * 2, opacity: 0 }, .6, SP); return [o, b]; });
  B.tintCell(ce, tCe, K.green, .9); tl.to(ce.door, { rotation: -85, duration: .5, ease: SP }, tLi); tl.to(ce.hole, { attr: { fill: K.green }, duration: .3 }, tLi);
  const bL = badge("CELLS <b>LISTEN AGAIN</b>", K.green, W * .64, H * .82); pop(bL, tLi + .2, { y: u * 2, opacity: 0, scale: .8 }, .8, SP);

  /* E. share + comment */

  cam(0, Math.max(D, 1), 1.035);
