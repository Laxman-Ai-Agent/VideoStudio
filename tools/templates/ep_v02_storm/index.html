<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_v02_storm: V02 brain signals, house wiring high voltage, brain storm = seizure, 2+ = epilepsy */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 9.1);
  net({ n: 70, storm: [[T(20.9), T(25.2)]], alpha: .9 });
  const b = shot("E06", { t: 0, d: 5, mv: "orbit", a: .6, in: "through", box: [W * .06, H * .12, W * .88, H * .36], glass: true, cap: "BRAIN · NERVE CELLS" });
  head("<b>BILLIONS</b>", T(10.4), { y: H * .52, align: "center", size: 10, until: T(14.5) });
  te("చిన్న <b>electrical signals</b>", T(12.5), { y: H * .6, align: "center", until: T(14.5) });
  out(b, T(14.5), .3);
  shot("F03", { t: T(14.6), d: 6, mv: "dive", a: .5, in: "flash", until: T(20.8) });
  head("HIGH <b>VOLTAGE</b>", T(16.4), { y: H * .14, align: "center", c: K.mg, size: 9, until: T(20.8) });
  te("<b>lights, fans</b> పాడైపోతాయి", T(17.6), { y: H * .58, align: "center", c: K.mg, until: T(20.8) });
  bolt(W * .2, H * .3, W * .8, H * .5, T(16.6));
  const s = shot("F02", { t: T(20.9), d: 4.6, mv: "orbit", a: .7, in: "through", until: T(25.2) });
  head("BRAIN <b>STORM</b>", T(21.5), { y: H * .14, align: "center", c: K.mg, size: 9, until: T(25.2) });
  head("<b>SEIZURE</b>", T(24.1), { y: H * .52, align: "center", c: K.mg, size: 13, until: T(25.2) });
  eeg(T(25.3), { box: [0, H * .22, W, H * .1], d: 3.6, spike: [[.4, 1.0], [1.8, 2.5]], c: K.mg });
  num(0, 2, T(27.1), { x: 0, y: H * .36, align: "center", unit: "+ TIMES", c: K.mg, size: 24, d: .8 });
  te("కారణం లేకుండా", T(26.0), { y: H * .14, align: "center", c: K.am });
  head("= <b>EPILEPSY</b>", T(30.1), { y: H * .56, align: "center", size: 8.5 });
  SK.done();
</script>
</body></html>
