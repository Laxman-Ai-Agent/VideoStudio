<style>/* 10 Cyclone_Akwan ck_l17_ports: L17 rough sea, fishermen stay back; government: Number One warning signal at all AP ports except Kalingapatnam; no fishing till Nov 19 */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 252.6);
  atmo();
  shot("A40", { t: 0, d: 5.3, mv: "panR", in: "cut", until: T(257.8) });
  te("Fishermen వేటకు <b>వెళ్లలేని</b> పరిస్థితి", T(254.8), { y: H * .14, until: T(257.7) });
  shot("A18", { t: T(257.8), d: 10.5, mv: "drift", in: "cloud" });
  head("WHAT IS THE <b>GOVERNMENT</b> DOING?", T(258.0), { y: H * .1, size: 6.4, until: T(260.8) });
  mast(W * .74, H * .16, H * .66, T(260.9), T(262.4), { label: "SIGNAL NO. 1" });
  tag("ALL AP PORTS · EXCEPT KALINGAPATNAM", T(260.9), { y: H * .1 });
  head("WARNING <b>SIGNAL 1</b>", T(263.2), { x: W * .06, y: H * .24, size: 7, c: K.red });
  cards([["UNTIL", "NOV 19", "సముద్రంలోకి వెళ్లొద్దు", T(264.8), K.red]], W * .06, H * .5, W * .28, H * .32);
  stamp("NO FISHING", W * .36, H * .62, T(266.4), { c: K.red, size: 4.6 });
  CK.done();
</script>
</body></html>
