<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_l05_define: L05 one seizure is not epilepsy; WHO: 2 or more unprovoked seizures */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 75.0);
  shot("E14", { t: 0, d: 4, mv: "push", in: "fade", until: T(78.4) });
  head("1 SEIZURE", T(75.0), { y: H * .16, size: 7.5, until: T(78.4) });
  head("≠ <b>EPILEPSY</b>", T(77.2), { y: H * .3, size: 7.5, c: K.mg, until: T(78.4) });
  const m = shot("E13", { t: T(78.4), d: 7, mv: "pull", in: "scan", box: [W * .5, H * .1, W * .46, H * .6], glass: true, cap: "EEG · WHO DEFINITION" });
  hud("WHO · WORLD HEALTH ORGANIZATION", T(78.6), { c: K.am });
  doc(`<div style="font-size:${u * 2.1}px;line-height:1.45"><h3 style="font-size:${u * 3}px">Epilepsy: definition</h3><div class="rule"></div><b>World Health Organization</b><br>A chronic disease of the brain.<br>
       Diagnosis: <b>2 or more</b> seizures<br>with <b>no provoking cause</b><br>(fever, injury, drug, alcohol excluded)<br>24 hours or more apart.<br><br>
       <span style="opacity:.6">Source: WHO epilepsy fact sheet</span></div>`, W * .05, H * .2, W * .38, H * .52, T(79.1));
  te("<b>కారణం లేకుండా</b>", T(79.9), { x: W * .05, y: H * .76, c: K.am, size: 3.6, until: T(85.6) });
  num(0, 2, T(81.1), { x: W * .56, y: H * .24, c: K.mg, unit: "+ TIMES", d: .8, size: 14 });
  lock(W * .52, H * .14, W * .42, H * .5, T(83.1), { c: K.mg, label: "EPILEPSY", z: 20 });
  ring(W * .73, H * .4, T(84.3), { c: K.mg, r: u * 14 });
  SK.done();
</script>
</body></html>
