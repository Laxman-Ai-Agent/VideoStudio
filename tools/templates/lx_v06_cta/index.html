<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_v06_cta: V06 the trillion-dollar question, comment ANTHROPIC for the full video link */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tTr = at("tril", 3), tCm = at("comment", 8.2), tLk = at("link", 11.4);
  shot("B06", { t: 0, d: D, mv: "push", a: .7, in: "iris" });
  dim(0, null, .6, { bg: "linear-gradient(180deg, #07090fee 30%, #07090f20 70%)" });
  mono("THE STRATEGY?", .1, { align: "center", y: H * .07, c: K.gold });
  head("The <em>trillion</em>", tTr - .4, { align: "center", y: H * .11, size: 13 });
  head("dollar question", tTr, { align: "center", y: H * .18, size: 12 });
  mono("COMMENT", tCm - .3, { align: "center", y: H * .31, c: K.mute, size: 3 });
  chip("ANTHROPIC", W * .2, H * .35, tCm, { w: W * .6, size: 5, c: K.coral });
  mono("FULL VIDEO LINK →", tLk - .2, { align: "center", y: H * .45, c: K.green, size: 3 });
  logo("anthropic_logo_w", [W * .2, H * .55, W * .6, H * .03], tLk + .3);
  LK.done();
</script>
</body></html>
