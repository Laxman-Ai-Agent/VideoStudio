<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="kit.js"></script><script src="hd.js"></script>
<style>/* 10_Diarrhea_ORS hd_l10_ors: salt + sugar in the right ratio ride a transporter into the cell pulling water, still works in diarrhea, ORS acronym, WHO + low cost */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, u, tl, E, at, mk, place, pop, out, move, cam } = X;
  const { K, float, bgl, base, push, card, pill, word, draw, ring, flow, tank, nope, tick, dots, icon, aside, enter, zin, bigNum } = HD;
  document.documentElement.style.setProperty("--u", u + "px");
  bgl();
  const p = (i, d) => at("p" + i, d);

  const t2 = p(2, 5.3), t3 = p(3, 10.8), t4 = p(4, 16.1);
  const m = base("H18", W * .12, H * .1, W * .76, H * .72, { label: "cell membrane transporter, sodium + glucose" }); zin(m, 0);
  push(m, .8, t2, 1.2, 0, H * .04);
  const salt = icon("drop", K.ink, W * .2, H * .2, u * 6); salt.querySelector("svg").innerHTML = '<rect x="6" y="6" width="12" height="12" rx="2"/>';
  const sug = icon("drop", K.amber, W * .2, H * .36, u * 6); sug.querySelector("svg").innerHTML = '<path d="M12 4l7 4v8l-7 4-7-4V8z"/>';
  pop(salt, .3, { scale: .4, opacity: 0 }, .5, E.spring); pop(sug, .8, { scale: .4, opacity: 0 }, .5, E.spring);
  const ps = pill("SALT", K.ink, W * .27, H * .21); pop(ps, .4, { x: -u * 2, opacity: 0 }, .4); const pu = pill("SUGAR", K.amber, W * .27, H * .37); pop(pu, .9, { x: -u * 2, opacity: 0 }, .4);
  const rt = card(`The <em>right ratio</em><span class="te">సరైన కొలతలో కలిసినప్పుడు</span>`, W * .64, H * .06, { bar: true, c: K.amber }); pop(rt, 1.8, { y: -u * 3, opacity: 0 }, .6, E.spring);
  [ps, pu].forEach((e) => out(e, 2.6));
  tl.to([salt, sug], { left: W * .44, top: H * .44, duration: 1.4, ease: E.io, stagger: .15 }, 2.8);
  flow(`M ${W * .22} ${H * .5} C ${W * .34} ${H * .5}, ${W * .4} ${H * .48}, ${W * .47} ${H * .5} L ${W * .5} ${H * .78}`, 8, K.blue, 3.2, t2 + 1, { once: true, r: u * .9 });
  const wi = pill("WATER FOLLOWS", K.blue, W * .58, H * .62, { solid: true }); pop(wi, 4.2, { x: u * 3, opacity: 0 }, .5, E.spring);
  /* 2. still open during diarrhea: conveyor loop */
  HD.clear(t2 - .3);
  [rt, wi, salt, sug].forEach((e) => out(e, t2 - .3));
  push(m, t2 - .2, t3 - t2, 1.32, 0, -H * .03, "none");
  const lp = `M ${W * .2} ${H * .4} C ${W * .35} ${H * .4}, ${W * .45} ${H * .42}, ${W * .5} ${H * .5} L ${W * .52} ${H * .9}`;
  flow(lp, 14, K.blue, t2, t3, { r: u * .7, speed: .5, jit: 2 }); flow(lp, 7, K.amber, t2 + .2, t3, { r: u * .6, speed: .5, jit: 2 }); flow(lp, 7, "#fff", t2 + .4, t3, { r: u * .6, speed: .5, jit: 2, ring: K.ink });
  const so = card(`Works <em>even in diarrhea</em><span class="te">ఈ దారి పనిచేస్తూనే ఉంటుంది</span>`, W * .05, H * .1, { bar: true, c: K.green }); pop(so, t2 + 1.2, { x: -u * 4, opacity: 0 }, .6, E.spring);
  tick(W * .05 + u * 3, H * .3, u * 4, t2 + 1.8);
  /* 3. ORS acronym over the glass */
  HD.clear(t3 - .3);
  out(so, t3 - .3); out(m, t3 - .3);
  const o = base("H04", W * .58, H * .1, W * .36, H * .68, { label: "ORS sachet + glass" }); zin(o, t3 - .2);
  [["O", "ral"], ["R", "ehydration"], ["S", "olution"]].forEach(([a, b], i) => { const w = word(`<em>${a}</em>${b}`, W * .07, H * (.12 + i * .17), 9, { c: K.blue });
    pop(w, t3 + .2 + i * .6, { x: -u * 5, opacity: 0 }, .6, E.spring); out(w, t4 - .3); });
  /* 4. WHO main treatment + low cost */
  HD.clear(t4 - .3);
  const wh = card(`WHO: <em>main treatment</em><span class="te">విరేచనాలకు main treatment ఇదే</span>`, W * .06, H * .16, { bar: true, c: K.green }); pop(wh, t4, { y: u * 3, opacity: 0 }, .6, E.spring);
  const gb = icon("globe", K.green, W * .06, H * .02, u * 8); pop(gb, t4, { scale: .4, opacity: 0 }, .5, E.spring);
  const cn = icon("coin", K.amber, W * .08, H * .44, u * 9); tl.fromTo(cn, { rotationY: 0, opacity: 0 }, { rotationY: 720, opacity: 1, duration: 1, ease: E.io, immediateRender: true }, t4 + 2.2);
  const lc = card(`1 dose = <em>very low cost</em>`, W * .18, H * .46, { c: K.amber }); pop(lc, t4 + 2.4, { x: -u * 3, opacity: 0 }, .55, E.spring);
  push(o, t4, D - t4, 1.1, -u * 3, 0);
  cam(0, Math.max(D, 1), 1.02);
  X.done();
</script></body></html>
