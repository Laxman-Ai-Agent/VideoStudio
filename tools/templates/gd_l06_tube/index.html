<style>/* 18 Acidity_GERD gd_l06_tube: L06 esophagus = food pipe from mouth to stomach; at the joint the LES muscle ring, a one-way door */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 98.4);
  drench(0, { part: "out" });
  shot("A17", { t: 0, d: 3.9, mv: "rise", in: "cut", until: T(102.3) });
  callout(W * .5, H * .38, W * .14, -H * .12, "ESOPHAGUS · FOOD PIPE", T(99.0), { until: T(102.2) });
  te("నోటి నుంచి కడుపు వరకు <b>గొట్టం</b>", T(100.3), { until: T(102.2) });
  fizz({ t: T(102.3), dens: [[0, .3]] });
  tract(W * .06, H * .1, W * .42, H * .84, T(102.3), { acid: [[0, .4]], food: [T(102.6)], les: [[0, 0], [T(103.2), .9], [T(103.9), 0]],
    labels: [["STOMACH", T(103.6), .82, .7, W * .05, H * .06, K.por], ["LES · MUSCLE RING", T(110.0), .48, .5, W * .12, -H * .02, K.acid]] });
  head("LOWER ESOPHAGEAL <b>SPHINCTER</b>", T(105.4), { x: W * .5, y: H * .2, size: 3.8, until: T(111.5) });
  num(0, 0, T(108.7), { x: W * .5, y: H * .34, size: 18, fmt: () => "LES", c: K.acid, until: T(111.5) });
  shot("A18", { t: T(111.6), d: 2.4, mv: "push", in: "burn", box: [W * .53, H * .1, W * .43, H * .62], fr: true, fig: "ONE-WAY DOOR", no: "4" });
  head("ONE-WAY <b>DOOR</b>", T(112.0), { x: W * .53, y: H * .8, size: 5.4 });
  AC.done();
</script>
</body></html>
