<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l15_loss: L15 the other side: $17B revenue vs -$0.5B operating loss, Q2 +$974M -> Q3 loss line, why: compute, chips, data centers */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tSd = at("side", .3), tRv = at("rev", 2.3), tLs = at("loss", 5.3), tPr = at("prior", 9.6), tWhy = at("why", 13.4), tCp = at("compute", 15.4), tCh = at("chips", 18.6);
  shot("A17", { t: 0, d: tRv + .4, mv: "crash", a: .6, in: "flash", until: tRv });
  dim(0, tRv, .5, { bg: "linear-gradient(0deg, #07090f, #07090f00 60%)" });
  head("The <em>other</em> side", tSd, { y: H * .62, size: 11, c: K.red, until: tRv - .1 });
  shot("A17", { t: tRv - .1, d: tWhy - tRv, mv: "push", a: .4, in: "fade", until: tWhy });
  dim(tRv, tWhy, .85, { bg: "#07090f" });
  grid();
  const sep = place(mk("div", ""), W * .5, H * .1, 2, H * .5); sep.style.position = "absolute"; sep.style.background = K.ink + "40";
  tl.fromTo(sep, { scaleY: 0 }, { scaleY: 1, duration: .5, immediateRender: true }, tRv); out(sep, tWhy - .2);
  mono("SAME QUARTER · REVENUE", tRv, { x: W * .06, y: H * .12, c: K.green, until: tWhy - .2 });
  num(0, 17, tRv, { x: W * .06, y: H * .18, pre: "+$", unit: "B", size: 13, col: K.green, c: K.ink, until: tWhy - .2 });
  mono("OPERATING LOSS", tLs - .2, { x: W * .56, y: H * .12, c: K.red, until: tWhy - .2 });
  num(0, .5, tLs, { x: W * .56, y: H * .18, pre: "−$", unit: "B", size: 13, col: K.red, c: K.ink, fmt: (v) => v.toFixed(1), until: tWhy - .2 });
  chart([[0, .85], [1, .1]], tPr, { box: [W * .2, H * .46, W * .6, H * .24], c: K.red, d: 1.2, until: tWhy - .2 });
  mono("Q2 · +$974M PROFIT", tPr, { x: W * .12, y: H * .4, c: K.green, size: 1.9, until: tWhy - .2 });
  mono("Q3 · LOSS", tPr + 1.1, { x: W * .74, y: H * .74, c: K.red, size: 1.9, until: tWhy - .2 });
  head("Why a <em>loss</em>?", tWhy, { align: "center", y: H * .3, size: 11, c: K.red, until: tCp - .1 });
  shot("A13", { t: tCp - .1, d: D - tCp, mv: "push", a: .8, in: "line" });
  dim(tCp, null, .5, { bg: "linear-gradient(0deg, #07090f, #07090f00 65%)" });
  head("Computing <em>power</em>", tCp + .1, { y: H * .6, size: 10 });
  const fb = [W * .62, H * .08, W * .32, H * .4];
  shot("A18", { t: tCh - .3, d: D, mv: "push", a: .8, in: "zoom", box: fb, framed: true, tc: K.red });
  chip("CHIPS", W * .06, H * .44, tCh, { c: K.red }); chip("DATA CENTERS", W * .2, H * .44, tCh + .5, { c: K.red });
  LK.done();
</script>
</body></html>
