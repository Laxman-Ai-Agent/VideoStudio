<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 13 (209.5-235.3 s): black hole, 2 open problems -> one prompt, three devices -> RoboDojo 27.6 -> 64.9 -> Anthropic's own tests */
.tr { position: absolute; height: calc(var(--u) * 3.4); border-radius: 99px; background: #EEF0F6; overflow: hidden; }
.tr div { height: 100%; border-radius: 99px; transform-origin: 0 50%; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, move, fit, bg, title, retitle, card, chip, label, icon, num, count, term, typeTerm } = X;
  bg("mint");
  const tB = at("black", 0.05), tO = at("open", 1.4), tP = at("prompt", 5.6), tDv = at("devices", 7.9), tHub = at("hub", 10.1), tUsb = at("usb", 10.75), tPet = at("pet", 13.2);
  const tR = Math.max(at("robots", 14.0), tPet + 1.8), tOld = at("old", 17.0), tNew = at("new", 19.25), tOwn = at("own", 23.5);

  // A. the black hole picture starts centre, moves left; "2 open problems solved" fills the right
  const t1 = title("2 open problems solved", "Black hole physics లో, Anthropic చెబుతున్న ప్రకారం", 0.1);
  const bh = card({ i: "blackhole", x: W * 0.18, y: H * 0.3, w: W * 0.64, h: H * 0.6 }); pop(bh, tB + 0.2, { scale: 0.92, opacity: 0 }, 0.7);
  fit(bh, tO - 0.2, W * 0.05, H * 0.32, W * 0.5, H * 0.56);
  const n = num(W * 0.62, H * 0.36, PAL.green, 16); n.textContent = "2"; pop(n, tO + 0.2, { scale: 0.6, opacity: 0 }, 0.5, E.pop);
  const l = label("open problems", W * 0.78, H * 0.62); fade(l, tO + 0.4);
  const ck = icon("check", W * 0.72, H * 0.38, u * 9, PAL.green); pop(ck, tO + 1.2, { scale: 0.3, opacity: 0 }, 0.4, E.pop);

  // B. one prompt types in a terminal; three real device cards fill the width, each on its name
  out([bh, n, l, ck], tP - 0.6); const t2 = retitle(t1, "One prompt → 3 devices", "ఒక్క paragraph prompt తో మూడు పనిచేసే devices design చేసింది", tP - 0.3);
  const tm = term(W * 0.06, H * 0.33, W * 0.5); fade(tm, tP - 0.1); typeTerm(tm, "design 3 working devices…", tP);
  const devs = [["hub", "Voice hub", tHub], ["speaker", "USB speakerphone", tUsb], ["pet", "Virtual pet", tPet]].map(([k, nm, t], i) => {
    const c = card({ i: k, x: W * (0.06 + i * 0.31), y: H * 0.46, w: W * 0.26, h: H * 0.38, label: nm }); pop(c, Math.max(t - 0.2, tDv + i * 0.15), { y: u * 8, opacity: 0 }, 0.6); return c; });

  // C. robots: robot arm picture left, two progress rows on the right (old 27.6%, Fable 5.2 64.9%)
  out([tm, ...devs], tR - 0.6); retitle(t2, "Robot control test", "RoboDojo test లో పాత version vs Fable 5.2", tR - 0.3);
  const rb = card({ i: "robot", x: W * 0.05, y: H * 0.32, w: W * 0.38, h: H * 0.56 }); pop(rb, tR, { x: -u * 8, opacity: 0 }, 0.6);
  [["Old version", PAL.mute, 0.276, tOld, H * 0.44, "27.6%"], ["Fable 5.2", PAL.green, 0.649, tNew, H * 0.66, "64.9%"]].forEach(([t, c, f, t0, y, v]) => {
    const lb = label(t, W * 0.48, y - u * 5.5); lb.style.transform = "none"; fade(lb, t0 - 0.3);
    const r = place(mk("div", "tr"), W * 0.48, y, W * 0.46); r.innerHTML = `<div style="background:${c}"></div>`; fade(r, t0 - 0.3);
    tl.fromTo(r.firstChild, { scaleX: 0 }, { scaleX: f, duration: 1, ease: E.io, immediateRender: true }, t0);
    const nv = label(v, W * 0.48 + W * 0.46 * f + u * 6, y - u * 0.4, undefined, c); fade(nv, t0 + 0.8);
  });
  const cOwn = chip("Numbers: Anthropic's own tests", W * 0.48, H * 0.82, PAL.coral); pop(cOwn, tOwn);
  X.done();
</script></body></html>
