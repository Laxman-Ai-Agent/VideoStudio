<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l06_roadshow: L06 roadshow: Nov 10 start, route between investor rooms, banks collect orders, demand sets the price */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tRd = at("road", 3.5), tInv = at("inv", 7), tPl = at("plans", 9.4), tBk = at("banks", 12.6), tOr = at("orders", 13.8), tDm = at("demand", 15), tPr = at("price", 16.4);
  shot("A07", { t: 0, d: tRd + .5, mv: "panR", a: .8, in: "wipe", until: tRd + .1 });
  dim(0, tRd, .9, { bg: "linear-gradient(90deg, #07090f 45%, #07090f00 85%)" });
  mono("NOV 10 · 2026", .2, { y: H * .5 });
  head("The roadshow <em>begins</em>", .4, { y: H * .56, size: 10, until: tRd - .1 });
  grid();
  const fb = [W * .3, H * .1, W * .4, H * .42];
  shot("A28", { t: tRd - .1, d: tBk - tRd, mv: "push", a: .6, in: "iris", box: fb, framed: true, until: tBk });
  mono("WHAT IS A ROADSHOW?", tRd + .1, { align: "center", y: H * .04, c: K.gold, until: tBk - .1 });
  const pts = [[0, .5], [.33, .8], [.66, .35], [1, .65]];
  chart(pts, tInv - .5, { box: [W * .1, H * .58, W * .8, H * .2], c: K.coral, d: 2, until: tBk - .1 });
  ["INVESTORS", "BUSINESS", "PLANS", "QUESTIONS"].forEach((s, i) => mono(s, tInv - .4 + i * .65, { x: W * (.07 + i * .26), y: H * (i % 2 ? .53 : .8), size: 1.7, c: K.ink, until: tBk - .1 }));
  te("company → పెద్ద investors", tPl, { align: "center", y: H * .66, size: 3.2, c: K.coral, until: tBk - .1 });
  shot("A08", { t: tBk - .1, d: D - tBk, mv: "panL", a: .7, in: "whip" });
  dim(tBk, null, .8, { bg: "linear-gradient(270deg, #07090f 40%, #07090f30)" });
  mono("BANKS COLLECT ORDERS", tBk + .1, { x: W * .55, y: H * .1, c: K.green });
  [["BUY 2.0M @ $78", 1], ["BUY 0.8M @ $76", 1], ["BUY 3.1M @ $78", 1], ["BUY 1.2M @ $74", 1]].forEach(([s], i) => chip(s, W * .55, H * (.17 + i * .09), tOr + i * .25, { size: 2, c: K.green, w: W * .36 }));
  head("Demand sets the <em>price</em>", tPr - .5, { x: W * .55, y: H * .58, size: 6.5, c: K.gold });
  bracket("$70", "$78", tDm, { box: [W * .58, H * .72, W * .34] });
  LK.done();
</script>
</body></html>
