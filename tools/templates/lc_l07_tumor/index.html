<!doctype html><html><head><meta charset="utf-8">

<style>/* 16_Lung_Cancer lc_l07_tumor: L07 tumour, spread through blood and lymph to brain / bones / liver / adrenal, stage 4 */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 106.45);
  shot("A25", { t: 0, d: 4.4, mv: "push", in: "smoke", until: T(110.8) });
  lungs(W * .52, H * .1, H * .8, T(106.6), { tumor: T(107.6), tumorGrow: 2, d: 1.2, until: T(110.8) });
  head("<b>TUMOUR</b>", T(109.3), { x: W * .06, y: H * .16, size: 9, until: T(110.7) });
  te("కణాల <b>గుంపు</b>", T(108.4), { x: W * .06, y: H * .74, until: T(110.7) });
  shot("A26", { t: T(110.8), d: 6, mv: "panR", in: "smoke", until: T(116.8) });
  tag("THROUGH BLOOD", T(112.6), { until: T(116.7) });
  shot("A27", { t: T(113.4), d: 3.4, mv: "push", in: "wipeL", box: [W * .52, H * .14, W * .42, H * .56], panel: true, cap: "LYMPH NODES", until: T(116.8) });
  te("ఇతర <b>అవయవాలకు</b> వ్యాపించొచ్చు", T(114.7), { until: T(116.7) });
  body(W * .4, H * .04, H * .92, T(116.8), { tumor: T(117.4), spread: [["brain", T(119.2), "BRAIN"], ["bone", T(119.5), "BONES"], ["liver", T(119.7), "LIVER"], ["adrenal", T(119.9), "ADRENAL"]], until: T(121.8) });
  head("IT <b>SPREADS</b>", T(117.0), { x: W * .05, y: H * .2, size: 6, until: T(121.7) });
  shot("A25", { t: T(121.8), d: 4.6, mv: "dive", a: .5, in: "iris", fx: .6, fy: .55 });
  te("శరీరమంతా <b>వ్యాపించిన</b> స్థితి", T(122.6), { y: H * .74 });
  head("STAGE <b>4</b>", T(124.6), { y: H * .14, align: "center", size: 10 });
  SM.done();
</script>
</body></html>
