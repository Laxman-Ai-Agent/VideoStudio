<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>
/* 03_Wireless_Power seq 19 (277-293 s): phone + EV charging already use magnetic induction (different) -> not a wire-free world yet, but a great step */
.side { position: absolute; top: 0; bottom: 0; }
.st { position: absolute; font: 800 calc(var(--u) * 2.6) var(--font-head); letter-spacing: .14em; color: var(--text2); }
.st b { color: var(--text); }
#ne { position: absolute; font: 900 calc(var(--u) * 12) var(--font-head); color: var(--accent); }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, $, mk, place, card, pop, out, dim, lit, ring, type, rise, chip, camera, circuits } = K;
  circuits({ seed: 277 });
  const st = $("stage"); camera(st, 1.03, -0.01);
  const tPh = at("phone", 0.7), tEv = at("ev", 1.3), tIn = at("induction", 3.2), tDf = at("different", 6.6), tWo = at("world", 8.8), tOn = at("only", 13.25), tSt = at("step", 15.6);

  // A. phone (9:16, floating over a hand) and EV on its pad (16:9) arrive; MAGNETIC INDUCTION types, ALREADY HERE chip
  const ph = H * 0.5, pw = ph * 9 / 16, phone = card({ i: "phone_float", x: W * 0.06, y: H * 0.1, w: pw, h: ph, focus: [0.5, 0.42, 1.25] });
  pop(phone, tPh - 0.2, { y: H * 0.25, opacity: 0, rotation: -5 }, 0.6, E.in);
  const ew = W * 0.34, eh = ew * 9 / 16, ev = card({ i: "ev", x: W * 0.06 + pw + u * 3, y: H * 0.1 + ph - eh, w: ew, h: eh, focus: [0.45, 0.6, 1.2] });
  pop(ev, tEv - 0.15, { x: W * 0.2, opacity: 0, rotation: 3 }, 0.6, E.in);
  const mi = place(mk("div", "kh", st), W * 0.06, H * 0.1 + ph + u * 2.5); mi.style.fontSize = u * 5 + "px"; type(mi, "Magnetic *Induction*", tIn - 0.1, 22);
  const ah = chip("Already here", W * 0.06 + pw + u * 3, H * 0.1); pop(ah, tIn + 0.6, { scale: 0.5, opacity: 0 }, 0.4);

  // B. different: the frame splits; left TOUCH / INDUCTION, right THROUGH THE AIR (the beam), a big ≠ between
  tl.to([phone, ev, mi, ah], { scale: 0.62, x: -W * 0.03, y: -H * 0.03, transformOrigin: "0 0", duration: 0.6, ease: E.io }, tDf - 0.6);
  const ne = place(mk("div", "", st, "≠"), W * 0.52, H * 0.18); ne.id = "ne"; pop(ne, tDf, { scale: 0.2, opacity: 0, rotation: -90 });
  const l1 = place(mk("div", "st", st, "PAD · <b>TOUCH</b>"), W * 0.06, H * 0.5); tl.fromTo(l1, { opacity: 0 }, { opacity: 1, duration: 0.3 }, tDf);
  const r1 = place(mk("div", "kh", st, "Through<br><em>the air</em>"), W * 0.64, H * 0.16); r1.style.cssText += `font-size:${u * 6}px;opacity:0`; rise(r1, tDf + 0.2, 0.1);
  K.beam(W * 0.64, H * 0.42, W * 0.94, H * 0.42, tDf + 0.5, 0.8);

  // C. the city opens wide: not a wire-free world yet ... but wires are not the only way -> A GREAT STEP
  const tC = tWo - 0.5;
  tl.to(st.children, { opacity: 0, duration: 0.5, ease: E.out }, tC);
  const lay = mk("div", ""); lay.style.cssText = "position:absolute;inset:0"; $("shake").append(lay);
  const city = card({ i: "city2_clip", video: "city2_clip_v", vstart: tC, vdur: 5.2, x: 0, y: 0, w: W, h: H, shape: "sharp", parent: lay, focus: [0.5, 0.5, 1.05] });
  tl.fromTo(city, { clipPath: "circle(0% at 50% 45%)" }, { clipPath: "circle(75% at 50% 45%)", duration: 1.2, ease: E.io }, tC);
  tl.fromTo(city, { scale: 1.15 }, { scale: 1, duration: D - tC, ease: "none" }, tC);
  const shade = place(mk("div", "", lay), 0, 0, W, H); shade.style.background = "linear-gradient(180deg,#0A0E1700,#0A0E17cc 70%)";
  tl.fromTo(shade, { opacity: 0 }, { opacity: 1, duration: 0.6 }, tC + 0.6);
  const ny = place(mk("div", "kt", lay), W * 0.07, H * 0.4); ny.style.fontSize = u * 3 + "px"; type(ny, "NOT A WIRE-FREE WORLD... *YET*", tWo + 0.1, 26);
  const nw = place(mk("div", "kh", lay), W * 0.07, H * 0.46); nw.style.fontSize = u * 5 + "px"; type(nw, "Wires are not the *only way*", tOn - 0.6, 24);
  const gs = place(mk("div", "kh", lay, "A great <em>step</em> →"), W * 0.07, H * 0.56); gs.style.cssText += `font-size:${u * 9}px;opacity:0`;
  rise(gs, tSt - 0.25, 0.12);
  K.done();
</script></body></html>
