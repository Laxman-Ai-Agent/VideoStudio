<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l16_danger: L16 danger signs list with matching shots, blue lips, don't wait, call the ambulance (108) */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 274.0);
  flow({ n: 150, alpha: .7, band: .6, choke: [[0, T(278.4), .75]], until: T(278.4) });
  head("<b>DANGER</b> SIGNS", T(274.5), { y: H * .4, align: "center", size: 9, c: K.co, until: T(278.3) });
  list([["ఆయాసం <b>పెరుగుతూ</b> ఉండటం", T(278.4), false], ["Reliever తో <b>ఉపశమనం లేదు</b>", T(280.5), false],
        ["మాట్లాడటానికి <b>ఊపిరి చాలదు</b>", T(283.4), false], ["పెదాలు <b>నీలం</b> రంగు", T(285.9), false]], W * .04, H * .2, { until: T(289) });
  const sh = [["A44", 278.4], ["A47", 280.5], ["A23", 283.4], ["A54", 285.9]];
  sh.forEach(([k, t], i) => shot(k, { t: T(t), d: 3, mv: i % 2 ? "pull" : "push", in: i ? "wipeL" : "rise", box: [W * .5, H * .1, W * .46, H * .66], glass: true, c: K.co,
    until: i < 3 ? T(sh[i + 1][1]) + .3 : T(289) }));
  focus(W * .73, H * .52, u * 8, T(286.6), { label: "BLUE LIPS", side: -1, c: K.co, until: T(289) });
  shot("A56", { t: T(289.0), d: 3.9, mv: "push", a: .7, in: "mist", c: K.co });
  head("DON'T <b>WAIT</b>", T(289.6), { x: W * .06, y: H * .14, size: 7.4, c: K.co });
  phone(`<div style="padding:30% 8% 0;text-align:center"><div style="font:600 ${u * 1.5}px var(--font-script);letter-spacing:.2em;color:${K.mute}">CALLING…</div>
    <div style="font:800 ${u * 8}px var(--font-head);margin:${u}px 0">108</div><div style="font:700 ${u * 2}px var(--font-head)">Ambulance</div>
    <div style="margin:${u * 9}px auto 0;width:${u * 7}px;height:${u * 7}px;border-radius:50%;background:#e8473b;display:flex;align-items:center;justify-content:center;font-size:${u * 3}px">✆</div></div>`,
    W * .66, H * .08, H * .78, T(291.2), { rot: 5 });
  BK.done();
</script>
</body></html>
