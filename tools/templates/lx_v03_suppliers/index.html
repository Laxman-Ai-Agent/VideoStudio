<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_v03_suppliers: V03 suppliers: five chips stack into the logo, $26B, growth loop */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const ks = ["nv", "amd", "goo", "ms", "bro"], names = ["NVIDIA", "AMD", "GOOGLE", "MICROSOFT", "BROADCOM"], t26 = at("b26", 7.6), tWhy = at("why", 10.4);
  shot("B03", { t: 0, d: tWhy + .5, mv: "push", a: .6, in: "line", until: tWhy });
  dim(0, tWhy, .8, { bg: "#07090f" });
  grid();
  logo("anthropic_logo_w", [W * .14, H * .07, W * .72, H * .03], .2);
  names.forEach((n, i) => chip(n, W * .22, H * (.15 + i * .055), at(ks[i], 1.6 + i * .7), { w: W * .56, size: 3.6, c: K.green, until: tWhy - .1 }));
  num(0, 26, t26 - .2, { align: "center", y: H * .45, pre: "$", unit: "B SHARES", size: 20, col: K.green, c: K.ink, d: .9, until: tWhy - .1 });
  shot("B02", { t: tWhy - .1, d: D - tWhy, mv: "orbit", a: .7, in: "whip" });
  dim(tWhy, null, .65, { bg: "linear-gradient(180deg, #07090fee 25%, #07090f20 65%)" });
  chip("ANTHROPIC GROWS ▲", W * .12, H * .12, tWhy + .2, { w: W * .76, size: 3.6 });
  arrow(W * .5, H * .17, W * .5, H * .24, tWhy + .8, { c: K.green });
  chip("CHIPS + CLOUD GROW ▲", W * .12, H * .25, tWhy + 1.2, { w: W * .76, size: 3.6, c: K.green });
  LK.done();
</script>
</body></html>
