<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l22_tonight: L22 recap: snoring is not always good sleep, can be a warning; tonight watch the snorer at home for pauses; no self-medication, ask a doctor about a sleep study */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 438.7);
  shot("A01", { t: 0, d: 3.2, mv: "breathe", in: "cut", until: T(442.5) });
  myth("గురక = <b>మంచి నిద్ర</b>", T(439.0), T(441.3), { x: W * .06, y: H * .16, until: T(442.4) });
  shot("A03", { t: T(442.5), d: 5, mv: "push", in: "dim", fy: .6, until: T(447.5) });
  trace(0, H * .74, W, H * .24, T(442.8), { ev: [[0, T(444.0), "snore"], [T(444.0), T(450), "apnea"]], label: "AIRFLOW", warn: "WARNING SIGNAL", until: T(447.4) });
  head("A <b>WARNING</b> SIGNAL", T(445.9), { x: W * .06, y: H * .14, size: 6.4, until: T(447.4) });
  dust({ t: T(447.5) });
  const v = shot("A59", { t: T(447.5), d: 8.9, mv: "push", a: .5, in: "blink", until: T(456.4) });
  clock(W * .86, H * .2, u * 8, T(448.4), { h0: 22, h1: 26, d: 3.2, until: T(456.3) });
  head("TONIGHT, <b>WATCH</b>", T(448.2), { x: W * .06, y: H * .12, size: 6, c: K.moon, until: T(456.3) });
  phone(`<div style="padding:${u * 2.2}px ${u * 1.6}px;font-size:${u * 2.3}px">
    <div style="font-size:${u * 1.9}px;color:${K.mute};letter-spacing:.15em">TONIGHT'S CHECK</div>
    <div style="font-size:${u * 3}px;font-weight:600;margin:${u * .6}px 0 ${u * 1.2}px">Watch the snorer</div>
    ${["Loud snoring?", "Sound stops for 10+ sec?", "Gasp or choke after?", "Tired all day?"].map((s, i) => `<div style="display:flex;gap:${u * .8}px;align-items:center;margin:${u * .7}px 0"><i style="width:${u * 2}px;height:${u * 2}px;border-radius:50%;border:${u * .2}px solid ${i === 1 ? K.co : K.mint};flex:none"></i>${s}</div>`).join("")}
    <div style="margin-top:${u * 1.4}px;padding:${u}px;border-radius:${u}px;background:#6FF0B422;border-left:${u * .3}px solid ${K.mint}">Yes? Book a doctor visit<br>and ask about a <b>sleep study</b></div></div>`, W * .6, H * .06, H * .86, T(452.0), { rot: -4, until: T(456.3) });
  te("గురక మధ్యలో <b>శ్వాస ఆగుతోందా?</b>", T(453.4), { x: W * .06, y: H * .76, until: T(456.3) });
  shot("A61", { t: T(456.4), d: 6.6, mv: "push", a: .6, in: "iris", fx: .5 });
  myth("సొంతంగా <b>మందులు</b>", T(457.9), T(459.2), { x: W * .06, y: H * .14, stamp: "NO" });
  head("ASK ABOUT A <b>SLEEP STUDY</b>", T(461.2), { y: H * .76, size: 5.4, c: K.mint });
  NW.done();
</script>
</body></html>
