<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos seq 09 (128-148 s): race strip 30% faster -> price tag tears -20% -> text breaks into tokens -> $8 / $40 */
.lane { position: absolute; height: 2px; background: repeating-linear-gradient(90deg, var(--text) 0 6px, transparent 6px 14px); opacity: .35; }
.run { position: absolute; width: calc(var(--u) * 3); height: calc(var(--u) * 3); margin: calc(var(--u) * -1.5) 0 0 calc(var(--u) * -1.5); border-radius: 50%; background: var(--c); box-shadow: 0 0 calc(var(--u) * 3) var(--c); }
.trail { position: absolute; height: calc(var(--u) * .8); margin-top: calc(var(--u) * -.4); transform-origin: 0 50%; background: linear-gradient(90deg, transparent, var(--c)); }
.ln { position: absolute; font: 700 calc(var(--u) * 2) var(--font-script); letter-spacing: .14em; color: var(--c); }
.big { position: absolute; font: 800 calc(var(--u) * 11) var(--font-head); line-height: 1; white-space: nowrap; }
.tag { position: absolute; background: var(--text); color: #0D0D10; font: 800 calc(var(--u) * 6) var(--font-head); display: flex; align-items: center; justify-content: center;
       clip-path: polygon(18% 0, 100% 0, 100% 100%, 18% 100%, 0 50%); }
.tag::before { content: ""; position: absolute; left: 9%; top: 44%; width: 5%; aspect-ratio: 1; border-radius: 50%; background: #0D0D10; }
.tok { position: absolute; padding: calc(var(--u) * .7) calc(var(--u) * 1.2); border-radius: calc(var(--u) * .4); border: 1px solid var(--primary); background: #6EF0B514;
       color: var(--text); font: 700 calc(var(--u) * 2.6) var(--font-script); white-space: nowrap; }
.pc { position: absolute; border-radius: calc(var(--u) * 1); padding: calc(var(--u) * 1.6) calc(var(--u) * 2.4); background: #ffffff0e; border: 1px solid #ffffff2a; }
.pc b { display: block; font: 800 calc(var(--u) * 7.5) var(--font-head); color: var(--c); line-height: 1; }
.pc i { font: 700 calc(var(--u) * 1.8) var(--font-script); font-style: normal; color: var(--text); letter-spacing: .14em; }</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, pop, out, head, redact, kick, scramble, count, chip, slam, camera, bg, flash } = K;
  bg({ seed: 19 });
  const st = K.$("stage"); camera(st, 1.04, 0.01);

  // A. race strip: old 5.1 and new 5.2 run the same lane length; 5.2 gets 30% further, the number counts up
  const tSp = at("speed", 0.7), tFa = at("fast", 5.0), t30 = at("thirty", 6.0);
  const h0 = head("SPEED <em>&amp;</em> PRICE", W * 0.06, H * 0.07, 5); redact(h0, Math.max(0.1, tSp - 0.3));
  const x0 = W * 0.06, x1 = W * 0.62, lanes = [[H * 0.32, "FABLE 5.1", PAL.mute, 0.62], [H * 0.46, "FABLE 5.2", PAL.fab, 1.0]];
  lanes.forEach(([y, name, c, f], i) => {
    place(mk("div", "lane"), x0, y, x1 - x0);
    const l = place(mk("div", "ln", st, name), x0, y - u * 4.5); l.style.setProperty("--c", c);
    const tr = place(mk("div", "trail"), x0, y, (x1 - x0) * f); tr.style.setProperty("--c", c);
    const r = place(mk("div", "run"), x0, y); r.style.setProperty("--c", c);
    tl.fromTo([l], { opacity: 0 }, { opacity: 1, duration: 0.3 }, tSp + 0.2);
    tl.fromTo(tr, { scaleX: 0 }, { scaleX: 1, duration: 2.2, ease: "power2.inOut", immediateRender: true }, tSp + 0.6);
    tl.fromTo(r, { left: x0 }, { left: x0 + (x1 - x0) * f, duration: 2.2, ease: "power2.inOut", immediateRender: true }, tSp + 0.6);
  });
  const n30 = place(mk("div", "big"), W * 0.66, H * 0.3); n30.style.color = PAL.fab; tl.set(n30, { opacity: 0 }, 0);
  tl.to(n30, { opacity: 1, duration: 0.1 }, Math.max(tFa, t30 - 0.3)); count(n30, 0, 30, Math.max(tFa, t30 - 0.3), 0.9, (v) => Math.round(v) + "%");
  const kF = kick("FASTER ANSWERS", W * 0.67, H * 0.3 + u * 12); tl.fromTo(kF, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t30 + 0.4);

  // B. price: the race clears, a price tag swings in and tears in two on "20%"
  const t20 = at("twenty", 8.2), tg = W * 0.3, th = H * 0.2;
  tl.to(st.querySelectorAll(".lane,.ln,.trail,.run"), { opacity: 0, x: -u * 8, duration: 0.45, ease: E.out, stagger: 0.02 }, t20 - 1.2);
  tl.to([n30, kF], { opacity: 0, duration: 0.4 }, t20 - 1.2);
  const halves = [0, 1].map((i) => { const t = place(mk("div", "tag", st, "PRICE"), W * 0.08, H * 0.3, tg, th);
    t.style.clipPath = i ? "polygon(52% 0, 100% 0, 100% 100%, 58% 100%, 55% 60%, 50% 40%)" : "polygon(18% 0, 52% 0, 50% 40%, 55% 60%, 58% 100%, 18% 100%, 0 50%)"; return t; });
  tl.fromTo(halves, { rotation: -25, opacity: 0, transformOrigin: "10% 50%" }, { rotation: 0, opacity: 1, duration: 0.7, ease: "elastic.out(1, .5)", immediateRender: true }, t20 - 0.9);
  tl.to(halves[0], { rotation: -12, x: -u * 3, y: u * 3, duration: 0.4, ease: E.in }, t20 + 0.1);
  tl.to(halves[1], { rotation: 14, x: u * 5, y: u * 6, duration: 0.4, ease: E.in }, t20 + 0.1);
  const m20 = place(mk("div", "big", st, "-20%"), W * 0.5, H * 0.3); m20.style.color = PAL.fab; slam(m20, t20 + 0.15);
  const kC = kick("CHEAPER THAN 5.1", W * 0.51, H * 0.3 + u * 12); tl.fromTo(kC, { opacity: 0 }, { opacity: 1, duration: 0.3 }, t20 + 0.6);

  // C. tokens: a sentence shatters into word chips that stack into a column; then the two price cards
  const tT = at("tokens", 12.6), tPi = at("pieces", 11.4), t8 = at("eight", 15.6), t40 = at("forty", 17.8);
  tl.to([...halves, m20, kC, h0], { opacity: 0, y: -u * 4, duration: 0.45, ease: E.out }, Math.min(tPi, tT) - 1.0);
  const words = ["AI", "READS", "TEXT", "IN", "TINY", "PIECES"], toks = [];
  let wx = W * 0.06;
  words.forEach((w, i) => { const e = place(mk("div", "tok", st, w), wx, H * 0.14); wx += (w.length * 1.75 + 4.2) * u; toks.push(e);
    tl.fromTo(e, { opacity: 0, y: -u * 3 }, { opacity: 1, y: 0, duration: 0.25, ease: E.in, immediateRender: true }, Math.min(tPi, tT) - 0.6 + i * 0.07); });
  toks.forEach((e, i) => tl.to(e, { left: W * 0.06 + (i % 2) * u * 16, top: H * (0.3 + Math.floor(i / 2) * 0.11), rotation: (i % 3 - 1) * 4, duration: 0.6, ease: E.io }, tT - 0.1 + i * 0.05));
  const hT = place(mk("div", "big", st), W * 0.06, H * 0.12); hT.style.fontSize = u * 6 + "px"; hT.style.color = PAL.text; tl.set(hT, { opacity: 0 }, 0);
  tl.to(toks, { opacity: 0.55, duration: 0.3 }, tT + 0.6); scramble(hT, "= TOKENS", tT + 0.2, 0.6);
  [["$8", "PER 1M INPUT TOKENS", PAL.fab, t8], ["$40", "PER 1M OUTPUT TOKENS", PAL.myt, t40]].forEach(([v, k, c, t], i) => {
    const p = place(mk("div", "pc", st, `<b></b><i>${k}</i>`), W * (0.44 + i * 0.27), H * 0.3); p.style.setProperty("--c", c);
    pop(p, t - 0.25, { y: H * 0.2, opacity: 0, rotation: i ? 3 : -3 }, 0.6, E.in);
    count(p.querySelector("b"), 0, parseInt(v.slice(1)), t - 0.1, 0.6, (x) => "$" + Math.round(x));
  });
  K.done();
</script></body></html>
