<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l15_study: L15 one night in hospital: breathing, blood oxygen, heart, brain waves recorded = polysomnography; home sleep test for some */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 297.2);
  shot("A43", { t: 0, d: 5, mv: "panR", a: .5, in: "cut", until: T(300.4) });
  tag("ONE NIGHT IN THE HOSPITAL", T(298.0), { until: T(300.3) });
  shot("A44", { t: T(300.4), d: 9.2, mv: "push", a: .4, in: "dim", box: [0, 0, W * .4, H], until: T(309.6) });
  const X = W * .43, CW = W * .54, ch = H * .16;
  trace(X, H * .06, CW, ch, T(300.6), { ev: [[0, T(302), "calm"], [T(302), T(305), "apnea"], [T(305), T(306), "gasp"], [T(306), T(320), "calm"]], win: 6, label: "1 · BREATHING", until: T(309.5) });
  spo2(X, H * .25, T(302.2), [[0, 95], [T(303.0), 95], [T(304.6), 86], [T(306.4), 94]], { label: "2 · BLOOD OXYGEN", until: T(309.5) });
  trace(X + u * 24, H * .25, CW - u * 24, ch, T(304.5), { wave: "ecg", win: 4, label: "3 · HEART", until: T(309.5) });
  trace(X, H * .46, CW, ch, T(306.1), { wave: "eeg", win: 3, label: "4 · BRAIN WAVES", until: T(309.5) });
  tag("● REC · ALL NIGHT", T(308.3), { x: X, y: H * .68, c: K.co, until: T(309.5) });
  shot("A06", { t: T(309.6), d: 3, mv: "drift", in: "fade", until: T(312.6) });
  doc(`<h3>Polysomnography report</h3><div style="color:#6d6378">Sample · overnight sleep study</div><div class="rule"></div>
    Total sleep time: <b>6 h 48 min</b><br>Apnea-hypopnea index (AHI): <span class="hl"><b>34 / hour</b></span><br>
    Lowest SpO₂: <span class="hl"><b>81%</b></span><br>Longest pause: <b>38 sec</b><br><br>Impression: <b>severe obstructive sleep apnea</b><br>Plan: CPAP titration`,
    W * .5, H * .08, W * .42, H * .66, T(309.8), { until: T(312.6) });
  head("<b>POLY</b>SOMNOGRAPHY", T(310.4), { x: W * .05, y: H * .74, size: 5.4, until: T(312.5) });
  shot("A45", { t: T(312.6), d: 2.2, mv: "push", in: "rise", box: [W * .1, H * .08, W * .8, H * .7], win: true, bar: "HOME SLEEP TEST", c: K.mint });
  te("కొంతమందికి <b>ఇంట్లోనే</b> test", T(313.2), { y: H * .82, align: "center" });
  NW.done();
</script>
</body></html>
