<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ck.js"></script><script src="ck_geo.js"></script><script src="ck2.js"></script>
<style>/* 10 Cyclone_Akwan ck_l18_rescue: L18 CM Chandrababu Naidu orders coastal precautions; Odisha 74 rescue teams, evacuation; 24-hour control rooms; shelters checked for food, water, electricity */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 268.3);
  atmo();
  shot("A42", { t: 0, d: 4.7, mv: "push", in: "cut", until: T(273.0) });
  doc(`<h3>Coastal alert</h3><div class="rule"></div>CM <span class="hl">Chandrababu Naidu</span><br>orders <span class="hl">advance precautions</span><br>in all coastal areas`,
      W * .52, H * .18, W * .4, H * .5, T(269.6), { until: T(272.9) });
  shot("A19", { t: T(273.0), d: 2.9, mv: "push", in: "wipe", until: T(275.9) });
  tag("ODISHA", T(273.1), { until: T(278.5) });
  num(0, 74, T(274.6), { x: W * .06, y: H * .56, unit: "RESCUE TEAMS", d: 1.2, until: T(278.5) });
  shot("A20", { t: T(275.9), d: 2.7, mv: "panL", in: "wipeL", until: T(278.6) });
  te("ప్రజలను <b>సురక్షిత</b> ప్రాంతాలకు", T(277.1), { until: T(278.5) });
  shot("A22", { t: T(278.6), d: 2.6, mv: "push", in: "cut", box: [W * .46, 0, W * .54, H], until: T(281.1) });
  clock24(W * .24, H * .48, u * 16, T(278.6), { until: T(281.0) });
  tag("CONTROL ROOMS", T(280.1), { x: W * .08, y: H * .84, until: T(281.0) });
  shot("A21", { t: T(281.1), d: 4.4, mv: "push", in: "wipeU" });
  tag("CYCLONE SHELTERS", T(281.3), { c: K.ok });
  list([["Food", T(282.2), true], ["Drinking Water", T(282.9), true], ["Electricity", T(283.6), true]], W * .06, H * .5);
  CK.done();
</script>
</body></html>
