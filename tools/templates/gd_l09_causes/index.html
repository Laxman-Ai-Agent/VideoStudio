<style>/* 18 Acidity_GERD gd_l09_causes: L09 why the door weakens: no single cause; weight, pregnancy, smoking, alcohol; hiatal hernia */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 147.7);
  drench(0, { part: "out" });
  shot("A20", { t: 0, d: 2.5, mv: "pull", in: "cut", until: T(150.2) });
  head("WHY DOES THE DOOR <b>WEAKEN</b>?", T(147.9), { y: H * .14, size: 5.4, until: T(150.1) });
  fizz({ t: T(150.2), dens: [[0, .3]] });
  head("NOT <b>ONE</b> CAUSE", T(150.4), { y: H * .08, size: 4.6, until: T(158.2) });
  const g = [["A24", T(152.1), "WEIGHT"], ["A25", T(153.2), "PREGNANCY"], ["A26", T(154.1), "SMOKING"], ["A27", T(154.8), "ALCOHOL"]];
  g.forEach(([k, t0, f], i) => shot(k, { t: t0, d: 6, mv: i % 2 ? "panL" : "push", a: .6, in: "rise", box: [W * (.04 + i * .235), H * .24, W * .215, H * .5], fr: true, fig: f, no: 7 + i, c: i > 1 ? K.fl : K.acid, until: T(158.2) }));
  te("ఈ సమస్య వచ్చే అవకాశాన్ని <b>పెంచుతాయి</b>", T(156.0), { y: H * .82, until: T(158.2) });
  shot("A28", { t: T(158.3), d: 6.2, mv: "push", in: "melt" });
  head("HIATAL <b>HERNIA</b>", T(158.4), { y: H * .1, size: 6 });
  callout(W * .52, H * .5, W * .14, H * .12, "STOMACH SLIPS UP", T(161.4), { c: K.fl });
  te("కడుపు పై భాగం <b>ఛాతీ వైపుకి</b> జారిపోవడం", T(162.3), { y: H * .82 });
  AC.done();
</script>
</body></html>
