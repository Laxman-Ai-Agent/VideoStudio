<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos seq 02 (16-31 s): Fable strict | Mythos free split -> it fooled the testers (presenter shock) */
.half { position: absolute; top: 0; height: 100%; overflow: hidden; }</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, card, pop, out, dim, head, redact, kick, vcard, chip, icon, slam, shake, camera, bg, flash } = K;
  bg({ seed: 12 });
  const st = K.$("stage"); camera(st, 1.04, -0.01);

  // A. the frame splits: mint half for Fable, violet half for Mythos (the cards carry over from seq 01 at the edges)
  const tF = at("fable", 0.3), tS = at("strict", 1.6), tM = at("mythos", 2.7), tR = at("freedom", 3.9);
  const L = place(mk("div", "half"), 0, 0, W / 2), R = place(mk("div", "half"), W / 2, 0, W / 2);
  L.style.background = `linear-gradient(90deg, ${PAL.fab}10, ${PAL.fab}26)`; R.style.background = `linear-gradient(90deg, ${PAL.myt}26, ${PAL.myt}10)`;
  tl.fromTo(L, { xPercent: -100 }, { xPercent: 0, duration: 0.6, ease: E.io, immediateRender: true }, Math.max(0, tF - 0.3));
  tl.fromTo(R, { xPercent: 100 }, { xPercent: 0, duration: 0.6, ease: E.io, immediateRender: true }, Math.max(0, tF - 0.3));
  const cw = W * 0.14, ch = cw * 1.38;
  const fab = vcard("fab", W * 0.06, H * 0.1, cw, ch), myt = vcard("myt", W * 0.8, H * 0.1, cw, ch);
  pop(fab, Math.max(0, tF - 0.2), { x: -u * 10, rotation: -7, opacity: 0 }, 0.6, E.in); pop(myt, Math.max(0, tF), { x: u * 10, rotation: 7, opacity: 0 }, 0.6, E.in);

  // B. STRICT: the real padlock card snaps shut (punch + shake), a lock icon locks; rules typed under it
  const lk = card({ i: "lock", x: W * 0.24, y: H * 0.1, w: W * 0.2, h: W * 0.2, focus: [0.5, 0.5, 1.05] });
  pop(lk, tS - 0.3, { scale: 0.5, opacity: 0, rotation: -6 }, 0.5);
  tl.to(lk, { scale: 1.08, duration: 0.08, yoyo: true, repeat: 1, ease: "power2.out" }, tS + 0.35); shake(lk, tS + 0.4, u * 0.4);
  const iL = icon("lock", W * 0.06 + cw / 2 - u * 2.5, H * 0.1 + ch + u * 2, u * 5, PAL.fab); pop(iL, tS + 0.3, { scale: 0, opacity: 0 }, 0.4);
  const hS = head("STRICT <em>RULES</em>", W * 0.06, H * 0.58, 5.2); redact(hS, tS + 0.2);

  // C. FREEDOM: the lock icon springs open on the Mythos side, MORE FREEDOM unredacts; a violet glow breathes
  const iU = icon("unlock", W * 0.8 + cw / 2 - u * 2.5, H * 0.1 + ch + u * 2, u * 5, PAL.myt);
  tl.fromTo(iU, { opacity: 0, rotation: 0 }, { opacity: 1, rotation: -18, duration: 0.5, ease: "back.out(3)", immediateRender: true }, tR - 0.1);
  const hR = head("MORE <b>FREEDOM</b>", W * 0.54, H * 0.58, 5.2); redact(hR, tR);
  const glow = place(mk("div", "", R), W * 0.05, H * 0.05, W * 0.4, H * 0.6);
  glow.style.cssText += `;position:absolute;border-radius:50%;background:radial-gradient(${PAL.myt}40, transparent 65%)`;
  tl.fromTo(glow, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1.1, duration: 1.2, ease: E.soft, yoyo: true, repeat: 1 }, tR);
  const qm = chip("WHY ?", W / 2 - u * 5, H * 0.4, PAL.text); pop(qm, tR + 0.8, { scale: 0.4, opacity: 0 }, 0.4);

  // D. the twist: everything slides away, the presenter fills the right side in shock, the slam lands left
  const tX = at("smart", 6.2), tE = at("experts", 9.0), tO = at("fooled", 11.0);
  tl.to([L, fab, lk, iL, hS], { x: -W * 0.6, opacity: 0, duration: 0.7, ease: "power3.in", stagger: 0.03 }, tX - 0.8);
  tl.to([R, myt, iU, hR, glow, qm], { x: W * 0.6, opacity: 0, duration: 0.7, ease: "power3.in", stagger: 0.03 }, tX - 0.8);
  const k2 = kick("SMARTER THAN ITS TESTERS?", W * 0.06, H * 0.16); tl.set(k2, { opacity: 0 }, 0); tl.to(k2, { opacity: 1, duration: 0.3 }, tX);
  const pr = card({ i: "pres_shock", x: W * 0.46, y: 0, w: W * 0.54, h: H, shape: "cut" });
  pop(pr, tX + 0.1, { scale: 1.25, opacity: 0, y: u * 4 }, 0.5, E.in); tl.to(pr, { scale: 1.05, duration: D - tX, ease: "none" }, tX + 0.6);
  const ce = chip("EXPERTS", W * 0.06, H * 0.26, PAL.fab); icon("eye", W * 0.2, H * 0.245, u * 4.4, PAL.fab, ce.parentNode).id = "eyeI";
  pop(ce, tE, { x: -u * 6, opacity: 0 }, 0.4, E.in); pop(K.$("eyeI"), tE + 0.15, { scale: 0, opacity: 0 }, 0.4);
  const h1 = head("IT <s>FOOLED</s>", W * 0.05, H * 0.3, 9.5), h2 = head("THE TESTERS", W * 0.05, H * 0.5, 7);
  tl.set([h1.querySelector(".rt"), h2.querySelector(".rt")], { opacity: 1 }, 0);
  slam(h1, tO); slam(h2, tO + 0.45); flash(tO + 0.3, 0.35);
  K.done();
</script></body></html>
