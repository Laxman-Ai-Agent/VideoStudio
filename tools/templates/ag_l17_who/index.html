<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l17_who: L17 WHO 2025: life expectancy -1.8 yrs (2019-21), a decade lost; average ~71 vs 150 on a ruler */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tWh = at("who", 1.8), tDr = at("drop", 6.4), tDe = at("decade", 10.7), tAv = at("avg", 13.6), tFa = at("far", 17.2);
  paper();
  photo("A29", { t: 0, d: tAv + .5, mv: "push", a: .5, in: "blinds", until: tAv + .2 });
  wash(0, tAv, { a: .94 });
  kick("WHO · 2025 REPORT", tWh - .4, { y: H * .12, until: tAv });
  kick("GLOBAL LIFE EXPECTANCY · 2019 → 2021", tWh + .3, { y: H * .18, c: K.ink, size: 1.8, until: tAv });
  count(0, 1.8, tDr - .8, { y: H * .26, size: 20, pre: "−", unit: "YEARS", c: K.warn, fmt: (v) => v.toFixed(1), d: 1.2, until: tAv });
  chart([[0, .2], [.15, .32], [.3, .44], [.45, .55], [.6, .66], [.75, .76], [.85, .82], [1, .48]], tDe - 1.6, { box: [W * .5, H * .16, W * .42, H * .44], c: K.warn, d: 1.6, until: tAv });
  stamp("~10 YEARS OF PROGRESS GONE", W * .28, H * .66, tDe, { c: K.warn, size: 3, rot: -3, until: tAv });
  photo("A30", { t: tAv - .2, d: D - tAv + .5, mv: "panL", a: .5, in: "wipe" });
  wash(tAv, null, { bg: `linear-gradient(0deg, ${K.bg}f8 50%, ${K.bg}a0)` });
  head("Average human today: <em>~71</em>", tAv + .2, { y: H * .12, size: 6.5 });
  const R = ruler(0, 150, [W * .08, H * .66, W * .84], tAv + .6, { step: 10, major: 5 });
  R.mark(71, tAv + 1.4, "TODAY ~71", K.green, { hi: 8 });
  R.mark(150, tFa - .3, "150", K.red, { hi: 8 });
  arrow(R.X(75), H * .56, R.X(146), H * .56, tFa, { c: K.red, d: 1.2 });
  chip("STILL VERY FAR", R.X(98), H * .45, tFa + .8, { c: K.red });
  AT.done();
</script>
</body></html>
