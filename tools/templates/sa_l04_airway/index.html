<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l04_airway: L04 normal airway: nose / mouth -> soft tube behind the throat -> lungs; muscles keep it open by day; at night muscles relax; most stay open */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 67.0);
  shot("A10", { t: 0, d: 3.4, mv: "push", a: .6, in: "dim", until: T(70.4) });
  tag("NOSE", T(68.5), { x: W * .06, y: H * .14, c: K.mint, until: T(70.3) });
  tag("MOUTH", T(69.3), { x: W * .06, y: H * .22, c: K.mint, until: T(70.3) });
  airway(W * .06, H * .14, W * .88, H * .46, T(70.4), { g: [[0, 1]], until: T(75.0) });
  head("A SOFT <b>TUBE</b>", T(72.1), { x: W * .06, y: H * .66, size: 6, c: K.mint, until: T(74.9) });
  focus(W * .88, H * .37, u * 6, T(73.5), { c: K.mint, label: "LUNGS", side: -1, until: T(74.9) });
  const d = shot("A11", { t: T(75.0), d: 4.6, mv: "push", in: "wipe", until: T(79.5) });
  tag("DAYTIME", T(75.2), { c: K.moon, until: T(79.4) });
  head("MUSCLES HOLD IT <b>OPEN</b>", T(76.8), { y: H * .7, size: 5.8, c: K.mint, until: T(79.4) });
  dust({ t: T(79.4), dens: [[0, .8]] });
  shot("A01", { t: T(79.4), d: 4.8, mv: "breathe", in: "dim", until: T(84.2) });
  clock(W * .84, H * .24, u * 9, T(79.6), { h0: 21, h1: 23.5, d: 2.5, until: T(84.1) });
  head("AT NIGHT, MUSCLES <b>RELAX</b>", T(82.6), { y: H * .7, size: 5.8, c: K.lil, until: T(84.1) });
  shot("A54", { t: T(84.2), d: 5.6, mv: "drift", in: "fade", box: [0, 0, W * .42, H] });
  airway(W * .46, H * .16, W * .5, H * .4, T(84.4), { g: [[0, 1], [T(85.6), .72]], m: "THROAT · RELAXED" });
  te("చాలా మందిలో దారి <b>తెరిచే</b> ఉంటుంది", T(87.2), { x: W * .46, y: H * .62, size: 3.3 });
  tag("STILL OPEN ✓", T(88.8), { x: W * .46, y: H * .76, c: K.mint });
  NW.done();
</script>
</body></html>
