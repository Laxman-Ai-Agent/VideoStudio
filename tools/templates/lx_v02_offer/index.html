<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_v02_offer: V02 offer: $70-$78 bracket, 825M shares = $64B, valuation $1.4T */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const t70 = at("p70", 1.4), tM = at("m825", 6), t64 = at("b64", 8.4), tVa = at("val", 10.8), t14 = at("t14", 12);
  shot("B08", { t: 0, d: tVa + .5, mv: "rise", a: .7, in: "wipe", until: tVa });
  dim(0, tVa, .78, { bg: "#07090f" });
  grid();
  mono("PRICE PER SHARE", .2, { align: "center", y: H * .08, c: K.gold });
  bracket("$70", "$78", t70 - .2, { box: [W * .14, H * .17, W * .72], until: tVa - .1 });
  num(0, 825, tM - .2, { align: "center", y: H * .3, unit: "M SHARES", size: 22, d: 1, until: tVa - .1 });
  num(0, 64, t64 - .2, { align: "center", y: H * .47, pre: "= $", unit: "B", size: 20, col: K.gold, c: K.ink, d: .9, until: tVa - .1 });
  shot("A09", { t: tVa - .1, d: D - tVa, mv: "push", a: .7, in: "line" });
  dim(tVa, null, .7, { bg: "radial-gradient(ellipse at 50% 30%, #07090fee, #07090f40 80%)" });
  mono("VALUATION · REPORTS", tVa + .1, { align: "center", y: H * .18, c: K.gold });
  num(0, 1.4, t14 - .2, { align: "center", y: H * .22, pre: "$", unit: "T", size: 25, col: K.gold, c: K.ink, fmt: (v) => v.toFixed(1), d: 1 });
  ring(W * .5, H * .3, t14 + .5, { c: K.gold, r: u * 40, n: 2 });
  LK.done();
</script>
</body></html>
