<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_v01_hook: V01 hook: candles cake + 150 counter, old mouse plate sight back, turning back age */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tMi = at("mice", 4), tBk = at("back", 7.8);
  paper();
  photo("B07", { t: 0, d: tMi + .5, mv: "push", a: .8, in: "fade", shade: "top", until: tMi + .2 });
  kick("CAN HUMANS LIVE TO", .2, { y: H * .1, c: "#fff", shadow: 1, until: tMi });
  count(0, 150, .4, { y: H * .15, size: 36, col: "#fff", c: "#FFB199", unit: "YRS", shadow: 1, d: 2, until: tMi });
  photo("B02", { t: tMi + .1, d: D - tMi + .5, mv: "push", a: .6, in: "drop", box: [W * .1, H * .28, W * .8, H * .38], plate: true, fig: "OLD MICE · SIGHT RESTORED", rot: -2 });
  head("Sight <em>back</em> in old mice", tMi, { y: H * .1, size: 8.5, c: K.green });
  head("Next: <em>humans?</em>", tBk - .3, { y: H * .18, size: 8.5 });
  path(`M${W * .8} ${H * .74} A ${W * .2} ${W * .2} 0 1 1 ${W * .55} ${H * .7}`, tBk, { c: K.red, w: 1, d: .9 });
  AT.done();
</script>
</body></html>
