<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="kit.js"></script><script src="doc.js"></script><script src="bio.js"></script>
<style>/* 09_Sugar_Walk L13 (222-237 s): habits that raise sugar. Five cards spring in on their words (poor sleep photo, tension = stressed brain
   PNG, smoking = cigarette PNG, sitting photo, late heavy dinner photo + clock PNG); each card pushes the blood sugar meter one step up;
   then cortisol: stressed brain PNG pushes glucose molecule PNGs up. */
.hc { position: absolute; border-radius: calc(var(--u) * 1.4); overflow: hidden; background: #0F1626; border: 1px solid #FF3B3066; box-shadow: 0 0 calc(var(--u) * 2) #FF3B3033; }
.hc .lb { position: absolute; left: 0; right: 0; bottom: 0; padding: calc(var(--u) * .8); text-align: center; font: 800 calc(var(--u) * 1.9) var(--font-head); color: #EAF2FF;
          background: linear-gradient(0deg, #0A0E17f0, #0A0E1700); }
.hc .pi { position: absolute; inset: 0 0 18% 0; background: no-repeat center / contain; }
.ar { position: absolute; font: 800 calc(var(--u) * 6) var(--font-head); color: #FF3B30; text-shadow: 0 0 calc(var(--u) * 2) #FF3B30; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, u, tl, E, at, mk, place, pop, out, cam, head, rehead, ix, S } = X;
  const { K, dbg, breathe, badge, png, meter } = B;
  const SP = E.spring;
  document.documentElement.style.setProperty("--u", u + "px");
  dbg();
  const tSl = at("sleep", 1.9), tTe = at("tens", 3.6), tSm = at("smoke", 4.2), tSi = at("sit", 5.1), tLa = at("late", 6.9), tHa = at("habits", 9.6), tCo = at("cort", 11.8), tPu = at("push", 14.2);
  const h1 = head('Habits that <em class="r">raise sugar</em>', "ఇవన్నీ sugar ని పెంచే అలవాట్లే", .1, { kick: "WATCH OUT", w: W * .6, x: W * .05, y: H * .1, size: 7.6 });
  const me = meter(W * .9, H * .3, u * 2.4, H * .44, "BLOOD SUGAR"); tl.fromTo(me, { opacity: 0 }, { opacity: 1, duration: .4, immediateRender: true }, tSl - .3);
  me.set(0, .2, K.green, "NORMAL", .1);
  const src = (k) => (S.images || [])[ix(k)] || "";
  const CARDS = [["sleep", true, "POOR SLEEP", tSl], ["P22_brain", false, "TENSION", tTe], ["P25_cigarette", false, "SMOKING", tSm], ["sit", true, "SITTING FOR HOURS", tSi], ["late", true, "LATE HEAVY DINNER", tLa]];
  const cw = W * .155, chh = H * .36;
  const cards = CARDS.map(([k, photo, n, t], i) => {
    const e = place(mk("div", "hc", undefined, `<div class="pi"></div><div class="lb">${n}</div>`), W * (.05 + i * .165), H * .42, cw, chh);
    const pi = e.querySelector(".pi"); pi.style.backgroundImage = `url(${src(k)})`; if (photo) { pi.style.backgroundSize = "cover"; pi.style.inset = "0"; }
    pop(e, t - .2, { y: u * 8, opacity: 0, rotation: i % 2 ? 4 : -4 }, .9, SP); breathe(e, t + .8, u * .5, 2.6 + i * .2);
    me.set(t + .1, .2 + (i + 1) * .14, i < 2 ? K.amber : K.red, i < 2 ? "RISING" : "HIGH", .6); return e; });
  const ck = png("P26_clock", W * .05 + 4 * W * .165 + cw * .85, H * .43, H * .1, { c: K.amber }); pop(ck, tLa + .3, { scale: .3, opacity: 0 }, .7, SP);
  const bH = badge("ALL RAISE <b>SUGAR</b>", K.red, W * .05, H * .84); pop(bH, tHa, { x: -u * 3, opacity: 0 }, .7, SP);

  /* cortisol pushes glucose up */
  out([...cards, ck, bH], tCo - .6, { y: u * 4, stagger: .04 });
  const h2 = rehead(h1, 'Stress = <em class="r">cortisol</em>', "tension లో release అయ్యే cortisol sugar ని పైకి తోస్తుంది", tCo - .4, { kick: "STRESS HORMONE", w: W * .6, x: W * .05, y: H * .1, size: 7.6 });
  const br = png("P22_brain", W * .32, H * .62, H * .36, { c: K.red, g: 2.4 }); pop(br, tCo - .3, { scale: .3, opacity: 0 }, 1, SP); breathe(br, tCo + .7, u * .6, 2.4);
  const bC = badge("<b>CORTISOL</b>", K.red, W * .24, H * .84); pop(bC, tCo + .2, { y: u * 2, opacity: 0 }, .6, SP);
  for (let i = 0; i < 6; i++) { const m = png("P01_glucose", W * (.55 + (i % 3) * .1), H * .82, H * .08, { c: K.cyan, g: 1 }), t = tCo + .5 + i * .3;
    tl.fromTo(m, { opacity: 0, y: 0 }, { opacity: 1, y: -H * (.4 + (i % 2) * .08), rotation: 90, duration: 1.4, ease: "power2.out", immediateRender: true }, t); breathe(m, t + 1.4, u * .4, 2); }
  const ar = place(mk("div", "ar", undefined, "&#8593;"), W * .78, H * .3); pop(ar, tPu - .6, { y: u * 4, opacity: 0 }, .7, SP);
  me.set(tPu - .4, .9, K.red, "UP", .8);
  cam(0, Math.max(D, 1), 1.035);
  X.done();
</script></body></html>
