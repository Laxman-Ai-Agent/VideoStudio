<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 379.0);
  flow({ n: 120, breathe: 4, alpha: .55, band: .8, until: T(387) });
  head("NO <b>CURE</b> YET", T(379.6), { y: H * .26, align: "center", size: 7.4, c: K.hn, until: T(387) });
  head("BUT FULL <b>CONTROL</b>", T(382.7), { y: H * .4, align: "center", size: 7.4, until: T(387) });
  meter(W * .3, H * .62, W * .4, u * 4, T(383.4), { from: .2, to: .95, d: 2.2, label: "CONTROL", until: T(387) });
  shot("A10", { t: T(387.0), d: 8.4, mv: "drift", a: .8, in: "mist" });
  myth("<b>బలహీనమైన</b> ఊపిరితిత్తులు", T(389.0), T(391.6), { x: W * .06, y: H * .14, stamp: "WRONG", until: T(395.4) });
  airway(W * .76, H * .5, u * 14, T(392.4), { id: "x", swell: T(393.2), squeeze: T(393.6) });
  ring(W * .76, H * .5, T(393.4), { r: u * 22, n: 3, c: K.co });
  head("<b>OVER-REACTING</b> AIRWAYS", T(393.2), { x: W * .06, y: H * .7, size: 5, c: K.co });
  BK.done();
</script>
