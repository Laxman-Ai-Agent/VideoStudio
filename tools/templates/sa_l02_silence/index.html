<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l02_silence: L02 snoring at home, 'sleeping deeply', the sound stops, silence for seconds, gasp, breathing stops = sleep apnea */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 29.45);
  const v = shot("A02", { t: 0, d: 5.4, mv: "panR", in: "cut" });
  tag("AT HOME, EVERY NIGHT", T(29.8), { until: T(34.6) });
  te("పాపం <b>గాఢంగా</b> నిద్రపోతున్నారు...", T(32.0), { y: H * .74, until: T(34.6) });
  morph(v, T(34.8), [0, 0, W * .48, H]);
  trace(W * .52, H * .14, W * .44, H * .34, T(34.9), { ev: [[0, T(37.4), "snore"], [T(37.4), T(41.3), "apnea"], [T(41.3), T(43.6), "gasp"], [T(43.6), T(60), "snore"]], label: "ONE SNORE · LIVE", warn: "SILENCE", until: T(46.0) });
  head("THE SOUND <b>STOPS</b>", T(37.3), { x: W * .52, y: H * .56, size: 5, until: T(41.2) });
  num(0, 10, T(38.4), { x: W * .52, y: H * .66, unit: "sec", d: 2.8, size: 11, until: T(41.2) });
  shot("A04", { t: T(41.3), d: 3.5, mv: "push", a: 1.2, in: "cut", z: 18, until: T(46.1) });
  flash(T(41.3), .45);
  head("<b>GASP</b>", T(41.5), { x: W * .06, y: H * .12, size: 9, z: 19, until: T(44.7) });
  tag("EVER NOTICED THIS?", T(44.8), { x: W * .06, y: H * .12, z: 19, until: T(46.0) });
  shot("A03", { t: T(46.1), d: 6.2, mv: "push", a: .6, in: "dim", fy: .6 });
  trace(0, H * .78, W, H * .2, T(46.4), { ev: [[0, T(47.0), "snore"], [T(47.0), T(60), "apnea"]], label: "AIRFLOW", warn: "NO BREATHING", bare: false });
  head("BREATHING <b>STOPS</b>", T(48.3), { x: W * .06, y: H * .14, size: 6.4, until: T(50.3) });
  head("= SLEEP <b>APNEA</b>", T(50.6), { x: W * .06, y: H * .14, size: 6.4 });
  tag("A-PNOEA · GREEK FOR 'WITHOUT BREATH'", T(51.2), { x: W * .06, y: H * .3, c: K.moon });
  NW.done();
</script>
</body></html>
