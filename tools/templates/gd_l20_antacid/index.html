<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_l20_antacid: L20 antacids give temporary relief, they do not remove the cause; not every day without a doctor */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 294.2);
  drench(0, { part: "out" });
  shot("A10", { t: 0, d: 4.4, mv: "push", in: "cut", until: T(298.6) });
  tag("MEDICINES", .1, { y: H * .08 });
  head("<b>ANTACIDS</b>", T(295.6), { y: H * .62, size: 8, until: T(298.5) });
  te("<b>తాత్కాలిక</b> relief మాత్రమే", T(296.3), { y: H * .8, until: T(298.5) });
  fizz({ t: T(298.6), dens: [[0, .3]] });
  tract(W * .55, H * .12, W * .36, H * .78, T(298.6), { acid: [[0, .4]], les: [[0, .5]], reflux: [[0, .6], [T(299.0), .2], [T(299.6), .6]] });
  callout(W * .7, H * .52, W * .1, H * .14, "DOOR STILL WEAK", T(299.6), { c: K.fl });
  myth("antacid = <b>అసలు కారణం</b> తగ్గుతుంది", T(298.8), T(300.2), { x: W * .04, y: H * .24, stamp: "NO" });
  list([["doctor సలహా లేకుండా <b>రోజూ</b> వద్దు", T(301.6), false]], W * .04, H * .62);
  AC.done();
</script>
</body></html>
