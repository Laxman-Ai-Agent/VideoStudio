<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_l04_acid: L04 digestion, parietal cells release hydrochloric acid, very strong, pH 1.5-3.5, lower number = stronger acid */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 61.6);
  drench(0, { part: "out" });
  shot("A12", { t: 0, d: 2.3, mv: "orbit", in: "cut", until: T(63.9) });
  te("తిన్న ఆహారం <b>digest</b> అవ్వడానికి", T(62.2), { until: T(63.8) });
  shot("A13", { t: T(63.9), d: 5, mv: "dive", a: .5, in: "zoom", until: T(68.9) });
  callout(W * .42, H * .5, -W * .16, -H * .2, "PARIETAL CELLS", T(64.9), { until: T(68.8) });
  fizz({ t: T(66.0), dens: [[0, .3], [T(67.4), 1]], until: T(68.8) });
  head("HYDROCHLORIC <b>ACID</b>", T(66.7), { y: H * .7, size: 6.4, until: T(68.8) });
  tag("HCl", T(67.4), { x: W * .06, y: H * .86, until: T(68.8) });
  const b = shot("A14", { t: T(68.9), d: 14.3, mv: "drift", in: "melt" });
  head("VERY <b>STRONG</b>", T(69.8), { y: H * .12, until: T(71.2) });
  tl.to(b, { opacity: .3, duration: .6 }, T(71.2));
  tag("pH", T(71.6), { y: H * .1, size: 3 });
  phScale(W * .08, H * .42, W * .84, T(71.4), { band: [1.5, 3.5, "STOMACH ACID 1.5 – 3.5"], bandAt: T(74.8),
    marks: [[1.5, T(72.7), "1.5"], [3.5, T(73.9), "3.5"], [7, T(76.8), "WATER 7"], [0, T(80.2), "LOWER = STRONGER"]] });
  head("pH = HOW <b>STRONG</b> THE ACID IS", T(76.0), { y: H * .14, size: 4.6 });
  te("number <b>తక్కువ</b> = acid <b>strong</b>", T(80.4), { y: H * .8 });
  AC.done();
</script>
</body></html>
