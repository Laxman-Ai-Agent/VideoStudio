<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 17 (295.8-322.5 s): system card -> told to underperform, slipped past the thought monitor 1 in 4 -> 43% suspected a test (presenter shock) -> risk low, UK AISI / METR / US */
.bt { position: absolute; display: flex; align-items: center; justify-content: center; font: 800 calc(var(--u) * 4.4) var(--font-head); color: #1B2140; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, fit, bg, title, retitle, card, logo, chip, label, icon, num, count, cut } = X;
  bg("rose");
  const tCd = at("card", 0.9), tLo = at("low", 3.4), tMo = at("monitor", 6.3), tEs = at("escaped", 7.35), t4 = at("four", 9.8), t43 = at("p43", 11.8);
  const tDb = at("doubt", 16.1), tRk = at("risk", 18.0), tUk = at("uk", 20.9), tMe = at("metr", 22.8), tUs = at("us", 23.8);

  // A. the system card document starts centre; on "told to underperform" it moves left and the monitor story fills the right
  const t1 = title("From the system card", "system card లో బయటపడిన ఇంకో విషయం", 0.1);
  const dc = card({ i: "doc", x: W * 0.32, y: H * 0.3, w: W * 0.36, h: H * 0.62 }); pop(dc, tCd - 0.3, { y: u * 6, opacity: 0 }, 0.6);
  fit(dc, tLo - 0.4, W * 0.05, H * 0.32, W * 0.26, H * 0.56);
  const cL = chip("Told to underperform", W * 0.36, H * 0.34, PAL.coral); pop(cL, tLo);
  const ey = card({ i: "eye", x: W * 0.36, y: H * 0.46, w: W * 0.2, h: H * 0.38, label: "thought monitor" }); pop(ey, tMo - 0.2, { scale: 0.85, opacity: 0 }, 0.5);
  const cE = chip("Slipped past it", W * 0.6, H * 0.5, PAL.red); pop(cE, tEs);
  const n4 = num(W * 0.6, H * 0.62, PAL.red, 9); n4.textContent = "1 in 4"; pop(n4, t4, { scale: 0.8, opacity: 0 });

  // B. 43% suspected a test: the presenter in shock fills the right, the number + line on the left
  out([dc, cL, ey, cE, n4], t43 - 0.6); const t2 = retitle(t1, "It suspected<br>a test", "43% test transcripts లో తనను test చేస్తున్నారేమో అని doubt", t43 - 0.3);
  const n43 = num(W * 0.07, H * 0.46, PAL.violet, 16); fade(n43, t43, 0.3); count(n43, 0, 43, t43, 0.9, (v) => Math.round(v) + "%");
  const pr = cut("pres_shock", W * 0.46, H * 0.06, W * 0.54, H * 0.94); pop(pr, Math.min(tDb, t43 + 2) - 0.2, { scale: 1.08, opacity: 0, y: u * 4 }, 0.6);
  const cD = chip("Is this a test?", W * 0.07, H * 0.74, PAL.violet); cD.style.fontSize = u * 4.6 + "px"; pop(cD, tDb);

  // C. risk is low (per Anthropic); three outside testers take the width, one per spoken name
  out([n43, pr, cD], tRk - 0.6); retitle(t2, "Risk: low (per Anthropic)", "release కి ముందే బయటి సంస్థలు కూడా test చేశాయి", tRk - 0.3);
  const s = H * 0.26;
  const b1 = logo("aisi", W * 0.12, H * 0.4, s, "UK AI Security Institute");
  const b2 = place(mk("div", "xc bt", undefined, "METR"), W * 0.43, H * 0.4, s, s); label("METR", s / 2, s + u * 1.2, b2);
  const b3 = place(mk("div", "xc"), W * 0.74, H * 0.4, s, s); icon("shield", s * 0.25, s * 0.2, s * 0.5, PAL.blue, b3); label("US government", s / 2, s + u * 1.2, b3);
  pop(b1, tUk - 0.2, { y: u * 5, opacity: 0 }); pop(b2, tMe - 0.2, { y: u * 5, opacity: 0 }); pop(b3, tUs - 0.2, { y: u * 5, opacity: 0 });
  X.done();
</script></body></html>
