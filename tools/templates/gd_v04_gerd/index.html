<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_v04_gerd: V04 chest burn, sour water in the throat = GERD; weight, smoking, alcohol, big meals, lying down right after food make it worse */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 37.2);
  shot("B10", { t: 0, d: 4.4, mv: "push", in: "burn", fy: .45, until: T(41.6) });
  heat(W * .5, H * .45, u * 24, T(37.8), { d: 3, until: T(41.5) });
  list([["ఛాతీలో <b>మంట</b>", T(37.8), false], ["<b>పుల్లటి నీళ్లు</b>", T(39.6), false]], W * .07, H * .66, { until: T(41.5) });
  shot("B06", { t: T(41.6), d: 2.6, mv: "dive", a: .5, in: "melt", until: T(44.2) });
  num(0, 0, T(42.2), { y: H * .62, align: "center", size: 26, fmt: () => "GERD", c: K.fl, until: T(44.1) });
  fizz({ t: T(44.2), dens: [[0, .3]] });
  head("WHAT MAKES IT <b>WORSE</b>", T(44.2), { y: H * .05, size: 5.4 });
  const g = [["A24", T(44.2), "WEIGHT"], ["B09", T(45.2), "SMOKING · ALCOHOL"], ["A30", T(46.8), "BIG MEALS"], ["B05", T(48.3), "LYING DOWN"]];
  g.forEach(([k, t0, f], i) => shot(k, { t: t0, d: 7, mv: "push", a: .6, in: "rise", box: [W * (.05 + (i % 2) * .46), H * (.14 + Math.floor(i / 2) * .4), W * .44, H * .37], fr: true, fig: f, no: i + 1, c: i ? K.fl : K.acid }));
  AC.done();
</script>
</body></html>
