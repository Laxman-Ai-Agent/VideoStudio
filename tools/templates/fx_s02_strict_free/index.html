<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 02 (16-31 s): Fable strict rules vs Mythos more freedom -> it fooled the experts (presenter shock) */
.vs { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; background: #1B2140; color: #fff; font: 800 calc(var(--u) * 4) var(--font-head); }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, move, bg, title, retitle, chip, label, icon, num, vcard, cut } = X;
  bg("peach");
  const tF = at("fable", 0.45), tS = at("strict", 1.6), tM = at("mythos", 2.8), tR = at("freedom", 4.3), tX = at("smart", 8.0), tE = at("experts", 10.3), tO = at("fooled", 11.8);

  // A. Fable card starts centre, gets a lock + STRICT; on "Mythos" it slides left and Mythos (unlocked, MORE FREEDOM) fills the right
  const t1 = title("Strict rules vs more freedom", "Fable కి strict rules, Mythos కి ఎక్కువ freedom", 0.1);
  const cw = W * 0.26, ch = H * 0.46, cy = H * 0.34;
  const f = vcard("fab", W / 2 - cw / 2, cy, cw, ch, "strict rules"); pop(f, tF, { y: u * 6, opacity: 0, scale: 0.92 }, 0.6);
  const lk = icon("lock", W / 2 + cw / 2 - u * 4, cy - u * 4, u * 8, PAL.fab); pop(lk, tS, { scale: 0.3, opacity: 0, rotation: -15 }, 0.5, E.pop);
  move(f, tM - 0.3, W * 0.1, cy); move(lk, tM - 0.3, W * 0.1 + cw - u * 4, cy - u * 4);
  const cS = chip("Strict rules", W * 0.1, cy + ch + u * 2.5, PAL.fab); pop(cS, tM);
  const m = vcard("myt", W * 0.64, cy, cw, ch, "more freedom"); pop(m, tM, { x: u * 8, opacity: 0, scale: 0.92 }, 0.6);
  const ul = icon("unlock", W * 0.64 + cw - u * 4, cy - u * 4, u * 8, PAL.myt); pop(ul, tR, { scale: 0.3, opacity: 0, rotation: 15 }, 0.5, E.pop);
  const cR = chip("More freedom", W * 0.64, cy + ch + u * 2.5, PAL.myt); pop(cR, tR + 0.2);
  const vs = place(mk("div", "vs", undefined, "vs"), W / 2 - u * 5, cy + ch / 2 - u * 5, u * 10, u * 10); pop(vs, tR + 0.5, { scale: 0.4, opacity: 0 }, 0.5, E.pop);

  // B. lavender: smarter than its testers -- presenter shock fills the right, the experts and the slam line stack on the left
  bg("lavender", tX - 0.5);
  out([f, m, lk, ul, cS, cR, vs, t1], tX - 0.6);
  title("Smarter than<br>its testers?", "test చేస్తున్న experts ని కూడా తప్పుదోవ పట్టించింది", tX - 0.3);
  const pr = cut("pres_shock", W * 0.46, H * 0.06, W * 0.54, H * 0.94); pop(pr, tX - 0.1, { scale: 1.08, opacity: 0, y: u * 4 }, 0.6);
  [0, 1, 2].forEach((i) => { const p = icon("user", W * (0.07 + i * 0.07), H * 0.46, u * 8, PAL.ink); pop(p, tE + i * 0.1, { y: u * 3, opacity: 0 }); });
  const lE = chip("Experts testing it", W * 0.07, H * 0.6, PAL.ink); pop(lE, tE + 0.3);
  const n = num(W * 0.07, H * 0.72, PAL.coral, 7); n.textContent = "It fooled them"; pop(n, tO, { scale: 1.2, opacity: 0 }, 0.4);
  X.done();
</script></body></html>
