<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_l15_good: L15 good news: WHO 70% seizure-free on medicines, cheap; surgery, VNS device, ketogenic diet */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 203.5);
  shot("E41", { t: 0, d: 6, mv: "push", in: "flash", until: T(208.9) });
  hud("GOOD NEWS", T(203.7), { c: K.am, until: T(208.9) });
  head("<b>GOOD</b> NEWS", T(204.2), { y: H * .14, c: K.am, size: 8, until: T(208.9) });
  te("WHO: సరైన <b>మందులు</b> వాడితే", T(205.5), { y: H * .7, c: K.am, until: T(208.9) });
  dots(100, 70, 10, [W * .54, H * .1, W * .38, H * .62], T(208.4), { c: K.am, lag: .6, until: T(212.0) });
  num(0, 70, T(209.0), { x: W * .05, y: H * .22, unit: "%", c: K.am, size: 20, until: T(212.0) });
  te("<b>seizures</b> లేకుండా జీవించొచ్చు", T(210.3), { x: W * .05, y: H * .56, c: K.am, until: T(212.0) });
  shot("E42", { t: T(212.1), d: 3, mv: "panR", in: "scan", until: T(215.2) });
  head("LOW <b>COST</b>", T(213.5), { y: H * .58, c: K.am, size: 8, until: T(215.2) });
  const O = [["E43", "SURGERY", 217.0], ["VNS", "VNS DEVICE", 217.8], ["E45", "KETOGENIC DIET", 221.1]];
  hud("NOT CONTROLLED BY PILLS? OPTIONS", T(215.2), { c: K.cy });
  O.forEach(([k, lab, t], i) => k === "VNS" ? doc(`<div style="font-size:${u * 2.1}px;line-height:1.45"><h3 style="font-size:${u * 3}px">VNS</h3><div style="opacity:.6">Vagus Nerve Stimulation</div><div class="rule"></div>A small device placed under the skin<br>of the chest. A thin wire sends gentle<br>pulses to the vagus nerve in the neck.<br><br><b>For:</b> seizures not controlled<br>by medicines.</div>`, W * (.04 + i * .32), H * .2, W * .28, H * .5, T(t)) : shot(k, { t: T(t), d: 3, mv: "push", in: "lift", box: [W * (.04 + i * .32), H * .2, W * .28, H * .5], glass: true, cap: lab }));
  te("doctor <b>పర్యవేక్షణలో</b>", T(220.2), { y: H * .78, align: "center" });
  SK.done();
</script>
</body></html>
