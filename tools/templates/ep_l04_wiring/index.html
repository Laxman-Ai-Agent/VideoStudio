<style>/* 14_Epilepsy ep_l04_wiring: L04 wiring analogy: current in order -> fan, light; high voltage -> chaos; seizure = brain storm */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 58.6);
  shot("E10", { t: 0, d: 5, mv: "panR", in: "fade", until: T(63.4) });
  eeg(T(58.8), { box: [0, H * .44, W, H * .1], d: 4.6, c: K.am, until: T(63.4) });
  hud("CURRENT · IN ORDER", T(59.3), { c: K.am, until: T(63.4) });
  te("<b>fan</b>, <b>light</b> అన్నీ బాగా పనిచేస్తాయి", T(61.2), { y: H * .7, c: K.am, until: T(63.4) });
  shot("E11", { t: T(63.5), d: 3.5, mv: "dive", a: .6, in: "cut", until: T(67.5) });
  flash(T(64.6), .4, "#ffd7ea");
  head("HIGH <b>VOLTAGE</b>", T(64.6), { y: H * .14, c: K.mg, size: 9, until: T(67.5) });
  bolt(W * .1, H * .3, W * .5, H * .6, T(64.8)); bolt(W * .9, H * .2, W * .6, H * .7, T(65.9)); bolt(W * .3, H * .9, W * .7, H * .4, T(66.7));
  te("అన్నీ ఒకేసారి <b>అదుపు తప్పుతాయి</b>", T(65.8), { y: H * .7, c: K.mg, until: T(67.5) });
  net({ n: 110, t: T(67.5), storm: [[T(69.4), D]], alpha: 1 });
  const s = shot("E12", { t: T(67.6), d: 7, mv: "orbit", a: .7, in: "through", box: [W * .18, H * .06, W * .64, H * .7], glass: true, cap: "BRAIN · ELECTRICAL STORM", c: K.mg });
  hud("THIS IS MOORCHHA", T(68.0), { c: K.mg });
  eeg(T(69.4), { box: [0, H * .78, W, H * .12], d: 3, spike: [[.4, 3]], c: K.cy, z: 18 });
  head("<b>SEIZURE</b>", T(73.8), { y: H * .32, align: "center", c: K.mg, size: 13, });
  tl.to(s, { opacity: .35, duration: .4 }, T(73.6));
  SK.done();
</script>
