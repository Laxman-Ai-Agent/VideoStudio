<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_l10_triggers: L10 triggers: no sleep, stress, alcohol, missed pills, flashing lights (fast montage) */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 144.4);
  net({ n: 60, alpha: .35, storm: [[T(149.5), D]] });
  hud("TRIGGERS", .05, { c: K.mg });
  const L = [["E28", "NO SLEEP", 144.6], ["E29", "STRESS", 146.2], ["E30", "ALCOHOL", 146.9], ["E31", "MISSED PILLS", 147.8], ["E32", "FLASHING LIGHTS", 149.4]];
  L.forEach(([k, lab, t], i) => { const x = W * (.03 + i * .192);
    shot(k, { t: T(t), d: 4, mv: i % 2 ? "rise" : "sink", in: "lift", rot: i % 2 ? 3 : -3, box: [x, H * .16, W * .18, H * .56], glass: true, cap: lab, c: i === 4 ? K.mg : K.cy, fx: .5 });
    num(i + 1, i + 1, T(t), { x: x + u, y: H * .16 + u, size: 4, c: K.mg, fmt: (v) => "0" + Math.round(v), d: .1 }); });
  flash(T(149.6), .25, "#ffffff"); flash(T(150.1), .25, "#ffd7ea"); flash(T(150.6), .25, "#ffffff");
  head("SEIZURE <b>TRIGGER</b>", T(150.5), { y: H * .78, align: "center", c: K.mg, size: 6 });
  SK.done();
</script>
</body></html>
