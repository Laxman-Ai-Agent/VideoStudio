<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l11_crispr: L11 Sweden AI mammography +29% cancers found; Casgevy CRISPR for sickle cell, FDA 2023 */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tSw = at("sweden", .1), tP = at("p29", 4.2), tCr = at("crispr", 6.8), tSi = at("sickle", 9.6), tFd = at("fda", 11.4);
  paper();
  photo("A19", { t: 0, d: tCr + .5, mv: "push", a: .6, in: "split", box: [W * .44, 0, W * .56, H], until: tCr + .2 });
  kick("SWEDEN · 100,000+ WOMEN", .2, { y: H * .14, until: tCr });
  chip("AI-SUPPORTED MAMMOGRAPHY", W * .06, H * .22, .6, { c: K.vio, size: 2.2, until: tCr });
  count(0, 29, tP - .6, { y: H * .32, size: 22, pre: "+", unit: "%", c: K.red, d: 1.3, until: tCr });
  tel("ఎక్కువ breast cancers దొరికాయి", tP + .3, { y: H * .58, size: 3.4, until: tCr });
  photo("A20", { t: tCr - .2, d: D - tCr + .5, mv: "drift", a: .8, in: "iris", fx: .6 });
  wash(tCr, null, { bg: `linear-gradient(90deg, ${K.bg}f5 35%, ${K.bg}00 75%)` });
  kick("CRISPR · DNA EDITING", tCr, { y: H * .14, c: K.green });
  card("Casgevy", "SICKLE CELL DISEASE", W * .06, H * .21, tCr + .4, { c: K.green });
  lens("A20", W * .76, H * .4, H * .2, tSi - .2, { z: 3.2, fx: .55, fy: .5 });
  chip("1 GENE EDIT → HEALTHY BLOOD CELLS", W * .06, H * .44, tSi, { c: K.red, size: 2.2 });
  stamp("FDA APPROVED · 2023", W * .2, H * .64, tFd, { c: K.green, size: 3.6, rot: -4 });
  AT.done();
</script>
</body></html>
