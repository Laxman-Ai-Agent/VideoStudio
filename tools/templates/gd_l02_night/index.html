<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_l02_night: L02 night after dinner: burning in the chest, sour water, gas tablet or heart fear */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 34.2);
  drench(0, { part: "out" });
  shot("A07", { t: 0, d: 1.1, mv: "panR", in: "cut", until: T(35.2) });
  tag("10:30 PM · HEAVY DINNER", .2, { until: T(35.2) });
  shot("A08", { t: T(35.2), d: 2.9, mv: "sink", in: "melt", until: T(38.1) });
  heat(W * .46, H * .5, u * 16, T(36.0), { d: 2, until: T(38.0) });
  head("<b>BURNING</b> IN THE CHEST", T(36.4), { y: H * .14, c: K.fl, until: T(38.0) });
  shot("A09", { t: T(38.1), d: 2.8, mv: "push", in: "burn", fy: .4, fx: .5, until: T(40.9) });
  callout(W * .5, H * .55, W * .14, -H * .18, "SOUR WATER", T(38.8), { c: K.acid, until: T(40.8) });
  te("గొంతులోకి <b>పుల్లటి నీళ్లు</b>", T(39.0), { until: T(40.8) });
  fizz({ t: T(40.9), dens: [[0, .4]] });
  head("GAS... OR <b>HEART</b>?", T(41.0), { y: H * .82, align: "center", size: 6 });
  shot("A10", { t: T(41.7), d: 6, mv: "push", in: "wipe", box: [W * .04, H * .1, W * .44, H * .66], fr: true, fig: "GAS TABLET?", no: "1" });
  te("<b>gas problem</b> అనుకొని tablet", T(42.4), { x: W * .06, y: H * .02, size: 3.2 });
  shot("A11", { t: T(45.0), d: 3, mv: "push", in: "wipeL", box: [W * .52, H * .1, W * .44, H * .66], fr: true, fig: "HEART PROBLEM?", no: "2", c: K.fl });
  ring(W * .74, H * .43, T(46.0), { c: K.fl, r: u * 14 });
  AC.done();
</script>
</body></html>
