<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l07_ai: L07 AI enters: OpenAI x Retro, GPT-4b micro, 2 factors redesigned, ~50x in lab bars, not verified */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tOa = at("openai", 1.9), tGp = at("gpt", 5.2), tRd = at("redesign", 8.4), tLb = at("lab", 11.8), tFi = at("fifty", 13.2), tCh = at("check", 16.6);
  paper();
  photo("A13", { t: 0, d: tRd + .5, mv: "drift", a: .8, in: "zoom", until: tRd + .2 });
  wash(0, tRd, { bg: "linear-gradient(0deg, #1a1550e0, #1a155040 60%, #1a155080)" });
  kick("ENTER", .1, { y: H * .12, c: "#C9C1FF", shadow: 1, until: tRd });
  head("Then <em>AI</em> walked in", .2, { y: H * .18, size: 8, col: "#fff", c: "#C9C1FF", shadow: 1, until: tGp - .2 });
  chip("OPENAI", W * .2, H * .42, tOa, { c: "#111", size: 3, until: tRd });
  head("×", tOa + .3, { x: W * .43, y: H * .38, size: 8, col: "#fff", until: tRd });
  chip("RETRO BIOSCIENCES", W * .5, H * .42, tOa + .5, { c: K.vio, size: 3, until: tRd });
  head("GPT-4b <em>micro</em>", tGp, { y: H * .56, size: 10, col: "#fff", c: "#C9C1FF", shadow: 1, until: tRd });
  photo("alphafold", { t: tRd - .2, d: tLb - tRd + 1, mv: "orbit", a: .5, in: "fade", box: [W * .5, H * .12, W * .44, H * .6], fit: true, blend: 1, until: tLb });
  kick("YAMANAKA FACTORS", tRd, { y: H * .16, c: K.ink, until: tLb - .1 });
  ["OCT4", "SOX2", "KLF4", "MYC"].forEach((g, i) => { const c = chip(g, W * (.06 + i * .1), H * .26, tRd + .1 + i * .1, { c: K.mute, size: 2.4, until: tLb - .1 });
    if (i === 1 || i === 2) tl.to(c, { backgroundColor: K.vio, scale: 1.15, duration: .4, ease: E.pop }, tRd + 1.2 + i * .2); });
  head("2 of them <em>redesigned</em>", tRd + 1, { y: H * .38, size: 6.8, c: K.vio, until: tLb - .1 });
  tel("AI తో protein లను మళ్లీ design", tRd + 1.6, { y: H * .55, size: 3.4, until: tLb - .1 });
  photo("A14", { t: tLb - .2, d: D - tLb + .5, mv: "push", a: .5, in: "fade" });
  wash(tLb, null, { bg: `linear-gradient(90deg, ${K.bg}f5 40%, ${K.bg}c0)` });
  kick("COMPANY'S OWN LAB TESTS", tLb, { y: H * .12, c: K.vio });
  bars([.04, 1], ["ORIGINAL", "AI-DESIGNED"], tLb + .3, { box: [W * .52, H * .2, W * .4, H * .5], cs: [K.mute, K.vio], stag: .6 });
  count(1, 50, tFi - .3, { y: H * .25, size: 26, c: K.vio, pre: "~", unit: "× BETTER", d: 1.4 });
  stamp("NOT YET VERIFIED", W * .3, H * .66, tCh, { c: K.gold, size: 4 });
  AT.done();
</script>
</body></html>
