<style>/* 18 Acidity_GERD gd_l10_habits: L10 lying down within 3 hours of a meal, one huge meal, painkillers */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 164.5);
  const a = shot("A29", { t: 0, d: 3.2, mv: "panR", in: "burn", fx: .4, until: T(167.7) });
  clock3(W * .8, H * .34, u * 12, T(165.5), { t2: T(165.8), h0: 9, h1: 12, label: "< 3 HOURS", c: K.fl, until: T(167.6) });
  te("భోజనం చేసిన <b>మూడు గంటల్లోపే</b> పడుకోవడం", T(166.1), { until: T(167.6) });
  shot("A30", { t: T(167.7), d: 4.1, mv: "dive", a: .45, in: "melt", until: T(171.8) });
  tract(W * .62, H * .14, W * .3, H * .66, T(168.4), { acid: [[0, .4], [T(169.3), .9]], les: [[0, 0], [T(169.8), .5]], reflux: [[0, 0], [T(170.1), 0], [T(171.0), .55]], until: T(171.7) });
  head("ONE <b>HUGE</b> MEAL", T(168.2), { x: W * .06, y: H * .14, c: K.fl, until: T(171.7) });
  tag("PRESSURE ON THE DOOR", T(169.6), { x: W * .06, y: H * .3, until: T(171.7) });
  shot("A31", { t: T(171.8), d: 4.2, mv: "orbit", in: "split" });
  head("<b>PAINKILLERS</b> TOO", T(172.0), { y: H * .12, c: K.fl });
  te("కొన్ని <b>మందులు</b> కూడా", T(172.9), { y: H * .8 });
  AC.done();
</script>
