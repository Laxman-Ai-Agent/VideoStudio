<style>/* 10 Cyclone_Akwan ck_l12_name: L12 the name Akwan came from Iran: a demon in the Persian Shahnameh; 13 countries list names in order; name has nothing to do with strength */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 163.0);
  atmo();
  head("WHO <b>NAMED</b> IT?", .2, { y: H * .12, size: 8, until: T(166.7) });
  const m = bay([W * .38, H * .1, W * .58, H * .8], T(164.0), { view: [40, 5, 95, 40], states: false, until: T(166.7) });
  m.pin(53.7, 32.4, "IRAN", T(165.4), { c: K.yl, s: 1.3 });
  m.pin(80, 16, "AKWAN", T(165.8), { c: K.red, s: 1.3 });
  shot("A16", { t: T(166.8), d: 6.4, mv: "push", in: "iris", box: [W * .5, H * .08, W * .46, H * .84], fr: true, tint: false, sat: "SHAHNAMEH · ILLUSTRATION", c: K.or, until: T(177.1) });
  tag("PERSIAN EPIC", T(167.0), { y: H * .14, c: K.or, until: T(173.2) });
  head("AKVAN · THE <b>DEMON</b>", T(169.3), { y: H * .3, size: 6.6, c: K.or, until: T(177.1) });
  te("పేరు వినడానికి <b>భయంకరం</b> కదా?", T(171.3), { y: H * .5, until: T(177.1) });
  te("కానీ తుఫాను కూడా అలాగే <b>ఉంటుందా</b>?", T(173.4), { y: H * .64, c: K.yl, until: T(177.1) });
  num(0, 13, T(177.3), { x: W * .06, y: H * .18, unit: "COUNTRIES", d: 1.2, until: T(184.1) });
  wheel(["BANGLADESH", "INDIA", "IRAN", "MALDIVES", "MYANMAR", "OMAN", "PAKISTAN", "QATAR", "SAUDI ARABIA", "SRI LANKA", "THAILAND", "UAE", "YEMEN"], 2,
        W * .56, H * .12, W * .38, H * .74, T(178.6), T(183.0), { until: T(184.1) });
  tag("CYCLONE NAMES LIST · IN ORDER", T(180.2), { x: W * .06, y: H * .5, until: T(184.1) });
  te("List లోని <b>order</b> ప్రకారం పేర్లు", T(182.0), { y: H * .64, until: T(184.1) });
  shot("A02", { t: T(184.2), d: 4, mv: "push", in: "cut" });
  head("NAME ≠ <b>STRENGTH</b>", T(184.5), { y: H * .4, align: "center", size: 11 });
  te("పేరుకి, తీవ్రతకి <b>సంబంధం లేదు</b>", T(185.8), { y: H * .64, align: "center" });
  cloudwipe(D, { part: "in" });
  CK.done();
</script>
</body></html>
