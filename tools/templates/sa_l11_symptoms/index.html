<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l11_symptoms: L11 symptoms: loud snoring, choking, pauses (partner notices first); morning headache, daytime sleepiness despite 7-8 h, poor focus, irritability; night urination; only a sleep problem? */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 219.45);
  const v = shot("A30", { t: 0, d: 7, mv: "panL", a: .6, in: "cut", box: [0, 0, W * .56, H], until: T(229.5) });
  list([["గట్టిగా గురక", T(219.8), null], ["నిద్రలో ఉక్కిరిబిక్కిరి", T(221.8), null], ["మధ్యలో శ్వాస ఆగడం", T(223.5), false]], W * .6, H * .1, { size: 3, until: T(226.0) });
  phone(`<div style="padding:${u * 2.2}px ${u * 1.6}px;font-size:${u * 2.3}px">
    <div style="font-size:${u * 1.9}px;color:${K.mute};letter-spacing:.15em">VOICE RECORDER</div>
    <div style="font-size:${u * 3.2}px;font-weight:600;margin:${u * .6}px 0 ${u * 1.4}px">Snoring · 3:12 AM</div>
    <div style="display:flex;gap:${u * .25}px;align-items:center;height:${u * 10}px">${Array.from({ length: 30 }, (_, i) => `<i style="flex:1;border-radius:${u}px;background:${i > 12 && i < 20 ? K.co : K.mint};height:${i > 12 && i < 20 ? 6 : 20 + 70 * Math.abs(Math.sin(i * 1.7))}%"></i>`).join("")}</div>
    <div style="display:flex;justify-content:space-between;color:${K.mute};font-size:${u * 1.7}px;margin-top:${u * .4}px"><span>0:00</span><span>1:20</span></div>
    <div style="font-size:${u * 2.3}px;margin-top:${u * 1.6}px;padding:${u}px;border-radius:${u}px;background:#FF5A6E22;border-left:${u * .3}px solid ${K.co}">Breathing stopped<br><b>0:42 - 0:53</b> · 11 sec</div>
    <div style="font-size:${u * 2}px;margin-top:${u}px;color:${K.mute}">Show this to the doctor</div>
    <div style="margin-top:${u * 2.4}px;font-size:${u * 1.9}px;color:${K.mute};letter-spacing:.15em">LAST NIGHT</div>
    ${[["Recorded", "11:40 PM - 5:50 AM"], ["Snoring", "4 h 10 min"], ["Silent pauses", "38"], ["Longest pause", "24 sec"]].map(([a, b], i) => `<div style="display:flex;justify-content:space-between;font-size:${u * 2.1}px;padding:${u * .9}px 0;border-bottom:1px solid #ffffff18"><span>${a}</span><b style="color:${i > 1 ? K.co : K.txt}">${b}</b></div>`).join("")}</div>`, W * .64, H * .06, H * .86, T(226.2), { rot: -4, until: T(229.5) });
  head("THE PARTNER <b>NOTICES FIRST</b>", T(226.4), { x: W * .04, y: H * .76, size: 4.6, until: T(229.4) });
  shot("A31", { t: T(229.5), d: 3, mv: "push", in: "wipe", until: T(232.5) });
  tag("MORNING HEADACHE", T(230.8), { y: H * .1, until: T(232.4) });
  shot("A09", { t: T(232.5), d: 3.6, mv: "push", in: "slide", until: T(236.0) });
  num(0, 8, T(232.6), { x: W * .62, y: H * .14, unit: "hrs slept", d: .9, c: K.moon, until: T(235.9) });
  head("STILL <b>SLEEPY</b> ALL DAY", T(234.2), { x: W * .06, y: H * .74, size: 5.2, until: T(235.9) });
  shot("A32", { t: T(236.0), d: 1.6, mv: "push", in: "slide", dir: -1, box: [0, 0, W * .5, H], until: T(240.1) });
  shot("A33", { t: T(237.4), d: 2.8, mv: "push", in: "slide", box: [W * .5, 0, W * .5, H], until: T(240.1) });
  tag("CAN'T FOCUS", T(236.3), { x: W * .04, y: H * .1, until: T(240.0) });
  tag("IRRITABLE", T(237.6), { x: W * .54, y: H * .1, c: K.co, until: T(240.0) });
  shot("A34", { t: T(240.1), d: 9, mv: "push", a: .6, in: "blink" });
  clock(W * .84, H * .26, u * 9, T(240.6), { h0: 1, h1: 4.5, d: 3.4 });
  te("రాత్రి <b>మూత్రం</b> కోసం పదే పదే", T(241.6), { y: H * .14, x: W * .06 });
  head("ONLY A <b>SLEEP</b> PROBLEM?", T(246.2), { y: H * .7, size: 6 });
  NW.done();
</script>
</body></html>
