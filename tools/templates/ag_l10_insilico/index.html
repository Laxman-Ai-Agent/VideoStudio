<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l10_insilico: L10 human proof: Insilico AI target + drug, IPF stiff lungs, 71 patients 12 weeks drug up vs placebo down, first step */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tIn = at("insilico", 4.7), tDr = at("drug", 8.1), tIp = at("ipf", 11.3), tLu = at("lungs", 12.8), tN = at("n71", 16.5), tUp = at("up", 21), tPl = at("placebo", 22.6), tSt = at("step", 24.7);
  paper();
  photo("A17", { t: 0, d: tIn + .5, mv: "push", a: .7, in: "fade", until: tIn + .2 });
  wash(0, tIn, { a: .92 });
  kick("BUT DOES IT WORK IN PEOPLE?", .2, { y: H * .2, until: tIn });
  head("Some <em>proof</em>", .4, { y: H * .26, size: 10, until: tIn });
  panel([0, 0, W * .5, H], tIn - .3, { side: "L", until: tIp });
  photo("A14", { t: tIn - .2, d: tIp - tIn + 1, mv: "push", a: .5, in: "wipe", dir: -1, box: [W * .5, 0, W * .5, H], until: tIp });
  card("Insilico Medicine", "AI DRUG DISCOVERY", W * .05, H * .14, tIn, { c: K.vio, until: tIp - .1 });
  const fl = [["AI", K.vio], ["NEW TARGET", K.ink], ["NEW DRUG", K.green]];
  fl.forEach(([s, c], i) => chip(s, W * (.06 + i * .14), H * .45, tIn + 1 + i * (tDr - tIn) / 3, { c, size: 2.3, until: tIp - .1 }));
  arrow(W * .13, H * .48, W * .19, H * .48, tIn + 1.6, { c: K.ink, until: tIp - .1 }); arrow(W * .315, H * .48, W * .335, H * .48, tDr - .4, { c: K.ink, until: tIp - .1 });
  tel("రెండూ <b>AI</b> తోనే", tDr, { y: H * .6, until: tIp - .1 });
  photo("A16", { t: tIp - .2, d: tN - tIp + 1, mv: "push", a: .8, in: "iris", until: tN });
  wash(tIp, tN - .1, { a: .9 });
  kick("IPF · IDIOPATHIC PULMONARY FIBROSIS", tIp, { y: H * .2, until: tN - .1 });
  head("Lungs turn <em>stiff</em>", tLu - .2, { y: H * .26, size: 9, until: tN - .1 });
  kick("TRIAL · 12 WEEKS", tN, { y: H * .12, c: K.ink, until: tSt - .1 });
  count(0, 71, tN, { y: H * .18, size: 15, unit: "PATIENTS", c: K.red, d: 1, until: tSt - .1 });
  const bx = [W * .46, H * .14, W * .46, H * .5];
  chart([[0, .5], [.3, .53], [.65, .57], [1, .62]], tUp - 1, { box: bx, c: K.green, d: 1.4, until: tSt - .1 });
  chart([[0, .5], [.3, .46], [.65, .42], [1, .36]], tPl - .5, { box: bx, c: K.red, d: 1.4, until: tSt - .1 });
  chip("DRUG ▲", W * .8, H * .2, tUp, { c: K.green, until: tSt - .1 }); chip("PLACEBO ▼", W * .78, H * .58, tPl, { c: K.red, until: tSt - .1 });
  tel("lungs capacity", tUp - .6, { y: H * .5, size: 3, until: tSt - .1 });
  photo("A18", { t: tSt - .2, mv: "push", a: .5, in: "blinds" });
  wash(tSt, null, { a: .9 });
  head("Small trial.<br><em>First step.</em>", tSt, { y: H * .24, size: 9 });
  AT.done();
</script>
</body></html>
