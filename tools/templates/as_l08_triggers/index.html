<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l08_triggers: L08 causes vs triggers, rapid trigger montage with a counter, aspirin / ibuprofen */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 143.0);
  const L = shot("A24", { t: 0, d: 6.8, mv: "push", in: "wipe", box: [W * .04, H * .14, W * .44, H * .56], glass: true, cap: "CAUSES", until: T(149.8) });
  const R = shot("A15", { t: T(147.4), d: 3, mv: "push", in: "wipeL", box: [W * .52, H * .14, W * .44, H * .56], glass: true, cap: "TRIGGERS", c: K.co, until: T(149.8) });
  te("<b>కారణాలు</b> ఒకవైపు", T(144.6), { x: W * .05, y: H * .76, until: T(149.7) });
  te("<b>Triggers</b> మరోవైపు", T(148.2), { x: W * .53, y: H * .76, c: K.co, until: T(149.7) });
  const seq = [["A31", 150.5, "DUST MITES", "push"], ["A32", 151.3, "MOULD", "pull"], ["A33", 152.0, "PET HAIR", "drift"], ["A34", 153.6, "POLLEN", "push"],
    ["A15", 154.3, "SMOKE", "rise"], ["A35", 155.0, "STRONG PERFUME", "pull"], ["A36", 156.3, "COLD AIR", "panR"], ["A37", 157.5, "EXERCISE", "push"],
    ["A38", 158.4, "A COLD", "drift"], ["A39", 159.2, "STRESS", "pull"], ["A40", 159.9, "WEATHER CHANGE", "panL"]];
  const ins = ["mist", "wipe", "iris", "slide", "wipeL", "rise"];
  seq.forEach(([k, t, c, mv], i) => { const t0 = i ? T(t) : T(149.8), t1 = i < seq.length - 1 ? T(seq[i + 1][1]) : T(161.4);
    const small = i % 3 === 2, box = small ? [W * .3, H * .1, W * .4, H * .62] : undefined;
    shot(k, { t: t0, d: t1 - t0 + .4, mv, a: 1.2, in: ins[i % ins.length], box, glass: small, until: t1 + .25 });
    tag(c, t0 + .1, { x: W * .05, y: H * .8, c: i % 2 ? K.hn : K.co, until: t1 }); });
  num(0, 11, T(150.3), { x: W * .76, y: H * .06, size: 9, unit: "TRIGGERS", c: K.co, d: 10, until: T(161.3) });
  flow({ n: 130, alpha: .75, band: .5, t: T(161.3), choke: [[T(161.4), T(163.2), .8]], until: T(163.1) });
  head("CAN START AN <b>ATTACK</b>", T(161.4), { y: H * .42, align: "center", size: 6.4, c: K.co, until: T(163) });
  shot("A41", { t: T(163.0), d: 5.7, mv: "push", a: .6, in: "mist" });
  tag("ASPIRIN", T(163.8), { x: W * .08, y: H * .3, c: K.hn });
  tag("IBUPROFEN", T(164.6), { x: W * .08, y: H * .4, c: K.hn });
  head("SOME <b>MEDICINES</b> TOO", T(165.6), { y: H * .7, size: 5.8, c: K.hn });
  BK.done();
</script>
</body></html>
