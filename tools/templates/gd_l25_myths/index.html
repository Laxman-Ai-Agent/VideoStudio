<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ac.js"></script><script src="ac2.js"></script>
<style>/* 18 Acidity_GERD gd_l25_myths: L25 myths: cold milk cures acidity (no strong proof, relief is temporary); soda / cold drinks (no proof, fizzy drinks can worsen it) */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 370.0);
  drench(0, { part: "out" });
  tag("MYTHS", .1, { y: H * .08, c: K.acid, until: T(372.4) });
  head("LET'S BUST <b>3 MYTHS</b>", T(370.4), { y: H * .4, align: "center", size: 7, until: T(372.4) });
  shot("A70", { t: T(372.5), d: 10.6, mv: "push", a: .6, in: "melt", box: [W * .52, H * .08, W * .44, H * .66], fr: true, fig: "COLD MILK", no: "25", c: K.por, until: T(383.1) });
  myth("చల్లటి పాలు = acidity <b>పూర్తిగా</b> తగ్గుతుంది", T(373.2), T(378.6), { x: W * .04, y: H * .28, until: T(383.1) });
  te("relief వచ్చినా <b>తాత్కాలికమే</b>", T(380.9), { x: W * .04, y: H * .6, until: T(383.1) });
  shot("A71", { t: T(383.2), d: 9.3, mv: "rise", in: "burn", box: [W * .52, H * .08, W * .44, H * .66], fr: true, fig: "SODA · COLD DRINKS", no: "26", c: K.fl });
  fizz({ t: T(383.4), box: [W * .52, H * .08, W * .44, H * .66], dens: [[0, .9]], n: 70, z: 30 });
  myth("soda తాగితే acidity <b>తగ్గుతుంది</b>", T(383.9), T(388.0), { x: W * .04, y: H * .28 });
  te("fizzy drinks <b>పెంచొచ్చు</b>", T(389.1), { x: W * .04, y: H * .6, c: K.fl });
  AC.done();
</script>
</body></html>
