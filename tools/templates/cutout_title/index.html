<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<style>
.grid { position: absolute; inset: 0; opacity: .07;
        background-image: linear-gradient(var(--text) 1px, transparent 1px), linear-gradient(90deg, var(--text) 1px, transparent 1px);
        background-size: calc(var(--u) * 6) calc(var(--u) * 6); }
#title { position: absolute; font-weight: 900; line-height: 1.02; }
#title .l2 { color: var(--accent); }
#kicker { font-weight: 600; opacity: .7; margin-top: calc(var(--u) * 1.5); font-size: calc(var(--u) * 3.6); line-height: 1.3; }
.landscape #title { left: var(--sl); top: 50%; transform: translateY(-50%); width: 52%; font-size: calc(var(--u) * 16); }
.portrait #title { left: var(--sl); right: var(--sr); top: var(--st); text-align: center; font-size: calc(var(--u) * 15); }
#cut { position: absolute; bottom: 0; transform-origin: 50% 100%;
       filter: drop-shadow(calc(var(--u) * .45) 0 0 #fff) drop-shadow(calc(var(--u) * -.45) 0 0 #fff)
               drop-shadow(0 calc(var(--u) * .45) 0 #fff) drop-shadow(0 calc(var(--u) * -.45) 0 #fff)
               drop-shadow(0 calc(var(--u) * 1.5) calc(var(--u) * 2) rgba(0,0,0,.35)); }
.landscape #cut { right: 8%; height: 88%; }
.portrait #cut { left: 50%; height: 58%; }
.br { position: absolute; width: calc(var(--u) * 5); height: calc(var(--u) * 5); border: 0 solid var(--text); opacity: .8; }
.br.a { left: var(--sl); top: var(--st); border-width: calc(var(--u) * .5) 0 0 calc(var(--u) * .5); }
.br.b { right: var(--sr); top: var(--st); border-width: calc(var(--u) * .5) calc(var(--u) * .5) 0 0; }
.br.c { left: var(--sl); bottom: var(--sb); border-width: 0 0 calc(var(--u) * .5) calc(var(--u) * .5); }
.br.d { right: var(--sr); bottom: var(--sb); border-width: 0 calc(var(--u) * .5) calc(var(--u) * .5) 0; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div class="grid"></div>
  <div id="title"><div class="l1"></div><div class="l2"></div><div id="kicker"></div></div>
  <img id="cut" src="cut.png">
  <div id="frame" style="display:none"><i class="br a"></i><i class="br b"></i><i class="br c"></i><i class="br d"></i></div>
  <div class="safe"></div>
</div>
<script>
  // Poster: subject cut out by rembg (prepare stage, params.cutout) with a white sticker outline,
  // over a big two-line title (line 2 in the accent colour). Title words come from params.title or the
  // on-screen text: first word on line 1, the rest on line 2.
  const S = window.SCENE, p = S.params || {}, tl = gsap.timeline({ paused: true }), d = S.duration;
  const words = String(p.title || S.text || "").split(/\s+/).filter(Boolean);
  const n1 = kinetic(document.querySelector("#title .l1"), words.slice(0, 1).join(" "), tl, 0.15, 0.12);
  kinetic(document.querySelector("#title .l2"), words.slice(1).join(" "), tl, 0.15 + n1 * 0.15, 0.12);
  document.getElementById("kicker").textContent = p.kicker || "";
  tl.fromTo("#kicker", { opacity: 0 }, { opacity: 0.7, duration: 0.3 }, 0.7);
  const cut = document.getElementById("cut");
  gsap.set(cut, { xPercent: S.h > S.w ? -50 : 0 });  // portrait: centred under the title
  tl.fromTo(cut, { yPercent: 18, opacity: 0, scale: 0.94 }, { yPercent: 0, opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 0.05);
  tl.to(cut, { scale: 1.04, duration: Math.max(0.1, d - 0.6), ease: "none" }, 0.6);
  if (p.frame) {
    document.getElementById("frame").style.display = "";
    tl.fromTo(".br", { opacity: 0, scale: 1.3 }, { opacity: 0.8, scale: 1, duration: 0.3, stagger: 0.05 }, 0.3);
  }
  finish(tl);
</script></body></html>
