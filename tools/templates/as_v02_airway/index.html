<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_v02_airway: V02 air through small tubes into the lungs; sensitive airways; dust, smoke, cold air; immune system overreacts */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 12.4);
  const lg = shot("B03", { t: 0, d: 5.6, mv: "drift", a: .6, in: "mist", until: T(18.1) });
  tree(W * .5, H * .2, H * .48, T(14.8), { d: 2, until: T(18.1) });
  te("చిన్న చిన్న <b>గొట్టాల</b> ద్వారా", T(15.0), { y: H * .76, align: "center", until: T(18) });
  airway(W * .5, H * .42, u * 26, T(18.0), { id: "v", until: T(22.2) });
  ring(W * .5, H * .42, T(20.8), { r: u * 42, n: 3, c: K.co });
  head("TOO", T(20.6), { y: H * .7, align: "center", size: 9, until: T(22.1) });
  head("<b>SENSITIVE</b>", T(20.9), { y: H * .77, align: "center", size: 10, c: K.co, until: T(22.1) });
  [["A14", 22.2, "DUST", .07], ["A15", 22.8, "SMOKE", .35], ["A36", 23.4, "COLD AIR", .63]].forEach(([k, t, c, y]) =>
    shot(k, { t: T(t), d: 3.4, mv: "push", in: "rise", box: [W * .06, H * y, W * .88, W * .88 * 9 / 16], glass: true, cap: c, c: K.hn, until: T(25.4) }));
  shot("A16", { t: T(25.3), d: 3, mv: "orbit", a: .8, in: "iris" });
  head("IMMUNE SYSTEM", T(25.8), { y: H * .12, align: "center", size: 7.4 });
  head("<b>OVERREACTS</b>", T(26.8), { y: H * .19, align: "center", size: 10, c: K.co });
  BK.done();
</script>
</body></html>
