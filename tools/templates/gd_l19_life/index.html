<style>/* 18 Acidity_GERD gd_l19_life: L19 lose weight, stop smoking, cut alcohol, no tight clothes at the waist; notice which food burns and cut it */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 277.4);
  const g = [["A53", T(278.1), "LOSE WEIGHT"], ["A54", T(279.1), "STOP SMOKING"], ["A27", T(280.3), "LESS ALCOHOL"], ["A52", T(281.7), "LOOSE WAIST"]];
  g.forEach(([k, t0, f], i) => shot(k, { t: t0, d: 7, mv: ["push", "panR", "rise", "push"][i], a: .6, in: ["melt", "wipe", "split", "zoom"][i],
    box: [W * (.04 + (i % 2) * .47), H * (.06 + Math.floor(i / 2) * .44), W * .45, H * .4], fr: true, fig: f, no: 18 + i, c: K.por, until: T(287.1) }));
  fizz({ t: T(287.2), dens: [[0, .3]] });
  doc(`<h3>My acidity food diary</h3><div style="color:#4e5f56">Write what you ate · burning 0–5</div><div class="rule"></div>
    <div>Mon · coffee 8 AM <span class="bad">burn 4</span></div><div>Mon · dal, rice, curd <span class="hl">burn 0</span></div>
    <div>Tue · samosa, chai <span class="bad">burn 3</span></div><div>Tue · fruit, idli <span class="hl">burn 0</span></div>
    <div>Wed · tomato curry late <span class="bad">burn 5</span></div><div style="margin-top:${u * .6}px;font-weight:700">Cut: coffee, late tomato curry</div>`,
    W * .06, H * .12, W * .42, H * .68, T(287.6));
  head("FIND <b>YOUR</b> TRIGGER", T(288.2), { x: W * .54, y: H * .3, size: 5 });
  te("మంట తెచ్చే ఆహారం <b>తగ్గించండి</b>", T(291.8), { x: W * .54, y: H * .46 });
  AC.done();
</script>
