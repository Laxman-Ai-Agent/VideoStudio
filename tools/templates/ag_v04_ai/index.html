<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_v04_ai: V04 AI: OpenAI x Retro GPT-4b micro, redesigned proteins ~50x (lab), needs verification, CRISPR + AI drugs */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tOa = at("openai", 2.6), tRd = at("redesign", 8.4), tFi = at("fifty", 13.4), tVe = at("verify", 17.2), tCr = at("crispr", 20.4);
  paper();
  photo("B05", { t: 0, d: tRd + .5, mv: "rise", a: .7, in: "zoom", until: tRd + .2 });
  wash(0, tRd, { bg: "linear-gradient(180deg, #1a1550e8, #1a155030 55%)" });
  head("Enter <em>AI</em>", .1, { y: H * .07, size: 12, col: "#fff", c: "#C9C1FF", shadow: 1, until: tRd });
  chip("OPENAI", W * .08, H * .22, tOa, { c: "#111", size: 4, until: tRd });
  chip("RETRO BIOSCIENCES", W * .3, H * .3, tOa + .5, { c: K.vio, size: 4, until: tRd });
  head("GPT-4b <em>micro</em>", tOa + 2, { y: H * .38, size: 11, col: "#fff", c: "#C9C1FF", shadow: 1, until: tRd });
  photo("alphafold", { t: tRd - .2, d: tVe - tRd + 1, mv: "orbit", a: .6, in: "fade", box: [W * .05, H * .3, W * .9, H * .34], fit: true, blend: 1, until: tVe + .3 });
  kick("PROTEINS REDESIGNED", tRd, { y: H * .08, c: K.vio, until: tVe + .2 });
  count(1, 50, tFi - .4, { y: H * .12, size: 30, pre: "~", unit: "×", c: K.vio, d: 1.4, until: tVe + .2 });
  stamp("NEEDS INDEPENDENT CHECK", W * .5, H * .68, tVe, { c: K.gold, size: 4.4, until: tCr - .1 });
  photo("A20", { t: tCr - .2, d: D - tCr + .5, mv: "push", a: .7, in: "iris" });
  wash(tCr, null, { bg: `linear-gradient(180deg, ${K.bg}f5 35%, ${K.bg}00 65%)` });
  chip("CRISPR GENE EDITING", W * .07, H * .1, tCr, { c: K.green, size: 4 });
  chip("AI-DESIGNED MEDICINES", W * .07, H * .18, tCr + 1, { c: K.vio, size: 4 });
  head("New <em>doors</em> open", tCr + 1.6, { y: H * .26, size: 9 });
  AT.done();
</script>
</body></html>
