<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sk.js"></script>
<style>/* 14_Epilepsy ep_l09_absence: L09 absence seizure mistaken for daydreaming; focal: one arm, strange smell or feeling */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 134.0);
  shot("F06", { t: 0, d: 4.8, mv: "pull", in: "cut", box: [W * .58, H * .06, H * .5, H * .86], glass: true, until: T(138.8) });
  head("<b>ABSENCE</b> SEIZURE", T(134.6), { y: H * .14, size: 7, c: K.am, until: T(138.8) });
  myth("పరధ్యానం అనుకోవడం", T(136.6), T(137.9), { x: W * .06, y: H * .58, stamp: "NOT DAYDREAM", until: T(138.8) });
  const a = shot("E26", { t: T(138.9), d: 3, mv: "panR", in: "slide", box: [W * .04, H * .08, W * .44, H * .66], glass: true, cap: "ONE ARM SHAKING", c: K.mg });
  eeg(T(139.9), { box: [W * .06, H * .4, W * .4, H * .14], d: 1.6, spike: [[.3, 1.4]], c: K.mg, z: 5 });
  const b = shot("E27", { t: T(141.2), d: 3, mv: "orbit", a: .6, in: "slide", dir: 1, box: [W * .52, H * .08, W * .44, H * .66], glass: true, cap: "STRANGE SMELL · FEELING", c: K.am });
  te("<b>వింత</b> వాసన", T(141.4), { x: W * .53, y: H * .78, c: K.am, size: 3.6 });
  te("<b>వింత</b> feeling", T(142.6), { x: W * .76, y: H * .78, c: K.am, size: 3.6 });
  head("FOCAL", T(139.4), { x: W * .06, y: H * .78, size: 4.4, c: K.mg });
  cam(T(139), 5, { scale: 1.04 });
  SK.done();
</script>
</body></html>
