<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l01_hook: L01 hook: old hands + 150 counter, cake split, AI + gene editing helix, old mouse plate + lens, decode */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const t150 = at("q150", 2.2), tSe = at("secret", 5.5), tAi = at("ai", 7.9), tGe = at("gene", 8.6), tMi = at("mice", 15.5), tSc = at("science", 21.5);
  paper();
  photo("A01", { t: 0, d: tSe, mv: "push", a: .8, in: "fade", shade: "left", until: tSe + .2 });
  kick("THE QUESTION", .3, { y: H * .2, c: "#fff", shadow: 1, until: tSe });
  head("Can a human live to", .5, { y: H * .27, size: 6.5, col: "#fff", shadow: 1, until: tSe });
  count(0, 150, t150 - .3, { y: H * .38, size: 24, col: "#fff", c: "#FFB199", unit: "YEARS", shadow: 1, d: 1.8, until: tSe });
  panel([0, 0, W * .46, H], tSe - .2, { side: "L", c: K.bg, until: tAi });
  photo("A02", { t: tSe - .1, d: tAi - tSe + 1, mv: "panL", a: .6, in: "wipe", dir: -1, box: [W * .46, 0, W * .54, H], until: tAi });
  kick("THE NUMBER", tSe + .1, { y: H * .26, until: tAi - .2 });
  head("The secret<br>behind <em>150</em>", tSe + .3, { y: H * .32, size: 8, until: tAi - .2 });
  photo("A04", { t: tAi - .2, d: tMi - tAi + 1, mv: "drift", in: "page", until: tMi });
  wash(tAi, tMi - .1, { bg: `linear-gradient(270deg, ${K.bg}f5 30%, ${K.bg}00 70%)` });
  helix([W * .8, H * .42, H * .62], tAi, { r: H * .09, n: 20, until: tMi - .1 });
  chip("AI", W * .62, H * .2, tAi + .1, { c: K.vio, size: 3.2, until: tMi - .1 });
  chip("GENE EDITING", W * .6, H * .66, tGe, { c: K.green, size: 2.6, until: tMi - .1 });
  head("Stop <em>aging</em>?", tGe + 1.2, { x: W * .05, y: H * .14, size: 9, until: tMi - .1 });
  photo("A03", { t: tMi - .2, d: tSc - tMi + 1, mv: "push", a: .5, in: "drop", box: [W * .06, H * .1, W * .5, H * .62], plate: true, fig: "FIG. 01 · AN OLD LAB MOUSE", rot: -2, until: tSc });
  lens("A03", W * .68, H * .36, H * .2, tMi + 1.4, { z: 3, fx: .52, fy: .38, until: tSc });
  head("Sight <em>back</em>?", tMi + 2.2, { x: W * .6, y: H * .62, size: 7.5, c: K.green, until: tSc });
  rings(W * .68, H * .36, tMi + 1.6, { r: H * .26, c: K.green });
  photo("A04", { t: tSc - .1, mv: "pull", a: .6, in: "iris", fx: .45, fy: .45 });
  wash(tSc, null, { bg: `radial-gradient(ellipse at 50% 50%, ${K.bg}f0 25%, ${K.bg}50 75%)` });
  kick("LET'S DECODE", tSc + .2, { align: "center", y: H * .36 });
  head("the real <em>science</em>", tSc + .4, { align: "center", y: H * .42, size: 10 });
  AT.done();
</script>
</body></html>
