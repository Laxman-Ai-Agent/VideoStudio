<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l13_heart: L13 the real danger: oxygen falls and the brain alarms every night -> strain on heart and vessels; high BP, heart disease, atrial fibrillation, stroke, type 2 diabetes */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 257.5);
  shot("A03", { t: 0, d: 2.7, mv: "push", in: "dim", until: T(260.2) });
  head("THE REAL <b>DANGER</b>", T(258.4), { y: H * .4, align: "center", size: 7.4, until: T(260.1) });
  shot("A14", { t: T(260.2), d: 5.4, mv: "drift", in: "dim", a: .5, until: T(265.6) });
  spo2(W * .06, H * .12, T(260.6), [[0, 96], [T(261.8), 96], [T(262.6), 85], [T(263.2), 95], [T(263.9), 84], [T(264.5), 95], [T(265.2), 83]], { until: T(265.5) });
  ring(W * .62, H * .45, T(263.3), { r: u * 16, n: 4 });
  tag("ALARM · ALARM · ALARM", T(264.3), { x: W * .55, y: H * .8, c: K.co, until: T(265.5) });
  shot("A35", { t: T(265.6), d: 3.1, mv: "push", in: "cut", box: [0, 0, W * .5, H], until: T(268.7) });
  shot("A36", { t: T(266.4), d: 2.3, mv: "panL", in: "wipeL", box: [W * .5, 0, W * .5, H], until: T(268.7) });
  head("HEART & <b>VESSELS</b> UNDER STRAIN", T(267.0), { y: H * .74, align: "center", size: 5, until: T(268.6) });
  const cw = W * .188;
  [["A37", 270.6, "HIGH BP"], ["A35", 271.4, "HEART DISEASE"], ["A38", 272.5, "ATRIAL FIBRILLATION"], ["A39", 276.5, "STROKE"], ["A40", 277.2, "TYPE 2 DIABETES"]].forEach(([k, t0, l], i) =>
    shot(k, { t: T(t0), d: 280 - t0, mv: "rise", a: .4, in: "open", box: [W * .02 + i * (cw + W * .008), H * .14, cw, H * .58], win: true, bar: l, c: K.co }));
  tag("IF IGNORED", T(268.9), { y: H * .05, c: K.co });
  te("గుండె కొట్టుకునే <b>లయలో తేడా</b>", T(273.7), { y: H * .8, align: "center", c: K.co, until: T(276.4) });
  NW.done();
</script>
</body></html>
