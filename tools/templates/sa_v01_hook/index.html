<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_v01_hook: V01 breathing stops again and again every night, dangerous for the heart; AIIMS Delhi: ~10 crore Indians */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 0.0);
  dust({ dens: [[0, .9], [6, .5]] });
  shot("B14", { t: 0, d: 1.2, mv: "dive", a: .4, in: "dim", until: T(1.0) });
  head("EVERY <b>NIGHT</b>", .2, { y: H * .1, size: 9 , until: T(3.8) });
  shot("B01", { t: T(1.0), d: 2.9, mv: "breathe", in: "blink", until: T(3.9) });
  trace(W * .05, H * .6, W * .9, H * .14, T(1.3), { ev: [[0, T(2.5), "snore"], [T(2.5), T(9), "apnea"]], label: "AIRFLOW", warn: "STOPPED", until: T(3.8) });
  shot("B08", { t: T(3.9), d: 2.2, mv: "push", a: 1, in: "cut", until: T(6.1) });
  head("YOUR <b>HEART</b> AT RISK", T(4.1), { y: H * .12, size: 7.4, until: T(6.0) });
  shot("A67", { t: T(6.1), d: 6.8, mv: "drift", a: .5, in: "dim" });
  te("<b>ఆశ్చర్యంగా</b> ఉందా?", T(6.1), { y: H * .14, until: T(7.3) });
  tag("INDIA", T(7.4), { y: H * .14, c: K.moon });
  num(0, 10, T(8.3), { y: H * .22, unit: "crore", d: 1, c: K.co, size: 26 });
  doc(`<h3>Sleep apnea in India</h3><div style="color:#6d6378">Study estimate · AIIMS New Delhi</div><div class="rule"></div>
    Working-age adults likely affected:<br><span class="hl"><b>about 10 crore</b></span>`, W * .1, H * .5, W * .8, H * .2, T(10.8), { rot: 3 });
  NW.done();
</script>
</body></html>
