<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 07 (85.4-99.9 s): Fable for everyone | Mythos looser in cyber + biology -> only verified companies: two programs */
.pg { position: absolute; display: flex; align-items: center; gap: calc(var(--u) * 2.4); padding: 0 calc(var(--u) * 3); border-radius: calc(var(--u) * 1.8);
      background: #fff; box-shadow: 0 calc(var(--u)) calc(var(--u) * 3) #1B21401c; font: 800 calc(var(--u) * 3.6) var(--font-head); color: #1B2140; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, move, bg, title, retitle, chip, icon, vcard } = X;
  bg("mint");
  const tF = at("fable", 0.05), tM = at("mythos", 2.4), tC = at("cyber", 3.75), tB = at("biology", 4.75), tL = at("loose", 6.75), tV = at("verify", 8.9), tCv = at("cvp", 11.2), tLs = at("life", 12.4);

  // A. left half: Fable for everyone (people light up); right half: Mythos, looser in cyber + biology (lock opens)
  const t1 = title("Fable for all, Mythos for experts", "Mythos లో cyber, biology తాళాలు కొంచెం వదులు", 0.1);
  const cw = W * 0.2, ch = H * 0.42, cy = H * 0.34;
  const f = vcard("fab", W * 0.05, cy, cw, ch); pop(f, tF + 0.1, { x: -u * 8, opacity: 0 }, 0.6);
  const ppl = [0, 1, 2].map((i) => { const p = icon("user", W * (0.28 + i * 0.055), H * 0.44, u * 6.5, PAL.fab); pop(p, tF + 0.6 + i * 0.1, { y: u * 3, opacity: 0 }); return p; });
  const cE = chip("Everyone", W * 0.28, H * 0.6, PAL.fab); pop(cE, tF + 0.9);
  const m = vcard("myt", W * 0.53, cy, cw, ch); pop(m, tM, { x: u * 8, opacity: 0 }, 0.6);
  const c1 = chip("Cyber security", W * 0.76, H * 0.4, PAL.myt), c2 = chip("Biology", W * 0.76, H * 0.52, PAL.myt);
  pop(c1, tC); pop(c2, tB);
  const ul = icon("unlock", W * 0.77, H * 0.64, u * 7, PAL.myt); pop(ul, tL, { scale: 0.3, opacity: 0, rotation: 15 }, 0.5, E.pop);

  // B. verified companies only: Fable side leaves, Mythos moves left, the two programs fill the right
  out([f, cE, ...ppl], tV - 0.5);
  out([c1, c2, ul], tV - 0.5);
  retitle(t1, "Verified companies only", "Anthropic verify చేసిన companies కి మాత్రమే Mythos", tV - 0.2);
  move(m, tV - 0.3, W * 0.08, H * 0.32, W * 0.26, H * 0.52);
  const p1 = place(mk("div", "pg", undefined, "Cyber Verification Program"), W * 0.42, H * 0.36, W * 0.5, H * 0.17);
  const p2 = place(mk("div", "pg", undefined, "Life Sciences Program"), W * 0.42, H * 0.6, W * 0.5, H * 0.17);
  icon("shield", 0, 0, u * 7, PAL.myt, p1).style.position = "relative"; icon("check", 0, 0, u * 6.4, PAL.green, p2).style.position = "relative";
  p1.prepend(p1.lastChild); p2.prepend(p2.lastChild);
  pop(p1, tCv - 0.2, { x: u * 8, opacity: 0 }, 0.6); pop(p2, tLs - 0.2, { x: u * 8, opacity: 0 }, 0.6);
  X.done();
</script></body></html>
