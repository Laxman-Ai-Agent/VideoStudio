<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="sm.js"></script><script src="sm2.js"></script>
<style>/* 16_Lung_Cancer lc_l12_symptoms: L12 symptoms one by one, then the 3-week cough rule */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 200.85);
  const S = [["A01", T(201.0), "PERSISTENT COUGH"], ["A44", T(205.5), "BLOOD IN COUGH"], ["A45", T(206.5), "CHEST PAIN"], ["A46", T(207.8), "BREATHLESSNESS"],
             ["A49", T(209.5), "HOARSE VOICE"], ["A48", T(210.8), "WEIGHT LOSS"], ["A47", T(212.6), "FATIGUE"], ["A43", T(213.8), "REPEAT INFECTIONS"]];
  S.forEach(([k, t, c], i) => shot(k, { t, d: (S[i + 1] ? S[i + 1][1] : T(217.9)) - t, mv: ["push", "panL", "pull", "panR"][i % 4], in: i ? ["wipe", "zoom", "wipeL", "rise"][i % 4] : "cut",
    until: S[i + 1] ? S[i + 1][1] + .5 : T(217.9) }));
  head("WATCH FOR", T(201.6), { x: W * .06, y: H * .1, size: 5, c: K.ice, until: T(217.8) });
  list([["తగ్గని, పెరిగే <b>దగ్గు</b>", T(204.1), false], ["దగ్గులో <b>రక్తం</b>", T(205.6), false], ["ఛాతీ <b>నొప్పి</b>", T(206.6), false],
        ["<b>ఆయాసం</b> · wheezing", T(207.9), false]], W * .06, H * .3, { until: T(209.4) });
  list([["గొంతు <b>బొంగురు</b>", T(209.6), false], ["బరువు <b>తగ్గడం</b>", T(211.0), false], ["ఎక్కువ <b>అలసట</b>", T(212.7), false],
        ["మళ్ళీ మళ్ళీ <b>infections</b>", T(214.4), false]], W * .06, H * .3, { until: T(217.8) });
  shot("A05", { t: T(217.9), d: 4.6, mv: "push", in: "smoke" });
  cal(["WEEK 1", "WEEK 2", "WEEK 3", "WEEK 4"], W * .1, H * .1, W * .8, H * .13, T(218.2), { from: T(218.6), step: .45 });
  head("3 WEEKS+ → <b>SEE A DOCTOR</b>", T(219.6), { y: H * .64, align: "center", size: 5.6 });
  SM.done();
</script>
</body></html>
