<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l09_fold: L09 AlphaFold: DeepMind, ~200 million protein shapes counter, Nobel Prize 2024 medal */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tFo = at("fold", 1.3), tCr = at("crore", 3.4), tNo = at("nobel", 6.1);
  paper();
  photo("A13", { t: 0, d: D, mv: "drift", a: .6, in: "fade" });
  wash(0, null, { bg: `linear-gradient(90deg, ${K.bg}f8 40%, ${K.bg}c8 100%)` });
  photo("alphafold", { t: .2, d: D, mv: "orbit", a: .8, in: "zoom", box: [W * .58, H * .08, W * .38, H * .62], fit: true, blend: 1, until: tNo - .1 });
  kick("GOOGLE DEEPMIND", .2, { y: H * .14 });
  head("<em>AlphaFold</em>", tFo - .3, { y: H * .2, size: 11, c: K.vio });
  count(0, 200, tCr - .4, { y: H * .42, size: 15, unit: "MILLION PROTEINS", c: K.vio, d: 1.4 });
  photo("A15", { t: tNo - .2, d: D - tNo + .5, mv: "push", a: .6, in: "iris", box: [W * .56, H * .12, W * .36, H * .6], r: H * .3 });
  rings(W * .74, H * .42, tNo, { c: K.gold, r: H * .34 });
  chip("NOBEL PRIZE · 2024", W * .06, H * .7, tNo + .2, { c: K.gold, size: 2.6 });
  AT.done();
</script>
</body></html>
