<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l03_theory: L03 just a theory: whiteboard plate, THEORY badge, not all agree dots, but there is proof (microscope), how the body works */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tTh = at("theory", .6), tAl = at("all", 2.2), tPr = at("proof", 4.6), tNo = at("normal", 7.2);
  paper();
  photo("A07", { t: 0, d: tPr + 1, mv: "push", a: .5, in: "slide", dir: -1, box: [W * .5, H * .12, W * .44, H * .56], plate: true, fig: "FIG. 02 · AN OPEN DEBATE", rot: 2, until: tPr });
  stamp("THEORY", W * .25, H * .26, tTh, { c: K.vio, size: 6, rot: -5, until: tPr });
  kick("NOT ALL SCIENTISTS AGREE", tAl, { y: H * .42, c: K.ink, until: tPr });
  dots(20, 9, [W * .07, H * .5, W * .34], tAl + .2, { cols: 10, c: K.green, off: K.red + "88", until: tPr });
  photo("A04", { t: tPr - .2, mv: "push", a: .7, in: "iris", fx: .6, fy: .4 });
  wash(tPr, null, { a: .95 });
  kick("BUT", tPr, { y: H * .22 });
  head("there is a <em>clue</em>", tPr + .2, { y: H * .28, size: 9 });
  tel("ముందు normal గా ఎలా పనిచేస్తుందో", tNo - .2, { y: H * .48 });
  AT.done();
</script>
</body></html>
