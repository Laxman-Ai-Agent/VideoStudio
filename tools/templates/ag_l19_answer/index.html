<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l19_answer: L19 the answer: no full answer for 150; AI speeds new drugs + cancer tests; realistic win = more HEALTHY years */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tAi = at("ai", 5.8), tCa = at("cancer", 7.2), tHe = at("healthy", 12.6);
  paper({ blob: .24 });
  head("150 years?", .1, { y: H * .16, size: 12, until: tAi - .2 });
  head("<em>No full answer</em> yet", .7, { y: H * .34, size: 8, until: tAi - .2 });
  helix([W * .78, H * .42, H * .66], 0, { r: H * .1, n: 20, until: tAi - .2 });
  photo("A13", { t: tAi - .2, d: tHe - tAi + 1, mv: "drift", a: .7, in: "slide", box: [W * .5, H * .1, W * .42, H * .54], plate: true, fig: "AI IN THE LAB", rot: 1.5, until: tHe - 3.3 });
  kick("AI IS SPEEDING UP", tAi, { y: H * .16, c: K.vio, until: tHe - 3.3 });
  chip("NEW DRUGS", W * .06, H * .26, tAi + .3, { c: K.vio, size: 2.8, until: tHe - 3.3 });
  chip("CANCER-DETECTING TESTS", W * .06, H * .38, tCa, { c: K.red, size: 2.8, until: tHe - 3.3 });
  photo("A34", { t: tHe - 3.4, mv: "push", a: .5, in: "iris", fx: .5, fy: .4 });
  wash(tHe - 3.3, null, { a: .9 });
  const h1 = head("Not more <em>years</em>", tHe - 3.1, { y: H * .16, size: 8, c: K.mute });
  const sk = place(mk("div", ""), W * .06, H * .16 + u * 5, W * .5, u * .7); Object.assign(sk.style, { position: "absolute", background: K.warn, transformOrigin: "0 50%" });
  ff(sk, tHe - 2, { scaleX: 0 }, { scaleX: 1 }, .5, E.io);
  head("More <em>healthy</em> years", tHe - 1, { y: H * .32, size: 10, c: K.green });
  AT.done();
</script>
</body></html>
