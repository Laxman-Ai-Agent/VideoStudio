<style>/* 18 Acidity_GERD gd_l17_meals: L17 how to control: small meals more often instead of one full stomach; 3 hour gap between dinner and sleep */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, wave, shot, enter, morph, drench, fizz, heat, head, te, tag, num, callout, list, myth, phone, doc, ring, flash, cam, key, tract, phScale, shield, people, clock3, bed, chain, tubes, flags, radiate, PH } = AC;
  const T = (x) => Math.max(0, x - 255.8);
  drench(0, { part: "out" });
  shot("A75", { t: 0, d: 2.5, mv: "push", in: "cut", until: T(258.3) });
  head("HOW TO <b>CONTROL</b> IT", T(256.0), { y: H * .12, c: K.por, until: T(258.2) });
  shot("A30", { t: T(258.3), d: 2.6, mv: "push", in: "split", box: [W * .04, H * .14, W * .44, H * .56], fr: true, fig: "ONE BIG MEAL", no: "16", c: K.fl, until: T(263.1) });
  shot("A49", { t: T(260.6), d: 2.6, mv: "push", in: "split", box: [W * .52, H * .14, W * .44, H * .56], fr: true, fig: "SMALL · OFTEN", no: "17", c: K.por, until: T(263.1) });
  te("<b>కొంచెం కొంచెంగా</b> ఎక్కువసార్లు", T(261.2), { y: H * .8, c: K.por, until: T(263.1) });
  shot("A50", { t: T(263.2), d: 5.1, mv: "panR", in: "melt" });
  clock3(W * .76, H * .42, u * 15, T(263.6), { t2: T(265.8), h0: 8, h1: 11, label: "3 HOURS", c: K.por });
  head("DINNER → BED: <b>3 HOURS</b>", T(266.2), { x: W * .06, y: H * .14, size: 5, c: K.por });
  AC.done();
</script>
