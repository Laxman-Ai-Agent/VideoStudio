<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos seq 13 (209.5-235.3 s): black hole, 2 open problems -> one prompt, three devices -> RoboDojo 27.6 -> 64.9 -> Anthropic's own tests */
.big { position: absolute; font: 400 calc(var(--u) * 14.9) var(--font-head); line-height: 1; white-space: nowrap; }
.pr { position: absolute; padding: calc(var(--u) * 1.2) calc(var(--u) * 2); border: 1px solid #6EF0B5; border-radius: calc(var(--u) * .6); background: #050506d8;
      color: var(--text); font: 700 calc(var(--u) * 2.2) var(--font-script); letter-spacing: .08em; white-space: nowrap; min-width: calc(var(--u) * 30); min-height: calc(var(--u) * 2.4); }
.trk { position: absolute; height: calc(var(--u) * 2.4); border-radius: 99px; background: #ffffff10; border: 1px solid #ffffff22; overflow: hidden; }
.fil { position: absolute; left: 0; top: 0; bottom: 0; width: 100%; transform-origin: 0 50%; border-radius: 99px; }
.mk { position: absolute; font: 700 calc(var(--u) * 2) var(--font-script); letter-spacing: .12em; white-space: nowrap; }
.mk b { display: block; font: 400 calc(var(--u) * 8.1) var(--font-head); letter-spacing: 0; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, card, pop, dim, head, redact, kick, type, count, stamp, line, camera, bg } = K;
  bg({ seed: 31 });
  const st = K.$("stage"); camera(st, 1.05, 0.012);
  const fade = (e, t) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: true }, t);

  // A. black hole picture card + "2 OPEN PROBLEMS" counter, SOLVED stamp
  const tB = at("black", 0.1), tO = at("open", 1.4);
  const bh = card({ i: "blackhole", x: W * 0.06, y: H * 0.1, w: W * 0.46, h: H * 0.56, focus: [0.5, 0.5, 1.05] });
  pop(bh, Math.max(0, tB - 0.1), { scale: 1.12, opacity: 0 }, 0.8, E.in);
  const kB = kick("BLACK HOLE PHYSICS", W * 0.58, H * 0.14); fade(kB, tB + 0.3);
  const n2 = place(mk("div", "big", st), W * 0.58, H * 0.2); n2.style.color = PAL.fab; fade(n2, tO - 0.2); count(n2, 0, 2, tO - 0.2, 0.6);
  const hO = head("OPEN PROBLEMS", W * 0.58, H * 0.2 + u * 16.5, 4.6); redact(hO, tO + 0.1);
  const sv = stamp("SOLVED BY FABLE", W * 0.59, H * 0.47, PAL.fab, tO + 1.8, -6);

  // B. one prompt line types, three flow lines run to three real device cards, each on its spoken name
  const tP = at("prompt", 5.6), tDv = at("devices", 7.9), tHub = at("hub", 10.1), tUsb = at("usb", 10.7), tPet = at("pet", 13.2);
  tl.to([bh, kB, n2, hO, sv], { opacity: 0, x: -u * 6, duration: 0.5, ease: E.out, stagger: 0.03 }, tP - 0.7);
  const pr = place(mk("div", "pr", st), W * 0.06, H * 0.07); fade(pr, tP - 0.25); type(pr, "> ONE PARAGRAPH PROMPT", tP - 0.1, 30);
  const hD = head("3 WORKING <em>DEVICES</em>", W * 0.5, H * 0.07, 4.6); redact(hD, tDv);
  const cs = W * 0.2, cy = H * 0.3, dev = [];
  [["hub", "VOICE HUB", tHub], ["speaker", "USB SPEAKERPHONE", tUsb], ["pet", "VIRTUAL PET", tPet]].forEach(([k, tag, t], i) => {
    const x = W * (0.08 + i * 0.3);
    dev.push(line(W * 0.18, H * 0.14, x + cs / 2, cy, tDv + i * 0.25, PAL.fab, 0.5, u * 0.25));
    const c = card({ i: k, x, y: cy, w: cs, h: cs, tag }); dev.push(c);
    pop(c, t - 0.15, { y: u * 8, opacity: 0, scale: 0.85, rotation: (i - 1) * 4 }, 0.6, E.in);
  });

  // C. robots: robot arm card, RoboDojo, a slider track fills 27.6 (old, grey) then 64.9 (mint)
  const tR = Math.max(at("robots", 14.0), at("pet", 13.2) + 1.1), tOld = at("old", 17.0), tNew = at("new", 19.25), tOwn = at("own", 23.5);
  tl.to([pr, hD, ...dev], { opacity: 0, y: -u * 5, duration: 0.5, ease: E.out, stagger: 0.02 }, tR - 0.6);
  const rb = card({ i: "robot", x: W * 0.06, y: H * 0.1, w: W * 0.36, h: H * 0.6 });
  pop(rb, tR - 0.1, { x: -u * 10, opacity: 0, rotation: -3 }, 0.7, E.in);
  const kR = kick("ROBOT CONTROL TEST", W * 0.48, H * 0.14); fade(kR, tR + 0.3);
  const hR = head("ROBO<em>DOJO</em>", W * 0.48, H * 0.19, 7); redact(hR, tR + 0.5);
  const tx = W * 0.48, tw = W * 0.44, trk = place(mk("div", "trk"), tx, H * 0.5, tw);
  tl.fromTo(trk, { opacity: 0, scaleX: 0.6, transformOrigin: "0% 50%" }, { opacity: 1, scaleX: 1, duration: 0.5, ease: E.in, immediateRender: true }, tOld - 0.6);
  const f2 = place(mk("div", "fil", trk), 0, 0), f1 = place(mk("div", "fil", trk), 0, 0);
  f1.style.background = PAL.mute; f2.style.background = `linear-gradient(90deg, ${PAL.fab}44, ${PAL.fab})`;
  tl.fromTo(f1, { scaleX: 0 }, { scaleX: 0.276, duration: 0.8, ease: "power2.out", immediateRender: true }, tOld);
  tl.fromTo(f2, { scaleX: 0 }, { scaleX: 0.649, duration: 1.0, ease: "power2.out", immediateRender: true }, tNew);
  const m1 = place(mk("div", "mk", st, "OLD VERSION<b>0%</b>"), tx, H * 0.56); m1.style.color = PAL.mute; fade(m1, tOld);
  count(m1.querySelector("b"), 0, 27.6, tOld, 0.8, (v) => v.toFixed(1) + "%");
  const m2 = place(mk("div", "mk", st, "FABLE 5.2<b>0%</b>"), tx + tw * 0.649 - u * 14, H * 0.56); m2.style.color = PAL.fab; fade(m2, tNew);
  count(m2.querySelector("b"), 0, 64.9, tNew, 1.0, (v) => v.toFixed(1) + "%");

  // D. the caveat: a bone-coloured stamp, the robot card dims
  stamp("ANTHROPIC'S OWN TESTS", W * 0.48, H * 0.34, PAL.text, tOwn, -5); dim(rb, tOwn + 0.2, 0.45);
  K.done();
</script></body></html>
