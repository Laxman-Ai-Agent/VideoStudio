<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="kit.js"></script><script src="hd.js"></script>
<style>/* 10_Diarrhea_ORS hd_l03_myths: home reflexes (stop rice, milk, tablet, glucose, cola) crossed out, help arrow flips to reverse, into the gut */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, u, tl, E, at, mk, place, pop, out, move, cam } = X;
  const { K, float, bgl, base, push, card, pill, word, draw, ring, flow, tank, nope, tick, dots, icon, aside, enter, zin, bigNum } = HD;
  document.documentElement.style.setProperty("--u", u + "px");
  bgl();
  const p = (i, d) => at("p" + i, d);

  const t2 = p(2, 4.3), t3 = p(3, 10.9), t4 = p(4, 17.2);
  /* 1. the home row, camera pans across it; question bubble */
  const r = base("H05", W * .08, H * .14, W * .84, H * .64, { label: "rice plate, milk, tablet strip, soft drink" });
  zin(r, 0, 1.06); push(r, .6, t2 - .6, 1.06, -u * 3, 0);
  const q = card(`What do you do <em>first</em>?<span class="te">మొదట ఏం చేస్తారు?</span>`, W * .32, H * .04, { center: true, c: K.amber });
  pop(q, .5, { y: -u * 3, opacity: 0 }, .7, E.spring); const ck = icon("clock", K.amber, W * .25, H * .04, u * 7); pop(ck, .7, { scale: .4, opacity: 0 }, .6, E.spring);
  /* 2. step-zoom on each reflex: red circle-slash + STOP pill */
  HD.clear(t2 - .3);
  out(q, t2 - .3); out(ck, t2 - .3);
  const xs = [.2, .4, .6]; const lb = ["STOP RICE", "STOP MILK", "TABLET"];
  xs.forEach((x, i) => { const t = t2 + i * 1.7; push(r, t - .2, .6, 1.12, (0.5 - x) * W * .25, 0, E.io);
    nope(W * x, H * .46, u * 7, t + .2); const pl = pill(lb[i], K.red, W * (x - .06), H * .66, { solid: true }); pop(pl, t + .3, { y: u * 2, opacity: 0 }, .45); out(pl, t3 - .3); });
  /* 3. glucose + cola: help arrow turns into reverse */
  HD.clear(t3 - .3);
  push(r, t3 - .3, .8, 1.15, -W * .07, 0, E.io);
  const a = draw(`M ${W * .3} ${H * .25} L ${W * .7} ${H * .25}`, K.green, t3, .6, { head: true, w: u * .9 });
  const ph = pill("HELP?", K.green, W * .45, H * .12); pop(ph, t3 + .2, { y: u * 2, opacity: 0 }, .5);
  out(a, t3 + 2.4); out(ph, t3 + 2.4);
  const b = draw(`M ${W * .7} ${H * .25} L ${W * .3} ${H * .25}`, K.red, t3 + 2.5, .6, { head: true, w: u * .9 });
  const pr = pill("REVERSE", K.red, W * .44, H * .12, { solid: true }); pop(pr, t3 + 2.6, { scale: .6, opacity: 0 }, .55, E.spring);
  /* 4. into the gut: the row slides down and out, the gut zooms in with an outline trace */
  HD.clear(t4 - .3);
  [b, pr].forEach((e) => out(e, t4 - .4)); out(r, t4 - .4, { y: H * .1 });
  const g = base("H01", W * .25, H * .06, W * .5, H * .78, { label: "small + large intestine" });
  zin(g, t4 - .2, .85); push(g, t4 + .6, D - t4, 1.15, 0, H * .02);
  const ch = card(`How the gut <em>works</em><span class="te">పేగులు normal గా ఎలా పనిచేస్తాయి</span>`, W * .05, H * .12, { bar: true, c: K.blue });
  pop(ch, t4 + .2, { x: -u * 4, opacity: 0 }, .7, E.spring);
  draw(`M ${W * .4} ${H * .3} C ${W * .55} ${H * .22}, ${W * .62} ${H * .44}, ${W * .5} ${H * .5} S ${W * .38} ${H * .64}, ${W * .56} ${H * .66}`, K.blue, t4 + .6, 2, { w: u * .4 });
  cam(0, Math.max(D, 1), 1.02);
  X.done();
</script></body></html>
