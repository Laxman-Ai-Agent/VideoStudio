<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_v03_mice: V03 mice: 3 Yamanaka switches, optic nerve regrows (path), half the sight back gauge, not proven in humans */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tYa = at("yama", 1.6), tOp = at("optic", 5.8), tHa = at("half", 9.4), tHu = at("human", 13.2);
  paper();
  photo("B04", { t: 0, d: tOp + .5, mv: "push", a: .7, in: "fade", until: tOp + .2 });
  wash(0, tOp, { bg: `linear-gradient(180deg, ${K.bg}f5 30%, ${K.bg}00 60%)` });
  kick("YAMANAKA FACTORS", tYa - .3, { y: H * .08, until: tOp });
  ["OCT4", "SOX2", "KLF4"].forEach((g, i) => toggle(W * (.08 + i * .3), H * .14, tYa + i * .2, tYa + 1.2 + i * .35, g, { until: tOp }));
  head("3 genes → <em>young</em>", tYa + 1.2, { y: H * .22, size: 9, c: K.green, until: tOp });
  photo("A12", { t: tOp - .2, d: D - tOp + .5, mv: "drift", a: .8, in: "iris" });
  wash(tOp, null, { a: .55, bg: "linear-gradient(180deg, #0b1611c0, #0b161140 45%, #0b1611c0)" });
  head("Optic nerve <em>regrew</em>", tOp, { y: H * .08, size: 8.5, col: "#fff", c: "#7CF3C0", shadow: 1 });
  path(`M${W * .2} ${H * .62} C ${W * .1} ${H * .4}, ${W * .9} ${H * .5}, ${W * .75} ${H * .26}`, tOp + .4, { c: "#7CF3C0", w: 1.2, glow: 1, d: 2.2, pulse: 1, pc: "#fff", until: tHa - .1 });
  gauge(.5, W * .5, H * .42, W * .26, tHa - .4, { c: "#7CF3C0", w: 3.4, ns: 14, fill: "#0b1611aa" });
  stamp("NOT PROVEN IN HUMANS", W * .5, H * .64, tHu, { size: 5, c: K.warn });
  AT.done();
</script>
</body></html>
