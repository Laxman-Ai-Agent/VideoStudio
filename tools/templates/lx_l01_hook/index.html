<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l01_hook: L01 hook 0-22 s: towers + Anthropic logo, IPO roadshow, three questions, chip makers, $17B revenue yet a loss, decode */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tIpo = at("ipo", 3.8), q1 = at("q1", 5.9), q2 = at("q2", 7.5), q3 = at("q3", 9.2), tCh = at("chips", 11), tRv = at("rev", 15.8), tLs = at("loss", 17.4), tDe = at("detail", 20.1);
  grid({ a: .6 });

  /* 1. night towers; the Anthropic wordmark wipes in, goes public */
  const a1 = shot("A01", { t: 0, d: tIpo, mv: "push", a: .8, in: "line", fy: .4 });
  dim(0, tIpo - .2, .55, { bg: "radial-gradient(ellipse at 50% 50%, #07090fcc, #07090f30 70%)" });
  mono("CLAUDE AI · MAKER", .3, { align: "center", y: H * .3, until: tIpo - .2 });
  const lg = logo("anthropic_logo_w", [W * .2, H * .38, W * .6, H * .1], .5, { in: "wipe" });
  head("goes <em>public</em>", 1.5, { align: "center", y: H * .54, size: 9, until: tIpo - .2 });
  morph(lg, tIpo - .3, [W * .06, H * .06, W * .22, H * .04], .6);
  out(a1, tIpo + .4, .3);

  /* 2. the roadshow; ticker tape starts and stays */
  const a7 = shot("A07", { t: tIpo - .1, d: q1 - tIpo + 6, mv: "panR", a: .7, in: "wipe" });
  dim(tIpo, q1 - .2, .85, { bg: "linear-gradient(0deg, #07090f 25%, #07090f00 70%)" });
  head("The IPO <em>roadshow</em>", tIpo + .2, { y: H * .64, size: 10, until: q1 - .2 });
  tape([["ANT", 1], ["NASDAQ", 0], ["IPO ROADSHOW", 0], ["CLASS A", 0], ["$70-$78", 1], ["825M SHARES", 0], ["NOV 19", 0]], tIpo + .3);

  /* 3. the picture shrinks into a framed panel; three questions type in on the right */
  const fb = [W * .05, H * .13, W * .47, H * .62];
  morph(a7, q1 - .3, fb, .7); ticks(fb, q1 + .3, { until: tCh - .3 });
  [["01", "HOW MANY SHARES?", q1], ["02", "PRICE PER SHARE?", q2], ["03", "TOTAL VALUE?", q3]].forEach(([n, s, t], i) => {
    num(0, +n, t, { x: W * .57, y: H * (.17 + i * .19), size: 7, col: K.coral, d: .3, fmt: (v) => String(Math.round(v)).padStart(2, "0"), until: tCh - .3 });
    mono(s, t + .15, { x: W * .66, y: H * (.2 + i * .19), size: 2.4, c: K.ink, until: tCh - .3 });
  });
  head("<em>?</em>", q3 + .5, { x: W * .86, y: H * .56, size: 16, until: tCh - .3 });
  out(a7, tCh, .3);

  /* 4. chip makers: wafer orbit, chips row */
  shot("A12", { t: tCh - .1, d: tRv - tCh + .4, mv: "orbit", a: .8, in: "whip", until: tRv + .1 });
  dim(tCh, tRv, .85, { bg: "linear-gradient(0deg, #07090f 30%, #07090f00 85%)" });
  head("Why are <em>chip makers</em> buying in?", tCh + .2, { y: H * .5, size: 8, until: tRv - .1 });
  ["NVIDIA", "AMD", "BROADCOM", "GOOGLE", "MICRON", "MICROSOFT", "TSMC"].forEach((c, i) =>
    chip(c, W * .05 + i * W * .129, H * .66, tCh + 1 + i * .18, { w: W * .122, size: 2, until: tRv - .1 }));

  /* 5. $17B in one quarter (green) ... yet a loss (red) */
  shot("A06", { t: tRv - .1, d: D - tRv, mv: "push", a: .6, in: "zoom", until: tDe - .6 });
  dim(tRv, tDe - .6, .7, { bg: "linear-gradient(90deg, #07090f 30%, #07090f40)" });
  mono("ONE QUARTER · JUL-SEP", tRv, { y: H * .2, c: K.green, until: tDe - .7 });
  num(0, 17, tRv + .1, { y: H * .27, pre: "$", unit: "B REVENUE", c: K.green, size: 15, d: 1, until: tDe - .7 });
  chart([[0, .2], [.25, .45], [.5, .7], [.62, .82], [.75, .5], [1, .25]], tLs - .6, { box: [W * .52, H * .2, W * .4, H * .38], c: K.red, d: 1.1, until: tDe - .7 });
  head("...yet a <em>loss</em>", tLs + .2, { y: H * .62, size: 10, c: K.red, until: tDe - .7 });

  /* 6. let's decode it: clean grid, the logo returns centre */
  cam(tDe - .2, D - tDe + .2, { scale: 1.05 });
  head("Let's <em>decode</em> it.", tDe, { align: "center", y: H * .38, size: 12 });
  morph(lg, tDe - .2, [W * .35, H * .22, W * .3, H * .05], .6);
  LK.done();
</script>
</body></html>
