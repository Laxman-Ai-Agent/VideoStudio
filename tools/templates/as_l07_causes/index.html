<style>/* 15_Asthma as_l07_causes: L07 causes: no single cause, family, allergies / eczema / weight / premature, smoke, workplace, pollution */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 122.0);
  flow({ n: 110, alpha: .45, band: .8, until: T(126.3) });
  head("WHY DOES IT", T(122.2), { y: H * .3, align: "center", size: 5.6, until: T(126.2) });
  head("<b>HAPPEN</b>?", T(122.7), { y: H * .42, align: "center", size: 8, until: T(126.2) });
  tag("NO SINGLE CAUSE", T(124.6), { align: "center", y: H * .62, c: K.hn, until: T(126.2) });
  const fam = shot("A24", { t: T(126.2), d: 4, mv: "push", a: .6, in: "mist" });
  tag("FAMILY HISTORY", T(126.8), { until: T(130) });
  te("అమ్మ, నాన్న, <b>తోబుట్టువులు</b>", T(127.3), { y: H * .76, until: T(130) });
  tl.to(fam, { opacity: .18, duration: .6 }, T(129.9));
  [["A34", "ALLERGIES", 130.1], ["A25", "ECZEMA", 130.9], ["A26", "EXTRA WEIGHT", 131.7], ["A27", "PREMATURE BIRTH", 132.7]].forEach(([k, c, t], i) =>
    shot(k, { t: T(t), d: 6, mv: i % 2 ? "pull" : "push", in: "rise", box: [W * (.03 + i * .24), H * .16, W * .22, H * .46], glass: true, cap: c, until: T(136.6) }));
  head("HIGHER <b>RISK</b>", T(134.6), { y: H * .7, align: "center", size: 6, c: K.co, until: T(136.5) });
  shot("A28", { t: T(136.6), d: 2.4, mv: "drift", in: "mist", fx: .4, until: T(139.1) });
  tag("CHILDHOOD SMOKE", T(137.2), { c: K.co, until: T(139) });
  shot("A29", { t: T(138.8), d: 2.4, mv: "panL", in: "wipe", until: T(141.1) });
  tag("WORKPLACE DUST · CHEMICALS", T(139.6), { c: K.hn, until: T(141) });
  shot("A30", { t: T(141.0), d: 2.4, mv: "push", in: "iris" });
  head("AIR <b>POLLUTION</b>", T(141.2), { y: H * .14, size: 7, c: K.co });
  BK.done();
</script>
