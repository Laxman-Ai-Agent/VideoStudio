<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_v06_cta: V06 CTA: phone, comment 'aging' typed in a comment box, full video link comes */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tAg = at("aging", 3.4), tLk = at("link", 6.4);
  paper();
  photo("B08", { t: 0, mv: "push", a: .6, in: "fade" });
  wash(0, null, { bg: `linear-gradient(180deg, ${K.bg}f8 40%, ${K.bg}20 75%)` });
  head("Want the <em>full story</em>?", .1, { y: H * .08, size: 9 });
  const bx = place(mk("div", "at-card"), W * .08, H * .24, W * .84); bx.style.setProperty("--c", K.red);
  bx.innerHTML = `<div class="rl">ADD A COMMENT</div><div class="nm" id="typed">&nbsp;</div>`;
  ff(bx, tAg - 1, { opacity: 0, y: u * 6 }, { opacity: 1, y: 0 }, .5, E.snap);
  const v = { n: 0 }, w = "aging", el = bx.querySelector("#typed");
  tl.fromTo(v, { n: 0 }, { n: w.length, duration: .8, ease: "none", immediateRender: true, onUpdate: () => { el.textContent = w.slice(0, Math.round(v.n)) || " "; } }, tAg);
  chip("FULL VIDEO LINK →", W * .08, H * .42, tLk, { c: K.green, size: 4.4 });
  AT.done();
</script>
</body></html>
