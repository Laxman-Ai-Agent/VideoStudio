<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l17_commit: L17 $895B compute commitments over a data campus aerial; IPO money -> compute arrow */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tCm = at("commit", 2.4), tB = at("b895", 4), tIpo = at("ipo", 6.4);
  shot("A21", { t: 0, d: D, mv: "push", a: .7, in: "line", fy: .5 });
  dim(0, null, .6, { bg: "radial-gradient(ellipse at 50% 45%, #07090fdd, #07090f30 75%)" });
  mono("END OF SEPTEMBER · COMPUTE COMMITMENTS", tCm - .4, { align: "center", y: H * .18, c: K.gold, size: 2 });
  num(0, 895, tB - .3, { align: "center", y: H * .25, pre: "$", unit: "BILLION", size: 20, col: K.gold, c: K.ink, d: 1.4 });
  chip("IPO MONEY", W * .2, H * .62, tIpo, { c: K.green, size: 3, w: W * .22 });
  arrow(W * .44, H * .62 + u * 3.2, W * .56, H * .62 + u * 3.2, tIpo + .3, { c: K.gold });
  chip("COMPUTE", W * .58, H * .62, tIpo + .6, { c: K.gold, size: 3, w: W * .22 });
  LK.done();
</script>
</body></html>
