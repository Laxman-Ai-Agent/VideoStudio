<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos 9x16 seq 02 (16.2-27.4 s): top half Fable FOR EVERYONE (mint, people) | bottom half Mythos (violet): cyber security, biology, lock, SELECTED ONLY */
.half { position: absolute; left: 0; width: 100%; overflow: hidden; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, card, pop, head, redact, kick, vcard, chip, icon, line, shake, camera, bg } = K;
  bg({ seed: 102 });
  const st = K.$("stage"); camera(st, 1.04, -0.01);
  const fade = (e, t) => tl.fromTo(e, { opacity: 0 }, { opacity: 1, duration: 0.3, immediateRender: true }, t);

  // A. top half (mint): the Fable card + FOR EVERYONE, a row of people lights up
  const tF = Math.max(0, at("fable", 0)), tEv = at("everyone", 1.4);
  const T = place(mk("div", "half"), 0, 0, null, H * 0.38); T.style.background = `linear-gradient(180deg, ${PAL.fab}08, ${PAL.fab}22)`;
  tl.fromTo(T, { yPercent: -100 }, { yPercent: 0, duration: 0.6, ease: E.io, immediateRender: true }, tF);
  const cw = W * 0.3, f = vcard("fab", W * 0.07, H * 0.05, cw, cw * 1.38); pop(f, tF + 0.1, { x: -u * 10, rotation: -8, opacity: 0 }, 0.6, E.in);
  const kF = kick("FABLE 5.2", W * 0.43, H * 0.07); fade(kF, tF + 0.4);
  const h1 = head("FOR", W * 0.43, H * 0.1, 7), h2 = head("<em>EVERYONE</em>", W * 0.43, H * 0.15, 7); redact(h1, tEv - 0.1); redact(h2, tEv + 0.15);
  for (let i = 0; i < 6; i++) { const p = icon("user", W * (0.43 + i * 0.085), H * 0.24, u * 7, PAL.fab); pop(p, tEv + 0.4 + i * 0.08, { y: u * 4, scale: 0.5, opacity: 0 }, 0.35); }

  // B. bottom half (violet): the strong subjects chip in first, then the Mythos card
  const tC = at("cyber", 3.1), tB = at("biology", 4.3), tM = at("mythos", 6.3), tSe = at("selected", 8.9);
  const B = place(mk("div", "half"), 0, H * 0.38, null, H * 0.38); B.style.background = `linear-gradient(180deg, ${PAL.myt}24, ${PAL.myt}08)`;
  tl.fromTo(B, { yPercent: 100, opacity: 0 }, { yPercent: 0, opacity: 1, duration: 0.6, ease: E.io, immediateRender: true }, tC - 0.5);
  const c1 = chip("CYBER SECURITY", W * 0.43, H * 0.42, PAL.myt), c2 = chip("BIOLOGY", W * 0.43, H * 0.47, PAL.myt);
  [c1, c2].forEach((c) => (c.style.fontSize = u * 3.4 + "px"));
  pop(c1, tC, { x: u * 8, opacity: 0 }, 0.4, E.in); pop(c2, tB, { x: u * 8, opacity: 0 }, 0.4, E.in);
  const m = vcard("myt", W * 0.07, H * 0.41, cw, cw * 1.38); pop(m, tM - 0.1, { x: -u * 10, rotation: 8, opacity: 0 }, 0.6, E.in);
  const kM = kick("MYTHOS 5.2", W * 0.43, H * 0.53); fade(kM, tM);

  // C. a padlock card snaps shut, a chain line draws across, SELECTED ONLY
  const lk = card({ i: "lock", x: W * 0.66, y: H * 0.56, w: W * 0.26, h: W * 0.26 });
  pop(lk, tSe - 0.4, { scale: 0.5, opacity: 0, rotation: -8 }, 0.45); shake(lk, tSe + 0.1, u * 0.6);
  line(W * 0.04, H * 0.752, W * 0.96, H * 0.752, tSe, PAL.myt, 0.6, u * 0.4);
  const h3 = head("<b>SELECTED</b>", W * 0.07, H * 0.655, 7.5), h4 = head("COMPANIES", W * 0.07, H * 0.705, 6); redact(h3, tSe); redact(h4, tSe + 0.25);
  K.done();
</script></body></html>
