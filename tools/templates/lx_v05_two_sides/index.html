<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_v05_two_sides: V05 adjusted +$2.5B, then twin lines: business racing up, costs rising too */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const t25 = at("b25", 2), tSd = at("side", 5.8), tCo = at("cost", 9);
  shot("B07", { t: 0, d: tSd + .5, mv: "sink", a: .8, in: "zoom", until: tSd });
  dim(0, tSd, .7, { bg: "radial-gradient(ellipse at 50% 30%, #07090fee, #07090f40 80%)" });
  mono("EXCLUDING THESE COSTS", .2, { align: "center", y: H * .14, c: K.green, until: tSd - .1 });
  num(0, 2.5, t25 - .3, { align: "center", y: H * .18, pre: "+$", unit: "B", size: 25, col: K.green, c: K.ink, fmt: (v) => v.toFixed(1), d: 1, until: tSd - .1 });
  mono("ADJUSTED PROFIT · COMPANY VIEW", t25 + .5, { align: "center", y: H * .32, c: K.mute, size: 2.4, until: tSd - .1 });
  grid();
  const bx = [W * .08, H * .2, W * .84, H * .34];
  chart([[0, .1], [.4, .4], [.7, .6], [1, .95]], tSd, { box: bx, c: K.green, d: 1.6 });
  chart([[0, .05], [.4, .35], [.7, .62], [1, .9]], tCo - .3, { box: bx, c: K.red, d: 1.6 });
  mono("AI BUSINESS", tSd + .4, { x: W * .08, y: H * .12, c: K.green, size: 3 });
  mono("COSTS", tCo, { x: W * .08, y: H * .16, c: K.red, size: 3 });
  head("Both <em>racing</em> up", tCo + .6, { align: "center", y: H * .58, size: 11 });
  LK.done();
</script>
</body></html>
