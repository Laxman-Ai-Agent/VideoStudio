<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 04_Fable_Mythos explainer seq 05 (61.9-73.1 s): two names, looks like two AIs -> the cards merge into ONE MODEL -> difference = safeguards */
.one { position: absolute; border-radius: calc(var(--u) * 2); background: #fff; box-shadow: 0 calc(var(--u) * 1.4) calc(var(--u) * 4) #1B214022; overflow: hidden; }
.one .top { height: 26%; background: linear-gradient(90deg, #10B981, #7C4DFF); }
.one b { display: block; margin: 7% 8% 0; font: 800 calc(var(--u) * 6.4) var(--font-head); color: #1B2140; }
.one i { display: block; margin: 2% 8%; font: 600 calc(var(--u) * 2.8) var(--font-head); font-style: normal; color: #5B6178; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, u, PAL, tl, E, at, mk, place, fade, pop, out, move, bg, title, retitle, chip, icon, vcard } = X;
  bg("mint");
  const tN = at("names", 0), tT = at("two", 1.45), tR = at("real", 4.1), tF = at("fable", 5.3), tO = at("one", 8.3), tSf = at("safeguards", 9.95);

  // A. two cards, one each side: it looks like two different AIs
  const t1 = title("Two names…", "పేర్లు వింటే రెండు వేర్వేరు AI లు అనిపిస్తుంది", Math.max(0.05, tN));
  const cw = W * 0.26, ch = H * 0.48, cy = H * 0.33;
  const f = vcard("fab", W * 0.1, cy, cw, ch), m = vcard("myt", W * 0.64, cy, cw, ch);
  pop(f, 0.3, { x: -u * 8, opacity: 0 }, 0.6); pop(m, tT, { x: u * 8, opacity: 0 }, 0.6);
  const q = chip("2 different AIs?", W * 0.41, H * 0.55, PAL.coral); pop(q, tT + 0.5);

  // B. "but": the two cards slide into the centre and become one model card; the difference is only the safeguards
  out(q, tR - 0.2); const t2 = retitle(t1, "…one model", "Fable 5.2, Mythos 5.2 రెండూ ఒకే model", tR);
  move(f, tF, W / 2 - cw / 2 - u * 3, cy); move(m, tF, W / 2 - cw / 2 + u * 3, cy);
  out([f, m], tO - 0.3, { scale: 0.9 });
  const one = place(mk("div", "one", undefined, `<div class="top"></div><b>One model</b><i>Fable 5.2 = Mythos 5.2</i>`), W * 0.3, cy, W * 0.4, ch);
  pop(one, tO - 0.2, { scale: 0.85, opacity: 0 }, 0.6, E.pop);
  move(one, tSf - 0.3, W * 0.08, cy, W * 0.4, ch);
  const lk = icon("lock", W * 0.62, cy + u * 4, u * 14, PAL.coral); pop(lk, tSf, { scale: 0.3, opacity: 0, rotation: -12 }, 0.5, E.pop);
  const cS = chip("Difference = safeguards", W * 0.55, cy + u * 24, PAL.coral); cS.style.fontSize = u * 4.6 + "px"; pop(cS, tSf + 0.3);
  X.done();
</script></body></html>
