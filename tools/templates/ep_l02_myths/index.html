<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">

</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, shot, enter, morph, net, eeg, head, te, hud, num, lock, myth, list, phone, doc, dots, bolt, ring, flash, cam } = SK;
  const T = (x) => Math.max(0, x - 22.0);
  shot("E01", { t: 0, d: 5, mv: "push", a: .8, in: "cut", until: T(29.6) });
  head("<b>FEAR</b>", T(24.4), { y: H * .14, c: K.mg, size: 11, until: T(26.4) });
  eeg(T(26.2), { box: [0, H * .5, W, H * .14], d: 3.2, spike: [[.3, 3]], c: K.mg, until: T(29.6) });
  te("కింద పడి, <b>చేతులు కాళ్లు</b> కొట్టుకుంటుంటే...", T(26.2), { y: H * .16, c: K.mg, until: T(29.5) });

  const h = shot("E05", { t: T(33.4), d: 2, mv: "push", in: "lift", box: [W * .66, H * .1, W * .3, H * .62], glass: true, cap: "HOLDING DOWN", c: K.mg });
  te("చేతిలో <b>తాళాలు</b>", T(30.0), { x: W * .05, y: H * .76, c: K.mg, size: 3.4, until: T(35.2) });
  te("<b>చెప్పు</b> వాసన", T(31.4), { x: W * .37, y: H * .76, c: K.mg, size: 3.4, until: T(35.2) });
  te("గట్టిగా <b>పట్టుకోవడం</b>", T(33.6), { x: W * .67, y: H * .76, c: K.mg, size: 3.4, until: T(35.2) });
  [k, s, h].forEach((e, i) => { const st = mk("div", "sk-stamp", e, "MYTH"); place(st, u * 2, u * 2); st.style.zIndex = 5;
    tl.fromTo(st, { scale: 2.2, opacity: 0, rotation: -16 }, { scale: 1, opacity: 1, rotation: -8, duration: .4, ease: E.snap, immediateRender: true }, T(35.9) + i * .18); });

  [k, s, h].forEach((e) => out(e, T(37.4), .4, { scale: .9 }));

  SK.done();
