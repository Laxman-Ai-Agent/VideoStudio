<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l20_myths: L20 myths: snoring = deep sleep (no: a narrowed airway signal); not every snorer has apnea, but snoring + pauses needs care */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 399.1);
  dust({ dens: [[0, .6]] });
  shot("A67", { t: 0, d: 3.9, mv: "drift", in: "dim", until: T(403.0) });
  head("SLEEP APNEA <b>MYTHS</b>", T(399.6), { y: H * .38, align: "center", size: 8, until: T(402.9) });
  shot("A01", { t: T(403.0), d: 6, mv: "breathe", in: "blink", until: T(408.8) });
  myth("గురక = <b>గాఢ నిద్ర</b>", T(403.8), T(407.6), { x: W * .06, y: H * .16, until: T(408.7) });
  airway(W * .08, H * .12, W * .84, H * .44, T(408.8), { g: [[0, .3]], vib: [[0, 30]], m: "NARROWED AIRWAY", until: T(413.3) });
  head("SNORING CAN BE A <b>SIGNAL</b>", T(410.6), { y: H * .66, size: 5.4, c: K.moon, until: T(413.2) });
  shot("A54", { t: T(413.3), d: 4, mv: "drift", in: "fade", box: [0, 0, W * .5, H], until: T(417.3) });
  tag("NOT EVERY SNORER HAS APNEA", T(414.4), { x: W * .54, y: H * .2, c: K.mint, until: T(417.2) });
  te("ప్రతి గురకా <b>apnea</b> కాదు", T(415.3), { x: W * .54, y: H * .34, size: 4.4, until: T(417.2) });
  shot("A03", { t: T(417.3), d: 5.2, mv: "push", a: .7, in: "dim", fy: .6 });
  trace(0, H * .74, W, H * .24, T(417.6), { ev: [[0, T(419.3), "snore"], [T(419.3), T(430), "apnea"]], label: "SNORING + PAUSES", warn: "BE CAREFUL" });
  head("SNORE + PAUSES = <b>WARNING</b>", T(420.4), { x: W * .06, y: H * .14, size: 5.6 });
  NW.done();
</script>
</body></html>
