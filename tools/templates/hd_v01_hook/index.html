<style>/* 10_Diarrhea_ORS hd_v01_hook: hook: diarrhea does not kill, water + salts do (shrivelled cell), 4,44,000 counter over child shoes, home reflexes crossed out, drinks reverse */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, u, tl, E, at, mk, place, pop, out, move, cam } = X;
  const { K, float, bgl, base, push, card, pill, word, draw, ring, flow, tank, nope, tick, dots, icon, aside, enter, zin, bigNum } = HD;
  document.documentElement.style.setProperty("--u", u + "px");
  bgl();
  const p = (i, d) => at("p" + i, d);

  const t2 = p(2, 5.8), t3 = p(3, 12), t4 = p(4, 17.5);
  const c = base("H15", W * .04, H * .2, W * .92, H * .4, { label: "hydrated vs dehydrated cell" }); zin(c, 0, 1.3); push(c, .8, t2, 1.1, -W * .1, 0);
  const h1 = word(`Diarrhea <em>doesn't</em> kill<span class="te">విరేచనాలు చంపవు</span>`, W * .07, H * .06, 8.4, { c: K.red }); pop(h1, .1, { y: -u * 4, opacity: 0 }, .7, E.spring);
  const pw = pill("నీళ్లు", K.blue, W * .14, H * .6); pop(pw, 2.4, { y: u * 3, opacity: 0 }, .5, E.spring);
  const ps = pill("SALTS", K.amber, W * .52, H * .6); pop(ps, 3, { y: u * 3, opacity: 0 }, .5, E.spring);
  flow(`M ${W * .7} ${H * .4} C ${W * .8} ${H * .5}, ${W * .7} ${H * .62}, ${W * .8} ${H * .72}`, 10, K.blue, 2.6, t2, { r: u * 1.2, speed: .5, jit: 5 });
  /* 2. the number */
  HD.clear(t2 - .3);
  [h1, pw, ps, c].forEach((e) => out(e, t2 - .3));
  const sh = base("H03", W * .1, H * .34, W * .8, H * .32, { label: "child shoes" }); zin(sh, t2 - .2); tl.to(sh, { opacity: .6, duration: .6 }, t2 + 1);
  const n = bigNum(W * .08, H * .1, 0, 444000, t2 + .2, 2.8, K.red, 17);
  const nl = card(`children a year<span class="te">ప్రతి సంవత్సరం</span>`, W * .1, H * .22, { bar: true, c: K.red }); pop(nl, t2 + 1, { y: u * 3, opacity: 0 }, .6, E.spring);
  /* 3. home reflexes */
  HD.clear(t3 - .3);
  [n, nl, sh].forEach((e) => out(e, t3 - .3));
  const r = base("H05", W * .02, H * .24, W * .96, H * .36, { label: "rice, milk, tablets, soft drink" }); zin(r, t3 - .2, 1.06);
  const q = card(`At home, <em>first</em>...<span class="te">చాలా ఇళ్లలో</span>`, W * .08, H * .08, { bar: true, c: K.amber }); pop(q, t3, { y: -u * 3, opacity: 0 }, .6, E.spring);
  [.16, .38, .58].forEach((x, i) => nope(W * x, H * .42, u * 9, t3 + 1 + i * 1.1));
  /* 4. drinks: help -> reverse */
  HD.clear(t4 - .3);
  [q, r].forEach((e) => out(e, t4 - .3));
  const d = base("H19", W * .02, H * .26, W * .96, H * .36, { label: "juice, cola, glucose water, ORS" }); zin(d, t4 - .2);
  const a1 = draw(`M ${W * .15} ${H * .2} L ${W * .85} ${H * .2}`, K.green, t4 + .1, .5, { head: true, w: u * 1.2 }); out(a1, t4 + 2);
  draw(`M ${W * .85} ${H * .2} L ${W * .15} ${H * .2}`, K.red, t4 + 2.1, .5, { head: true, w: u * 1.2 });
  const wr = card(`Makes it <em>worse</em><span class="te">problem ఇంకా ఎక్కువ</span>`, W * .1, H * .06, { bar: true, c: K.red }); pop(wr, t4 + 2.3, { y: -u * 3, opacity: 0 }, .6, E.spring);
  cam(0, Math.max(D, 1), 1.02);
  X.done();
</script></body></html>
