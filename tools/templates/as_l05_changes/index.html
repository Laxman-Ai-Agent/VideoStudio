<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l05_changes: L05 three changes: lining swells (inflammation), muscle tightens, mucus -> narrow airway */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 87.8);
  const aw = airway(W * .28, H * .47, u * 21, 0, { id: "c", swell: T(89.8), squeeze: T(95.0), mucus: T(97.6) });
  list([["<b style='color:#FF6A4D'>1</b> లోపలి పొర <b>వాపు</b>", T(89.6), false], ["<b style='color:#FF6A4D'>2</b> కండరాలు <b>బిగుసుకుపోతాయి</b>", T(94.6), false],
        ["<b style='color:#FFC163'>3</b> <b>జిగట</b> పదార్థం", T(97.4), null]], W * .58, H * .63, { until: T(100.2) });
  shot("A17", { t: T(89.8), d: 3.4, mv: "push", in: "rise", box: [W * .58, H * .07, W * .38, H * .51], glass: true, cap: "INFLAMMATION", c: K.co, until: T(93.2) });
  head("<b>INFLAMMATION</b>", T(91.5), { x: W * .05, y: H * .05, size: 4.6, c: K.co, until: T(93.0) });
  shot("A18", { t: T(93.0), d: 3.4, mv: "pull", in: "wipe", box: [W * .58, H * .07, W * .38, H * .51], glass: true, cap: "MUSCLE TIGHTENS", c: K.co, until: T(96.4) });
  shot("A19", { t: T(96.2), d: 4, mv: "push", in: "rise", box: [W * .58, H * .07, W * .38, H * .51], glass: true, cap: "STICKY MUCUS", c: K.hn, until: T(100.3) });
  tl.to(aw, { left: W / 2 - u * 21 * 1.3, top: H * .42 - u * 21 * 1.3, scale: 1.25, duration: 1, ease: E.io }, T(100.2));
  flow({ n: 170, alpha: .8, band: .5, cy: .42, t: T(100.4), choke: [[T(100.6), T(103.5), .9]], z: 9 });
  head("<b>NARROW</b> AIRWAY", T(101.9), { y: H * .78, align: "center", size: 6.4, c: K.co });
  BK.done();
</script>
</body></html>
