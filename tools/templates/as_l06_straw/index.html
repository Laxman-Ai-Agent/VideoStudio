<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="bk.js"></script>
<style>/* 15_Asthma as_l06_straw: L06 crushed straw + honey analogy, attack, breathing out harder, wheezing */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;
  const T = (x) => Math.max(0, x - 103.5);
  shot("A20", { t: 0, d: 2, mv: "push", in: "mist", until: T(105.4) });
  head("CRUSHED <b>STRAW</b>", T(104.2), { y: H * .14, size: 7, until: T(105.4) });
  const hn = shot("A21", { t: T(105.4), d: 2, mv: "sink", in: "slide", box: [W * .5, H * .1, W * .44, H * .66], glass: true, cap: "+ HONEY", c: K.hn, until: T(107.8) });
  shot("A20", { t: T(105.4), d: 2, mv: "push", in: "cut", box: [W * .06, H * .1, W * .42, H * .66], glass: true, cap: "STRAW", until: T(107.8) });
  shot("A22", { t: T(106.5), d: 6.8, mv: "push", a: .6, in: "mist", fx: .5 });
  flow({ n: 120, alpha: .75, band: .35, cy: .55, t: T(106.8), choke: [[T(107), T(113.4), .85]], until: T(113.4) });
  te("ఊదడం <b>ఎంత కష్టం</b>?", T(107.8), { y: H * .12, c: K.hn, until: T(109.3) });
  head("THAT'S AN <b>ATTACK</b>", T(109.4), { y: H * .14, size: 6.8, c: K.co, until: T(113.3) });
  shot("A23", { t: T(113.3), d: 8.7, mv: "push", a: .6, in: "wipe", fx: .45 });
  flow({ n: 130, alpha: .7, band: .3, cx: .62, cy: .45, dir: -1, speed: .4, t: T(113.6), choke: [[T(113.6), T(122), .7]] });
  head("BREATHING <b>OUT</b>", T(114.0), { x: W * .54, y: H * .14, size: 5.8, until: T(116.2) });
  head("IS <b>HARDER</b>", T(114.6), { x: W * .54, y: H * .25, size: 5.8, c: K.co, until: T(116.2) });
  ring(W * .38, H * .36, T(119.4), { r: u * 12, n: 4, c: K.hn });
  ring(W * .38, H * .36, T(120.7), { r: u * 18, n: 3, c: K.hn });
  te("<b>ఈల</b> లాంటి శబ్దం", T(119.5), { x: W * .54, y: H * .3, c: K.hn, until: T(122) });
  head("<b>WHEEZING</b>", T(120.6), { x: W * .54, y: H * .42, size: 8, c: K.hn });
  BK.done();
</script>
</body></html>
