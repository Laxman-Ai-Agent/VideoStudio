<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>
/* 03_Wireless_Power seq 07 (77-93 s): power let loose scatters everywhere (loss) -> focused in one direction the loss drops -> like a torch */
#fx { position: absolute; inset: 0; }
#tgt { position: absolute; border-radius: calc(var(--u) * 1); border: calc(var(--u) * .4) dashed var(--text2); }
#meter { position: absolute; font: 800 calc(var(--u) * 2.6) var(--font-head); color: var(--text2); letter-spacing: .12em; }
#meter b { color: var(--accent); font-size: 1.6em; }
#spot { position: absolute; border-radius: 50%; background: radial-gradient(circle, #fff8e0 0 40%, #ffd27a 55%, #ffb21a00 72%); mix-blend-mode: screen; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"><canvas id="fx"></canvas></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, $, mk, place, card, pop, out, dim, ring, type, rise, chip, slam, camera, circuits, rnd } = K;
  circuits({ seed: 77, lines: 8, sparks: 20 });
  const st = $("stage"); camera(st, 1.04, 0);
  const tSc = at("scatter", 3.5), tLo = at("loss", 4.9), tFo = at("focus", 8.8), tLe = at("less", 10.3), tTo = at("torch", 11.1), tSh = at("sharp", 13.6);

  // the source (the lamp picture in a round card) on the left, a receiver frame on the right
  const sx = W * 0.16, sy = H * 0.4, rs = H * 0.22;
  const src = card({ i: "lamp", x: sx - rs / 2, y: sy - rs / 2, w: rs, h: rs, shape: "round", focus: [0.3, 0.55, 2] });
  pop(src, at("power", 0.4), { scale: 0.3, opacity: 0 });
  const tx = W * 0.8, tgt = place(mk("div", "", st), tx - u * 5, sy - u * 9, u * 10, u * 18); tgt.id = "tgt";
  pop(tgt, 1.2, { opacity: 0, x: u * 8 }, 0.5, E.in);
  const rc = place(mk("div", "kt", st), tx - u * 7, sy + u * 10.5); rc.style.cssText += `font-size:${u * 2.2}px;color:${PAL.text2}`; type(rc, "DEVICE", 1.4, 20);

  // particles: angle per particle; "focus" bends every angle toward the receiver; deterministic (seeded, a function of time)
  const cv = $("fx"); cv.width = W; cv.height = H; const g = cv.getContext("2d"), r = rnd(9), N = 260;
  const P = Array.from({ length: N }, () => ({ a: r() * Math.PI * 2, v: 0.6 + r() * 0.8, t0: r() * 2.4, hue: r() }));
  const state = { spread: 0, focus: 0, on: 0 };
  tl.to(state, { on: 1, duration: 0.6 }, at("power", 0.4) + 0.4);
  tl.to(state, { spread: 1, duration: 1.2, ease: E.in }, tSc - 0.6);
  tl.to(state, { focus: 1, duration: 1.3, ease: E.io }, tFo - 0.5);
  const draw = (t) => {
    g.clearRect(0, 0, W, H); if (!state.on) return;
    const reach = tx - sx;
    P.forEach((p) => {
      const life = ((t - p.t0) % 2.4 + 2.4) % 2.4 / 2.4, a = p.a * (1 - state.focus) * (0.25 + 0.75 * state.spread) + (p.hue - 0.5) * 0.04 * state.focus;
      const d = life * reach * p.v * (0.9 + 0.3 * state.focus), x = sx + Math.cos(a) * d, y = sy + Math.sin(a) * d;
      const fade = 1 - life;
      g.fillStyle = (state.focus > 0.5 ? PAL.acc : PAL.pri) + Math.round(fade * state.on * 200).toString(16).padStart(2, "0");
      g.beginPath(); g.arc(x, y, u * (0.25 + 0.25 * fade), 0, 6.28); g.fill();
    });
    if (state.focus > 0.2) { g.strokeStyle = PAL.acc + "99"; g.lineWidth = u * 0.8 * state.focus; g.shadowColor = PAL.acc; g.shadowBlur = u * 3 * state.focus;
      g.beginPath(); g.moveTo(sx + rs / 2, sy); g.lineTo(tx, sy); g.stroke(); g.shadowBlur = 0; }
    if ($("mv")) $("mv").textContent = Math.round(10 + 80 * state.focus) + "%";
  };
  const o = { t: 0 }; tl.fromTo(o, { t: 0 }, { t: D, duration: D, ease: "none", onUpdate: () => draw(o.t) }, 0);

  // words: SCATTERED -> ENERGY LOSS (with a "reaches the device" meter) -> FOCUS -> LESS LOSS
  const w1 = place(mk("div", "kh", st, "Scattered"), W * 0.3, H * 0.06); w1.style.cssText += `font-size:${u * 7}px;opacity:0`;
  rise(w1, tSc - 0.2);
  const mt = place(mk("div", "", st, "REACHES THE DEVICE <b id='mv'>10%</b>"), W * 0.3, H * 0.68); mt.id = "meter";
  tl.fromTo(mt, { opacity: 0 }, { opacity: 1, duration: 0.4 }, tLo);
  const w2 = place(mk("div", "kh", st, "Energy <em style='color:#FF5A3C'>Loss</em>"), W * 0.3, H * 0.16); w2.style.cssText += `font-size:${u * 7}px;opacity:0`;
  rise(w2, tLo);
  tl.to([w1, w2], { opacity: 0, y: -u * 4, duration: 0.4, ease: E.out }, tFo - 0.7);
  const w3 = place(mk("div", "kh", st, "<em>Focus</em> it"), W * 0.3, H * 0.06); w3.style.cssText += `font-size:${u * 7}px;opacity:0`;
  rise(w3, tFo - 0.2); ring(src, tFo + 0.4);
  const w4 = place(mk("div", "kt", st), W * 0.3, H * 0.2); w4.style.fontSize = u * 3.6 + "px"; type(w4, "LESS *LOSS*", tLe, 18);

  // torch: the whole diagram slides away; the torch card arrives and its beam makes one sharp circle on the lens picture
  tl.to([src, tgt, rc, mt, w3, w4, cv], { x: -W * 0.6, opacity: 0, duration: 0.7, ease: "power3.in", stagger: 0.02 }, tTo - 0.6);
  const ts = H * 0.5, torch = card({ i: "torch", x: W * 0.07, y: H * 0.12, w: ts * 3 / 4, h: ts, focus: [0.5, 0.5, 1.15] });
  pop(torch, tTo - 0.1, { x: -W * 0.2, rotation: -6, opacity: 0 }, 0.7, E.in);
  const tt = place(mk("div", "kt", st), W * 0.07, H * 0.12 + ts + u * 2); tt.style.fontSize = u * 3 + "px"; type(tt, "LIKE A *TORCH*", tTo + 0.2, 20);
  const lw = W * 0.5, lh = lw * 9 / 16, lens = card({ i: "lens", x: W * 0.42, y: H * 0.1, w: lw, h: lh, focus: [0.5, 0.5, 1.1] });
  pop(lens, tTo + 0.4, { x: W * 0.2, opacity: 0 }, 0.7, E.in);
  dim(lens, tTo + 1.1, 0.5);
  const sp = place(mk("div", "", st), W * 0.42 + lw * 0.62 - H * 0.1, H * 0.1 + lh * 0.5 - H * 0.1, H * 0.2, H * 0.2); sp.id = "spot";
  tl.fromTo(sp, { scale: 3, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.6, ease: E.in }, tSh - 0.6);
  const sh = place(mk("div", "kh", st, "<em>Sharp.</em>"), W * 0.42, H * 0.1 + lh + u * 2); sh.style.cssText += `font-size:${u * 7}px;opacity:0`;
  slam(sh, tSh);
  K.done();
</script></body></html>
