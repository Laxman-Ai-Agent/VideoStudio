<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="nw.js"></script><script src="nw2.js"></script>
<style>/* 17_Sleep_Apnea sa_l07_ahi: L07 doctors measure AHI: stops or shallow breaths per hour, each pause at least 10 s; mild 5-14, moderate 15-29, severe 30+ */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 129.35);
  shot("A17", { t: 0, d: 4.8, mv: "push", in: "dim", until: T(134.3) });
  tag("HOW DOCTORS MEASURE IT", T(129.8), { until: T(134.2) });
  head("<b>AHI</b>", T(131.3), { x: W * .62, y: H * .3, size: 14, until: T(134.2) });
  tag("APNEA-HYPOPNEA INDEX", T(132.4), { x: W * .62, y: H * .52, c: K.moon, until: T(134.2) });
  shot("A26", { t: T(134.3), d: 6.8, mv: "rise", a: .5, in: "blink", until: T(141.1) });
  clock(W * .2, H * .44, u * 13, T(134.6), { h0: 0, h1: 1, d: 3.6, until: T(141.0) });
  te("ఒక <b>గంటకు</b> ఎన్ని సార్లు?", T(135.8), { x: W * .08, y: H * .76, until: T(141.0) });
  num(0, 22, T(136.4), { x: W * .58, y: H * .28, unit: "pauses / hr", d: 2.4, c: K.co, until: T(141.0) });
  list([["శ్వాస ఆగడం", T(137.1), false], ["బాగా తగ్గడం", T(138.6), null]], W * .58, H * .56, { until: T(141.0) });
  shot("A18", { t: T(141.1), d: 4.5, mv: "push", a: 1.2, in: "fade", until: T(145.6) });
  num(0, 10, T(143.9), { x: W * .58, y: H * .3, unit: "sec", d: .9, size: 18, until: T(145.5) });
  head("EACH PAUSE: <b>10 SEC+</b>", T(142.2), { x: W * .06, y: H * .12, size: 5.4, until: T(145.5) });
  shot("A06", { t: T(145.6), d: 10.5, mv: "drift", a: .5, in: "dim" });
  head("HOW <b>SEVERE</b>?", T(145.8), { y: H * .12, align: "center", size: 5.6 });
  ahi(W * .08, H * .36, W * .84, T(146.0), [[T(146.0), 0], [T(147.0), 0], [T(148.4), 10], [T(151.0), 22], [T(154.2), 36]], { bt: [T(148.4), T(151.0), T(154.2)] });
  te("గంటకు <b>30</b> లేదా ఎక్కువ = severe", T(153.3), { y: H * .74, align: "center", c: K.co });
  NW.done();
</script>
</body></html>
