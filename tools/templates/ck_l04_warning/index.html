<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="ck.js"></script><script src="ck_geo.js"></script><script src="ck2.js"></script>
<style>/* 10 Cyclone_Akwan ck_l04_warning: L04 not yet recovered, the same warning again: no fishing; the third storm Akwan heads for the same coast */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, key, run, canvas, atmo, shot, enter, morph, cloudwipe, head, te, tag, num, callout, list, chips, stamp, phone, doc, ring, flash, cam, swirl, bay, cards, ladder, dial, xsec, gauge, wheel, mast, clock24 } = CK;
  const T = (x) => Math.max(0, x - 47.3);
  atmo();
  shot("A07", { t: 0, d: 4.1, mv: "sink", in: "cut", until: T(51.4) });
  te("ఇంకా <b>కోలుకోక ముందే</b>...", T(48.4), { y: H * .14, until: T(51.4) });
  head("THE SAME <b>WARNING</b>", T(50.8), { y: H * .62, c: K.red, size: 8.4, until: T(55.2) });
  shot("A34", { t: T(51.4), d: 4, mv: "panL", in: "cut", until: T(55.2) });
  stamp("NO FISHING", W * .62, H * .16, T(53.0), { c: K.red, until: T(55.2) });
  shot("A08", { t: T(55.2), d: 6.2, mv: "dive", a: .5, in: "cloud", fx: .5, fy: .35 });
  head("STORM <b>NO. 3</b>", T(55.6), { y: H * .14, align: "center", size: 10, c: K.red });
  te("అదే coast వైపు <b>Akwan</b>", T(57.0), { y: H * .78, align: "center" });
  swirl(W * .5, H * .44, u * 16, T(56.4), { k: [[0, .4], [T(60), 1]], z: 8 });
  cloudwipe(D, { part: "in" });
  CK.done();
</script>
</body></html>
