<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l05_revenue: L05 revenue: bars 2025 vs 2026 (x7, SiliconANGLE), Jul-Sep $17B on the money machine, now the news */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tSv = at("seven", 4.6), tSi = at("sil", 5.6), tJu = at("july", 8.1), tB = at("b17", 11.2), tNw = at("news", 14.2);
  grid();
  mono("REVENUE", .1, { y: H * .1 });
  bars([1 / 7, 1], ["2025 · FULL YEAR", "2026 · 9 MONTHS"], .3, { box: [W * .06, H * .18, W * .46, H * .56], cs: [K.mute, K.green], stag: 1.4, until: tJu - .2 });
  num(1, 7, tSv - .2, { x: W * .58, y: H * .26, pre: "×", unit: "TIMES", size: 22, col: K.green, c: K.ink, d: .8, until: tJu - .2 });
  mono("SOURCE · SILICONANGLE", tSi, { x: W * .58, y: H * .58, c: K.mute, size: 1.8, until: tJu - .2 });
  shot("A06", { t: tJu - .1, d: D - tJu, mv: "push", a: .7, in: "line" });
  dim(tJu, null, .7, { bg: "radial-gradient(ellipse at 50% 50%, #07090fdd, #07090f40 80%)" });
  mono("ONE QUARTER · JUL - SEP", tJu + .2, { align: "center", y: H * .26, c: K.green, size: 2.4 });
  num(0, 17, tB - .3, { align: "center", y: H * .33, pre: "$", unit: "BILLION", size: 22, col: K.green, c: K.ink, d: 1.2, until: tNw - .2 });
  ring(W * .5, H * .45, tB + .8, { c: K.green, r: u * 22, n: 2 });
  cam(tNw - .2, D - tNw + .2, { scale: 1.06 });
  head("Now, the <em>news</em>.", tNw, { align: "center", y: H * .4, size: 12 });
  flash(tNw - .05, .25);
  LK.done();
</script>
</body></html>
