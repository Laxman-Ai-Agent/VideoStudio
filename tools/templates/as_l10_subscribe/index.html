<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, show, svg, shot, enter, morph, flow, airway, tree, meter, puff, head, te, tag, num, focus, myth, list, phone, doc, dots, ring, mist, cam } = BK;

  const q1 = te("Inhaler = <b>అలవాటు</b>?", T(191.0), { x: W * .06, y: H * .2, c: K.hn, size: 5, until: T(196.3) });

  head("THE <b>TRUTH</b>", T(197.4), { y: H * .14, align: "center", size: 7.2, until: T(199) });
  const cd = place(mk("div", "bk-myth"), W * .13, H * .3, W * .74, H * .4); cd.style.whiteSpace = "normal";
  cd.innerHTML = `<div style="display:flex;align-items:center;gap:${u * 2}px;height:100%">
    <div style="width:${u * 17}px;height:${u * 17}px;border-radius:50%;background:linear-gradient(135deg,${K.mt},#2a9d8f);display:flex;align-items:center;justify-content:center;

      <div style="font:600 ${u * 2.4}px var(--font-script);color:${K.mute};letter-spacing:.08em">Medical facts in Telugu · New video every week</div>
      <div style="display:flex;gap:${u * 1.2}px;margin-top:${u * 1.4}px"><div class="lk" style="font:700 ${u * 2.6}px var(--font-script);padding:${u * .6}px ${u * 2}px;border-radius:${u * 3}px;background:#ffffff1a">👍 LIKE</div>
