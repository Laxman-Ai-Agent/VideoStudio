<!doctype html><html><head><meta charset="utf-8">

<style>/* 17_Sleep_Apnea sa_l19_doctor: L19 see a doctor without delay if: dozing while driving, family says your breathing stops, BP not controlled on medicines */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, blink, dust, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, trace, spo2, airway, night, ahi, tank, mult, clock } = NW;
  const T = (x) => Math.max(0, x - 386.65);
  const sh = [["A41", 386.9], ["A02", 390.3], ["A63", 393.5]];
  sh.forEach(([k, t0], i) => shot(k, { t: T(t0), d: 3.6, mv: "push", in: i ? "wipe" : "cut", box: [0, 0, W * .52, H], until: T(i < 2 ? sh[i + 1][1] : 396.6) }));
  tag("SEE A DOCTOR IF...", T(387.0), { x: W * .56, y: H * .1, c: K.co, until: T(396.5) });
  list([["Driving లో నిద్ర జారిపోతే", T(388.0), null], ["శ్వాస ఆగుతోందని ఇంట్లోవాళ్లు చెబితే", T(391.3), null], ["మందులు వాడినా BP control లేకపోతే", T(394.1), null]],
    W * .55, H * .26, { size: 3.6, until: T(396.5) });
  shot("A61", { t: T(396.6), d: 2.6, mv: "push", in: "iris", fx: .5 });
  head("DON'T <b>DELAY</b>", T(396.7), { y: H * .14, size: 6.4, c: K.mint });
  te("వెంటనే <b>doctor</b> ని సంప్రదించండి", T(397.6), { y: H * .76, align: "center" });
  NW.done();
</script>
</body></html>
