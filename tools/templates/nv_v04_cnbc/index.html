<style>/* 05 V04 9:16 (36.8-45.3 s): the shock: CNBC live page, TWO AFFAIRS claim, faceless red card "suspected Chinese spy" (per U.S. intelligence), ALLEGATIONS note */

.sil .bd { position: absolute; left: 50%; top: 60%; width: 46%; height: 32%; border-radius: 50% 50% 8% 8%; background: #E0393E; opacity: .85; transform: translateX(-50%); }

.sil .tx small { display: block; margin-top: calc(var(--u) * 1.4); font: 700 calc(var(--u) * 3) var(--font-script); letter-spacing: .1em; color: #5B6472; }

</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, pop, out, move, shot, mark, quote, head, chip, stamp, cam } = X;

  X.bg("scandal");
  const tS = at("shock", 0.2), tT = at("two", 1.7), tW = at("woman", 3.5), tI = at("intel", 4.4), tSp = at("spy", 5.5), tC = at("cnbc", 6.9);
  cam(0, D, 1.05);

  const cn = shot({ i: "cnbc_live", x: W * 0.06, y: H * 0.15, w: W * 0.88, url: "cnbc.com" }); pop(cn, tS, { y: u * 10, opacity: 0 }, 0.6);
