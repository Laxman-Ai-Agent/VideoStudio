<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l11_seven: L11 seven suppliers circle the Anthropic logo on each name, lines to the centre, $26B */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const ks = ["nv", "amd", "bro", "goo", "mic", "ms", "ts"], names = ["NVIDIA", "AMD", "BROADCOM", "GOOGLE", "MICRON", "MICROSOFT", "TSMC"];
  const tSv = at("seven", 1.6), tB = at("b26", 9.6);
  shot("A13", { t: 0, d: D, mv: "push", a: .6, in: "line" });
  dim(0, null, .78, { bg: "#07090f" });
  grid();
  mono("CHIPS · CLOUD · MEMORY", .2, { align: "center", y: H * .05, c: K.gold });
  num(0, 7, tSv - .2, { x: W * .06, y: H * .08, unit: "SUPPLIERS", size: 7, d: .5 });
  const cx = W * .5, cy = H * .44, R = H * .32;
  logo("anthropic_logo_w", [cx - W * .13, cy - H * .025, W * .26, H * .05], .4);
  names.forEach((n, i) => { const a = -Math.PI / 2 + i * Math.PI * 2 / 7, x = cx + Math.cos(a) * R * 1.55, y = cy + Math.sin(a) * R, t = at(ks[i], 2.6 + i * .8);
    arrow(x, y, cx + Math.cos(a) * W * .15, cy + Math.sin(a) * H * .06, t + .2, { c: K.green, d: .4 });
    chip(n, x - W * .08, y - u * 3.2, t, { size: 2, c: K.green, w: W * .16 }); });
  num(0, 26, tB - .2, { align: "center", y: H * .74, pre: "$", unit: "B OF SHARES", size: 8, col: K.green, c: K.ink, d: .9 });
  cam(tB, D - tB, { scale: 1.05 });
  LK.done();
</script>
</body></html>
