<style>/* 16_Lung_Cancer lc_v05_doctor: V05 3-week cough -> doctor, no self-medicating for TB; X-ray / CT, biopsy; treatments */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, R, at, $, mk, place, out, show, svg, shot, enter, morph, film, smoke, head, te, tag, num, focus, myth, list, phone, doc, ring, flash, cam, lab, lungs, body, cells, dna, people, donut, cal, dial } = SM;
  const T = (x) => Math.max(0, x - 57.45);
  const bgd = (k, t, until, o = .32) => { const e = shot(k, { t, d: until - t, mv: "push", a: .5, in: "fade", until }); tl.to(e, { opacity: o, duration: .6 }, t + .6); return e; };
  bgd("B05", T(57.45), T(62.8));
  cal(["WEEK 1", "WEEK 2", "WEEK 3"], W * .07, H * .2, W * .86, H * .07, T(57.6), { from: T(57.7), step: .35, until: T(62.7) });
  head("3 WEEKS+ <b>COUGH</b>", T(57.8), { y: H * .08, size: 8, until: T(62.7) });
  myth("TB అనుకొని <b>మీరే మందులు</b>", T(60.5), T(61.6), { x: W * .07, y: H * .36, stamp: "DON'T", until: T(62.7) });
  shot("B06", { t: T(62.7), d: 8, mv: "push", in: "scan", until: T(70.9) });
  head("SEE A <b>DOCTOR</b>", T(62.8), { y: H * .07, size: 8, c: K.ice, until: T(63.9) });
  film("A55", W * .1, H * .2, W * .8, W * .8 * .62, T(63.9), { scan: [T(64.6)], until: T(68.5) });
  tag("CHEST X-RAY · CT SCAN", T(64.2), { y: H * .07, c: K.ice, until: T(66.9) });
  head("<b>BIOPSY</b> CONFIRMS", T(66.9), { y: H * .07, size: 7.6, until: T(68.5) });
  bgd("B03", T(70.6), T(75.8), .3);
  const bw = W * .86, bh = bw * 9 / 16;
  const R5 = [["A59", T(70.7), "SURGERY"], ["A60", T(71.3), "CHEMOTHERAPY"], ["A61", T(72.2), "RADIATION"], ["A63", T(73.1), "TARGETED THERAPY"], ["A62", T(74.3), "IMMUNOTHERAPY"]];
  head("TYPE · <b>STAGE</b>", T(68.6), { y: H * .07, size: 8, c: K.ice });
  R5.forEach(([k, t, c], i) => { const nx = R5[i + 1] ? R5[i + 1][1] : T(75.8);
    shot(k, { t, d: nx - t + .5, mv: "push", in: ["rise", "wipe", "zoom", "wipeL", "rise"][i], box: [W * .07, H * .25, bw, bh], panel: true, until: nx + .2 });
    head(c, t + .1, { y: H * .25 + bh + H * .03, align: "center", size: 7, c: i > 2 ? K.ice : K.em, nobar: true, until: nx }); });
  SM.done();
</script>
