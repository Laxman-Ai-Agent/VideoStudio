<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="lk.js"></script>
<style>/* 12_Anthropic_IPO lx_l07_offer: L07 offer 87.5-103.7 s: certificate, 825M Class A shares, $70-78 bracket, x top price = $64B, +124M greenshoe bars */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, src, out, grid, shot, ticks, enter, morph, head, te, mono, num, tape, chart, bars, bracket, chip, logo, pages, ring, flash, scan, cam, dim, stamp, arrow, big } = LK;
  document.documentElement.style.setProperty("--u", u + "px");
  const tSh = at("shares", 1.2), tCl = at("cls", 2.8), tPr = at("price", 5.3), tHi = at("hi", 6), tTop = at("top", 7.7), tB = at("b64", 8.9),
        tDm = at("demand", 11.2), tEx = at("extra", 12.4), tBk = at("bank", 15.3);
  grid({ a: .5 });

  /* 1. the share certificate, then 825M Class A shares */
  const c = shot("A09", { t: 0, d: tTop + 1, mv: "push", a: .7, in: "line" });
  dim(0, tPr - .3, .75, { bg: "linear-gradient(90deg, #07090f 35%, #07090f30)" });
  mono("THE OFFER", .2, { y: H * .2, until: tPr - .3 });
  num(0, 825, tSh, { y: H * .27, unit: "M SHARES", size: 18, d: 1.2, until: tPr - .3 });
  chip("CLASS A", W * .06, H * .55, tCl, { c: K.gold, until: tPr - .3 });
  te("public investors కి అమ్మే shares", tCl + .4, { x: W * .2, y: H * .555, size: 3.4, c: K.gold, until: tPr - .3 });

  /* 2. certificate slides into a framed right panel; price bracket $70 .. $78 */
  const rb = [W * .56, H * .14, W * .38, H * .5];
  morph(c, tPr - .3, rb, .7); ticks(rb, tPr + .2, { tc: K.gold, until: tDm - .2 });
  mono("PRICE PER SHARE", tPr, { y: H * .24, c: K.gold, until: tDm - .2 });
  bracket("$70", "$78", tPr + .1, { box: [W * .08, H * .42, W * .38], until: tTop + .6 });

  /* 3. 825M x $78 = $64B */
  te("825M <b>×</b> $78 =", tTop, { y: H * .36, size: 5, c: K.gold, until: tDm - .2 });
  num(0, 64, tB - .1, { y: H * .47, pre: "$", unit: "BILLION", size: 17, col: K.gold, c: K.ink, d: 1, until: tDm - .2 });
  ring(W * .2, H * .6, tB + .6, { c: K.gold, r: u * 14, n: 2 });
  out(c, tDm, .3);

  /* 4. the bankers + the greenshoe option: +124M extra shares */
  shot("A08", { t: tDm - .1, d: D - tDm, mv: "panL", a: .7, in: "whip" });
  dim(tDm, null, .75, { bg: "linear-gradient(90deg, #07090fee 45%, #07090f40)" });
  mono("IF DEMAND IS HIGH", tDm + .1, { y: H * .14, c: K.green });
  bars([825 / 950, 949 / 950], ["BASE", "+ OPTION"], tDm + .4, { box: [W * .06, H * .24, W * .36, H * .52], cs: [K.coral, K.green], stag: .9 });
  num(0, 124, tEx, { x: W * .45, y: H * .3, pre: "+", unit: "M EXTRA", size: 12, col: K.green, c: K.ink, d: .9 });
  head("held by the <em>banks</em>", tBk, { x: W * .45, y: H * .55, size: 8, c: K.green });
  LK.done();
</script>
</body></html>
