<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script>
<script src="at.js"></script><script src="at2.js"></script>
<style>/* 13_Aging_150 ag_l06_sight: L06 sight back: retina photo, half the lost sight gauge, 1-year-old mice plate, ONLY IN MICE stamp */</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="stage"></div>
</div>
<script>
  const { W, H, D, V, u, K, tl, E, at, $, mk, place, out, ff, paper, photo, enter, morph, wash, panel, head, kick, tel, count, card, chip, flash, cam, stamp, rings,
          book, scatter, helix, path, arrow, ruler, chart, bars, gauge, dots, lens, toggle } = AT;
  const tHa = at("half", 2.4), tOl = at("old", 4.3), tBe = at("better", 6), tOn = at("only", 8.2);
  paper();
  photo("A11", { t: 0, d: tOl + .5, mv: "push", a: .8, in: "iris", box: [0, 0, W * .56, H], until: tOl + .2 });
  kick("GLAUCOMA MICE", .2, { x: W * .62, y: H * .14 });
  gauge(.5, W * .78, H * .42, H * .2, tHa - .6, { c: K.green, w: 2.4, ns: 8, d: 1.4, until: tOl });
  tel("పోయిన చూపులో <b>దాదాపు సగం</b>", tHa, { x: W * .62, y: H * .68, size: 3.4, c: K.green, until: tOl });
  photo("A10", { t: tOl - .1, d: D - tOl, mv: "push", a: .6, in: "page", box: [W * .06, H * .1, W * .5, H * .6], plate: true, fig: "FIG. 03 · 1-YEAR-OLD MOUSE", rot: -1.5 });
  chip("OLD MICE TOO", W * .62, H * .2, tOl + .2, { c: K.ink, size: 2.4 });
  head("Vision <em>improved</em>", tBe - .2, { x: W * .62, y: H * .3, size: 7.5, c: K.green });
  stamp("ONLY IN MICE", W * .5, H * .5, tOn, { size: 6.5, c: K.warn });
  cam(tOn - .1, 1.2, { scale: 1.04 });
  AT.done();
</script>
</body></html>
