<!doctype html><html><head><meta charset="utf-8">
<script src="gsap.min.js"></script><script src="scene.js"></script>
<link rel="stylesheet" href="studio.css"><script src="studio.js"></script><script src="kit.js"></script>
<style>/* 05 V02 9:16 (11.1-31.4 s): loan analogy house / gold = NVIDIA chips; $500B+; BlackRock + Goldman Sachs; NON-BINDING; data centers */
.eq { position: absolute; font: 400 calc(var(--u) * 16) var(--font-head); color: #14171F; transform: translateX(-50%); }
.tile { position: absolute; box-sizing: border-box; background: #fff no-repeat center / 74%; box-shadow: 0 calc(var(--u) * .8) calc(var(--u) * 2.4) #14171F22; }
</style></head><body>
<div id="root" data-composition-id="root" data-width="{{W}}" data-height="{{H}}" data-start="0" data-duration="{{DUR}}">
  <div id="shake"><div id="stage"></div></div>
</div>
<script>
  const { W, H, D, u, PAL, tl, E, at, mk, place, pop, out, move, fit, card, head, rehead, chip, num, count, stamp, cam } = X;
  document.documentElement.style.setProperty("--u", u + "px");
  X.bg("money");
  const tL = at("loan", 2.5), tHo = at("house", 3.6), tG = at("gold", 4.2), tCh = at("chips", 7.1), tB = at("b500", 8.3), tDl = at("deals", 11.8),
        tA = at("aug", 13.4), tBr = at("blackrock", 14.1), tGs = at("goldman", 14.8), tNb = at("nonbind", 16.8), tDc = at("dc", 18.1);
  cam(0, 10, 1.04);

  // A. like a big loan: house / gold on top, "=" , NVIDIA chips below
  const h1 = head("Like a big <em>loan</em>", "Loan కి house లేదా gold guarantee పెట్టినట్లు", tL - 1.0, { x: W * 0.07, y: H * 0.06, w: W * 0.86, size: 10 });
  const ho = card({ i: "house", x: W * 0.06, y: H * 0.22, w: W * 0.42, h: H * 0.2, rot: -2, cap: "HOUSE" }); pop(ho, tHo - 0.2, { x: -u * 10, opacity: 0, rotation: -6 }, 0.6);
  const go = card({ i: "gold", x: W * 0.54, y: H * 0.22, w: W * 0.4, h: H * 0.2, rot: 2, cap: "GOLD" }); pop(go, tG - 0.2, { x: u * 10, opacity: 0, rotation: 6 }, 0.6);
  const eq = place(mk("div", "eq", undefined, "="), W * 0.5, H * 0.44); pop(eq, tCh - 0.6, { scale: 0.4, opacity: 0 }, 0.5, E.pop);
  const bw = card({ i: "blackwell", x: W * 0.12, y: H * 0.56, w: W * 0.76, h: H * 0.26, cap: "NVIDIA CHIPS = GUARANTEE" }); pop(bw, tCh - 0.2, { y: u * 12, opacity: 0 }, 0.7);

  // B. $500B+ deals with BlackRock, Goldman Sachs (August); NON-BINDING
  X.bg("paper", tB - 0.5);
  [ho, go, eq].forEach((e) => out(e, tB - 0.6, { y: -u * 6 }));
  fit(bw, tB - 0.6, W * 0.1, H * 0.62, W * 0.8, H * 0.22, 0.8);
  const h2 = rehead(h1, "Big <em>deals</em>", "500 billion dollars కంటే ఎక్కువ deals", tB - 0.3, { x: W * 0.07, y: H * 0.06, w: W * 0.86, size: 10, mk: "#C9E88F" });
  const n = num(W * 0.5, H * 0.22, PAL.dgreen, 22); n.style.transform = "translateX(-50%)"; count(n, 0, 500, tB, 1.4, (v) => "$" + Math.round(v) + "B"); pop(n, tB - 0.1, { opacity: 0 }, 0.3);
  const ch = chip("AUGUST 2026 DEALS", W * 0.26, H * 0.36, PAL.ink); pop(ch, tA - 0.2);
  const t1 = place(mk("div", "tile"), W * 0.08, H * 0.43, W * 0.4, H * 0.12); t1.style.backgroundImage = `url("${X.S.images[X.ix("blackrock")]}")`; pop(t1, tBr - 0.2, { x: -u * 8, opacity: 0 }, 0.5);
  const t2 = place(mk("div", "tile"), W * 0.52, H * 0.43, W * 0.4, H * 0.12); t2.style.backgroundImage = `url("${X.S.images[X.ix("goldman")]}")`; pop(t2, tGs - 0.2, { x: u * 8, opacity: 0 }, 0.5);
  stamp("NON-BINDING", W * 0.12, H * 0.565, tNb, { rot: -6, size: 8.6 });

  // C. what it builds: data centers
  out(bw, tDc - 0.6);
  const dc = card({ i: "datacenter", x: W * 0.08, y: H * 0.66, w: W * 0.84, h: H * 0.26, cap: "DATA CENTERS" }); pop(dc, tDc - 0.2, { y: u * 12, opacity: 0 }, 0.7);
  cam(tB, D - tB, 1.0);
  X.done();
</script></body></html>
