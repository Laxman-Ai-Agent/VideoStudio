[project]
name = "videostudio"
version = "0.1.0"
description = "Audio-to-video documentary pipeline"
requires-python = "==3.12.*"
# One responsibility per library. Register every addition in docs/LIBRARIES.md first.
dependencies = [
    "av==15.*",
    "faster-whisper==1.*",
    "pydantic==2.*",
    "rembg==2.0.87",
]

[dependency-groups]
dev = ["pytest==8.*"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
