<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Visual Assets · Video Studio</title>
  <link rel="stylesheet" href="styles/app.css">
</head>
<body>
  <main>
    <nav class="tabs" aria-label="Pages">
      <div class="row main">
      <button type="button" class="tab" id="nav-projects">Projects</button>
      <button type="button" class="tab active" id="nav-assets">Assets</button>
      <button type="button" class="tab" id="nav-timeline">Timeline</button>
      </div>
      <div class="row sub">
      <button type="button" class="tab" id="prep" title="Process the uploads and build the storyboard (studio run --review, no render), then open the Timeline">Prepare &amp; open Timeline</button>
      <section class="stats">
        <button type="button" class="stat total on" data-filter="all" title="Show all assets"><span class="stat-icon"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5z"/><path d="m3 13 9 5 9-5"/><path d="m3 17 9 5 9-5" opacity=".6"/></svg></span>
          <div><b id="c-total">0</b><span>Total</span></div></button>
        <button type="button" class="stat found" data-filter="found" title="Show only found assets"><span class="stat-icon"><svg viewBox="0 0 24 24"><path d="m6 12.5 4 4 8-9"/></svg></span>
          <div><b id="c-found">0</b><span>Found</span></div></button>
        <button type="button" class="stat missing" data-filter="missing" title="Show only missing assets"><span class="stat-icon"><svg viewBox="0 0 24 24"><path d="m7 7 10 10M17 7 7 17"/></svg></span>
          <div><b id="c-missing">0</b><span>Missing</span></div></button>
      </section>
      </div>
    </nav>
    <section id="projects" class="ptable-wrap" hidden>
      <table class="ptable"><thead><tr><th>S.No</th><th>Project</th><th>Duration</th><th>Assets</th><th>Missing</th><th>Render</th><th></th></tr></thead><tbody id="ptbody"></tbody></table>
    </section>

    <p id="notice" class="notice" hidden></p>
    <section id="grid" class="grid" aria-live="polite"></section>
  </main>

  <div id="confirm" class="cmodal" hidden>
    <div class="cbox" role="alertdialog" aria-modal="true" aria-labelledby="c-title">
      <div class="cicon"><svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 12a1 1 0 0 0 1 1h8a1 1 0 0 0 1-1l1-12M9 7V4h6v3"/></svg></div>
      <h3 id="c-title">Delete project?</h3>
      <p id="c-text"></p>
      <p id="c-err" class="cerr" hidden></p>
      <div class="cbtns"><button type="button" class="cbtn" id="c-cancel">Cancel</button><button type="button" class="cbtn red" id="c-ok">Delete</button></div>
    </div>
  </div>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="d-name">
      <button class="close" id="d-close" aria-label="Close">&times;</button>
      <div class="d-left">
        <div class="frame-wrap"><div class="frame" id="d-frame"></div></div>
        <p class="hint center" id="d-frame-note"></p>
        <div class="pending" id="d-pending" hidden>
          <div class="pend-row">
            <figure><figcaption>Current</figcaption><div id="d-cur"></div></figure>
            <figure><figcaption>New (not applied yet)</figcaption><div id="d-new"></div></figure>
          </div>
          <div class="btns end">
            <button class="btn" id="d-discard">Discard new file</button>
            <button class="btn primary" id="d-confirm">Confirm replacement</button>
          </div>
        </div>
        <div class="d-section media" id="d-media" hidden>
          <h3>Framing</h3>
          <div class="ctl-row">
            <label>Aspect <select id="m-aspect"></select></label>
            <div class="seg" role="group" aria-label="Fit or fill">
              <button type="button" data-fit="fill">Fill (crop)</button><button type="button" data-fit="fit">Fit (pad)</button>
            </div>
          </div>
          <div class="ctl-grid" id="m-crop">
            <label>Crop X <input type="range" id="m-x" min="0" max="1" step="0.01"></label>
            <label>Crop Y <input type="range" id="m-y" min="0" max="1" step="0.01"></label>
            <label>Zoom <input type="range" id="m-zoom" min="1" max="3" step="0.05"></label>
          </div>
          <p class="hint" id="m-dims"></p>
          <div id="m-video" hidden>
            <h3>Duration</h3>
            <div class="ctl-row">
              <label>Start (s) <input type="number" id="m-start" min="0" step="0.1"></label>
              <label>End (s) <input type="number" id="m-end" min="0" step="0.1"></label>
              <button type="button" class="btn ghost" id="m-fit-dur">Use required length</button>
            </div>
            <p class="hint" id="m-dur"></p>
          </div>
        </div>
        <div class="progress" id="d-progress" hidden><span></span></div>
        <input type="file" id="d-file" accept=".png,.jpg,.jpeg,.webp,.mp4,.mov,.webm" hidden>
        <details class="hist" id="d-hist-box" hidden><summary>History</summary><ol id="d-hist"></ol></details>
      </div>
      <div class="d-body">
        <div class="d-head"><h2 id="d-name"></h2><span class="badge" id="d-badge"></span></div>
        <div class="why">
          <div class="why-row"><span>Narration</span><q id="d-narr"></q></div>
          <div class="why-row"><span>Why this visual</span><p id="d-context"></p></div>
          <div class="why-row"><span>Scene</span><p id="d-scene"></p></div>
        </div>
        <dl class="d-info" id="d-info"></dl>

        <div class="d-section" id="d-prompt-box">
          <div class="d-row"><h3>Generation prompt</h3>
            <div class="btns">
              <button class="btn ghost" id="d-copy">Copy Prompt</button>
              <button class="btn ghost" id="d-edit">Edit Prompt</button>
            </div></div>
          <div class="d-ref" id="d-ref" hidden><img id="d-ref-img" alt="">
            <div><b>Attach this reference image</b><p id="d-ref-txt"></p></div></div>
          <textarea id="d-prompt" rows="6" readonly spellcheck="false"></textarea>
          <p class="hint" id="d-settings"></p>
          <details id="d-orig-box" hidden><summary>Original prompt</summary><p class="orig" id="d-orig"></p></details>
        </div>

        <p class="msg" id="d-msg" role="status"></p>
        <div class="d-actions">
          <button class="btn" id="d-upload">Upload</button>
          <button class="btn" id="d-cancel">Cancel</button>
          <button class="btn primary" id="d-save">Save Changes</button>
        </div>
      </div>
    </div>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
