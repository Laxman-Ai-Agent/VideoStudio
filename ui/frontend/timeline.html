<!doctype html><html><head><meta charset="utf-8"><title>Timeline</title>
<style>
:root { --bg:#0b0d1c; --side:#0f1124; --card:#141734; --line:#262a52; --text:#f3f4ff; --muted:#a3a8cc;
        --accent:#8b6bff; --warn:#f5b942; --err:#ef4444; --head:96px; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px "Segoe UI", Inter, sans-serif; }
button, select, input { font:inherit; color:inherit; }
button, select { background:var(--card); border:1px solid var(--line); border-radius:8px; padding:5px 10px; cursor:pointer; }
button:hover { border-color:#3b3f72; }
button.on, .seg button.on { background:var(--accent); border-color:var(--accent); color:#fff; }
.n { color:var(--muted); }

header { display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--line); background:var(--side); flex-wrap:wrap; }
header a { color:var(--muted); text-decoration:none; }
header h1 { font-size:18px; font-weight:600; margin:0 6px 0 0; }
.seg { display:flex; } .seg button { border-radius:0; } .seg button:first-child { border-radius:8px 0 0 8px; } .seg button:last-child { border-radius:0 8px 8px 0; }
.grow { flex:1; }
#warnBtn { background:rgba(245,185,66,.12); border-color:rgba(245,185,66,.4); color:var(--warn); }
#warnBtn.on { background:var(--warn); color:#1a1300; }
#render { background:var(--accent); border-color:var(--accent); color:#fff; font-weight:600; }
#render:disabled { opacity:.6; cursor:default; }
#rstate { color:var(--muted); font-size:12px; max-width:320px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

#rbar { display:none; align-items:center; gap:22px; padding:12px 18px; border-bottom:1px solid var(--line); background:var(--card); }
#rbar.show { display:flex; }
#rbar .big { font-family:Consolas, monospace; font-size:44px; font-weight:700; line-height:1; letter-spacing:1px; }
#rbar .lab { font-size:12px; color:var(--muted); text-transform:uppercase; letter-spacing:.06em; }
#rbar .val { font-size:22px; font-weight:600; }
#rbar .step { flex:1; min-width:0; font-size:15px; color:var(--text); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
#rbar.done .big { color:#4ade80; } #rbar.failed .big, #rbar.waiting .big { color:var(--err); }
#rbar .pbar { height:6px; background:var(--line); border-radius:3px; overflow:hidden; margin-top:6px; width:220px; }
#rbar .pbar i { display:block; height:100%; background:var(--accent); width:0; transition:width .5s; }
#main { display:grid; grid-template-columns:210px minmax(0,1fr) 270px; gap:14px; padding:12px 16px; }
body.big #main { grid-template-columns:minmax(0,1fr); } body.big #list, body.big #info { display:none; }
#list { display:flex; flex-direction:column; gap:3px; max-height:52vh; overflow-y:auto; }
#list .ttl { color:var(--muted); font-size:12px; margin-bottom:4px; }
.sc { display:flex; align-items:center; gap:8px; text-align:left; background:none; border:1px solid transparent; padding:6px 8px; }
.sc:hover { background:var(--card); }
.sc.sel { background:var(--card); border-color:var(--accent); }
.sc b { font-weight:500; flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.sc em { font-style:normal; color:var(--warn); font-weight:700; }
.dot { width:9px; height:9px; border-radius:50%; flex:none; }
#stage { display:flex; justify-content:center; min-width:0; }
#screen { background:#000; border-radius:10px; overflow:hidden; position:relative; display:grid; place-items:center; }
#screen iframe { position:absolute; left:0; top:0; border:0; transform-origin:0 0; background:#000; }
#screen img, #screen video { width:100%; height:100%; object-fit:contain; }
#screen .tpl { color:#ffc400; font-weight:800; font-size:20px; text-align:center; padding:20px; white-space:pre-line; }
#screen .msg { position:absolute; left:8px; bottom:8px; font-size:12px; color:#ddd; background:rgba(0,0,0,.55); padding:2px 8px; border-radius:6px; z-index:3; }
#screen .msg:empty { display:none; }
#badge { position:absolute; left:8px; top:8px; font-size:12px; background:rgba(0,0,0,.55); padding:2px 8px; border-radius:6px; z-index:3; }
#expand { position:absolute; right:8px; top:8px; z-index:3; background:rgba(0,0,0,.55); border:0; padding:3px 8px; }
#info { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 14px; line-height:1.55; font-size:13px; align-self:start; }
#info h3 { margin:0 0 2px; font-size:16px; }
#info .row { margin-top:6px; } #info .row span:first-child { color:var(--muted); display:block; font-size:12px; }
#info .w { color:var(--warn); margin-top:6px; } #info .e { color:var(--err); margin-top:6px; }

#bar { display:flex; align-items:center; gap:8px; padding:8px 16px; border-top:1px solid var(--line); border-bottom:1px solid var(--line); background:var(--side); flex-wrap:wrap; }
#bar button { padding:4px 9px; }
#play { min-width:70px; font-weight:600; }
#time { font-variant-numeric:tabular-nums; font-family:Consolas, monospace; min-width:130px; }
#keys { color:var(--muted); font-size:12px; }

#tl { display:flex; }
#heads { width:var(--head); flex:none; border-right:1px solid var(--line); background:var(--side); }
#heads div { height:44px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding-left:12px; color:var(--muted); font-size:12px; }
#heads .rh, .ruler { height:26px !important; }
#heads .vh, #L-vis { height:58px; }
#scroll { flex:1; overflow-x:auto; min-width:0; }
#inner { position:relative; }
.ruler { position:relative; border-bottom:1px solid var(--line); cursor:pointer; }
.ruler span { position:absolute; top:5px; font-size:11px; color:var(--muted); transform:translateX(-50%); font-family:Consolas, monospace; }
.ruler i { position:absolute; bottom:0; width:1px; height:6px; background:var(--muted); }
.lane { position:relative; height:44px; border-bottom:1px solid var(--line); }
.clip { position:absolute; top:5px; bottom:5px; border-radius:6px; overflow:hidden; display:flex; align-items:center; gap:6px;
        padding:0 7px; font-size:12px; white-space:nowrap; cursor:pointer; border:1px solid rgba(255,255,255,.12); }
.clip:hover { filter:brightness(1.2); }
.clip.sel { outline:2px solid var(--accent); outline-offset:1px; }
.clip.warn { border:2px solid var(--warn); } .clip.err { border:2px solid var(--err); }
.k-tpl { background:#4b3a9e; } .k-video { background:#2b5f93; } .k-image { background:#33693d; } .k-miss { background:#8a2f2f; }
.t-text { background:#3b3470; } .t-cap { background:#252d5a; color:#cfd3f5; } .o-ovl { background:#7a5a22; } .a-aud { background:#1f5550; }
#ph { position:absolute; top:0; bottom:0; width:2px; background:var(--accent); pointer-events:none; z-index:5; }
#ph::before { content:""; position:absolute; top:0; left:-6px; width:14px; height:12px; background:var(--accent); border-radius:0 0 4px 4px; }
</style></head><body>
<header>
  <a href="/">&larr; Dashboard</a><h1>Timeline</h1>
  <select id="proj" aria-label="Project"></select>
  <div class="seg" id="fmtSeg"><button data-f="16:9" class="on">16:9</button><button data-f="9:16">9:16</button></div>
  <span id="sum" class="n"></span>
  <span class="grow"></span>
  <button id="warnBtn" hidden title="Show only scenes with warnings"></button>
  <span id="rstate"></span>
  <select id="rmode" aria-label="Render mode"><option value="preview">Preview 720p</option><option value="final">Final</option></select>
  <button id="render">Render</button>
</header>
<div id="rbar"><div><div class="lab" id="rlab">Render time</div><div class="big" id="rtime">0:00</div></div>
  <div><div class="lab">Usually takes</div><div class="val" id="rlast">-</div><div class="pbar"><i id="rprog"></i></div></div>
  <div class="step" id="rstep"></div></div>
<div id="main">
  <div id="list"></div>
  <div id="stage"><div id="screen"></div></div>
  <div id="info"></div>
</div>
<div id="bar">
  <button id="prev" title="Previous scene (Up)">&#9198;</button>
  <button id="play">Play</button>
  <button id="next" title="Next scene (Down)">&#9197;</button>
  <button id="loop" title="Loop this scene (L)">Loop</button>
  <span id="time">0:00.0 / 0:00.0</span>
  <select id="speed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option></select>
  <span class="grow"></span>
  <span id="keys">Space play · &larr;&rarr; frame (Shift 1 s) · &uarr;&darr; scene · L loop · F expand</span>
  <button id="zout" title="Zoom out">&minus;</button>
  <input id="zoom" type="range" min="10" max="300" value="60" aria-label="Zoom">
  <button id="zin" title="Zoom in">+</button>
  <button id="fit">Fit</button>
</div>
<div id="tl"><div id="heads"><div class="rh"></div><div>Captions</div><div>Text</div><div>Overlays</div><div class="vh">Visual</div><div>Narration</div></div>
  <div id="scroll"><div id="inner">
    <div class="ruler" id="ruler"></div>
    <div class="lane" id="L-cap"></div><div class="lane" id="L-text"></div><div class="lane" id="L-ovl"></div>
    <div class="lane" id="L-vis"></div><div class="lane" id="L-aud"></div>
    <div id="ph"></div>
  </div></div></div>
<audio id="aud" preload="auto"></audio>
<script src="timeline.js"></script><script src="timeline_live.js"></script>
</body></html>
