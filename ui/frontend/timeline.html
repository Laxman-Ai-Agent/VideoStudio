<!doctype html><html><head><meta charset="utf-8"><title>Timeline</title>
<link rel="stylesheet" href="timeline.css"><link rel="stylesheet" href="timeline_edit.css"><link rel="stylesheet" href="motion.css"></head><body>
<nav class="tabs" aria-label="Pages">
  <a class="tab" href="/#view=projects">Projects</a>
  <a class="tab" id="tab-assets" href="/">Assets</a>
  <a class="tab active" href="#" aria-current="page">Timeline</a>
</nav>
<nav class="views" aria-label="Sections">
  <button type="button" class="tab" data-view="preview">Video Preview</button>
  <button type="button" class="tab" data-view="timeline">Timeline</button>
</nav>
<div id="hid" hidden>
  <select id="proj" aria-label="Project"></select><b id="ptitle"></b><span id="sum"></span><button id="warnBtn"></button><span id="rstate"></span>
  <select id="rmode" aria-label="Render mode"><option value="final">Final 1080p</option><option value="preview">Preview 480p</option></select>
</div>
<div id="rbar"><div><div class="lab" id="rlab">Render time</div><div class="big" id="rtime">0:00</div></div>
  <div><div class="lab">Usually takes</div><div class="val" id="rlast">-</div><div class="pbar"><i id="rprog"></i></div></div>
  <div class="step" id="rstep"></div></div>
<div id="main">
  <aside id="list" class="card"></aside>
  <section id="center">
    <div class="card" id="pcard">
      <div id="stage"><div id="screen"></div></div>
      <div id="ctrl">
        <button id="play" class="round" title="Play / pause (Space)">&#9654;</button>
        <button id="prev" class="ic" title="Previous scene (Up)">&#9198;</button>
        <button id="next" class="ic" title="Next scene (Down)">&#9197;</button>
        <button id="loop" class="ic" title="Loop this scene (L)">&#10227;</button>
        <span id="time">0:00.0 / 0:00.0</span>
        <input id="seek" type="range" min="0" max="1" step="0.01" value="0" aria-label="Scene position">
        <select id="speed" aria-label="Speed"><option value="0.5">0.5x</option><option value="1" selected>1x</option><option value="1.5">1.5x</option></select>
      </div>
    </div>
  </section>
  <div id="side"><div id="assets" class="card"></div><aside id="info" class="card"></aside></div>
  <aside id="opts" class="card">
    <h4>Ratio</h4>
    <div class="seg" id="fmtSeg"><button data-f="16:9" class="on">16:9</button><button data-f="9:16">9:16</button></div>
    <h4>Quality</h4>
    <div id="resSeg">
      <button type="button" data-v="final" class="on"><b>1080p</b><span>Final &middot; full size</span></button>
      <button type="button" data-v="preview"><b>480p</b><span>Preview &middot; quick check</span></button>
    </div>
    <div id="outSize">Output <b></b></div>
    <button id="render">Render</button>
  </aside>
</div>
<div class="card" id="tlcard">
  <div id="bar">
    <button id="tUndo" class="ic" title="Undo (Ctrl+Z)">&#8630;</button><button id="tRedo" class="ic" title="Redo (Ctrl+Y)">&#8631;</button>
    <button id="tDel" class="ic" title="Delete selected element (Del)">&#128465;</button>
    <span id="keys">E edit · Space play · &larr;&rarr; frame · &uarr;&darr; scene · L loop · F expand</span>
    <span class="grow"></span>
    <button id="zout" class="ic" title="Zoom out">&minus;</button>
    <input id="zoom" type="range" min="10" max="300" value="60" aria-label="Zoom">
    <button id="zin" class="ic" title="Zoom in">+</button>
    <button id="fit">Fit</button>
  </div>
  <div id="tl"><div id="heads"><div class="rh"></div><div><i>&#128172;</i>Captions</div><div><i>T</i>Text</div><div><i>&#9776;</i>Overlays</div><div class="vh"><i>&#9635;</i>Visual</div><div><i>&#9835;</i>Narration</div></div>
    <div id="scroll"><div id="inner">
      <div class="ruler" id="ruler"></div>
      <div class="lane" id="L-cap"></div><div class="lane" id="L-text"></div><div class="lane" id="L-ovl"></div>
      <div class="lane" id="L-vis"></div><div class="lane" id="L-aud"></div>
      <div id="ph"></div>
    </div></div></div>
</div>
<audio id="aud" preload="auto"></audio>
<script src="timeline.js"></script><script src="timeline_live.js"></script><script src="edit_math.js"></script><script src="timeline_edit.js"></script><script src="timeline_panel.js"></script>
</body></html>
