<!doctype html><html><head><meta charset="utf-8"><title>Timeline</title>
<style>
:root { --bg:#1f1f24; --panel:#2a2a31; --line:#3a3a44; --text:#eee; --muted:#9a9aa8; --head:150px; }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--text); font:14px "Segoe UI", Inter, sans-serif; }
header { display:flex; align-items:center; gap:14px; padding:12px 18px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
header a { color:var(--muted); text-decoration:none; }
header h1 { font-size:20px; margin:0 12px 0 0; }
select, button, input { font:inherit; color:var(--text); }
select, button { background:var(--panel); border:1px solid var(--line); border-radius:6px; padding:6px 10px; cursor:pointer; }
#sum { color:var(--muted); }
#mon { display:flex; gap:18px; padding:14px 18px; align-items:flex-start; }
#screen { width:480px; aspect-ratio:16/9; background:#000; border-radius:8px; overflow:hidden; display:grid; place-items:center; flex:none; }
#screen img, #screen video { width:100%; height:100%; object-fit:contain; }
#screen .tpl { color:#ffc400; font-weight:800; font-size:22px; text-align:center; padding:20px; }
#info { flex:1; min-width:0; line-height:1.6; }
#info b { color:#ffc400; }
.n { color:var(--muted); }
#bar { display:flex; align-items:center; gap:14px; padding:0 18px 10px; flex-wrap:wrap; }
#time { font-variant-numeric:tabular-nums; min-width:120px; }
#hint { color:var(--muted); font-size:13px; }
#tl { display:flex; border-top:1px solid var(--line); }
#heads { width:var(--head); flex:none; border-right:1px solid var(--line); }
#heads div { height:56px; border-bottom:1px solid var(--line); display:flex; align-items:center; padding-left:14px; color:#ccc; }
#heads .rh { height:30px; }
#scroll { flex:1; overflow-x:auto; min-width:0; }
#inner { position:relative; }
.ruler { position:relative; height:30px; border-bottom:1px solid var(--line); cursor:pointer; background:#25252b; }
.ruler span { position:absolute; top:7px; font-size:11px; color:var(--muted); transform:translateX(-50%); }
.ruler i { position:absolute; bottom:0; width:1px; height:6px; background:var(--muted); }
.lane { position:relative; height:56px; border-bottom:1px solid var(--line); }
.clip { position:absolute; top:6px; bottom:6px; border-radius:6px; overflow:hidden; display:flex; align-items:center; gap:6px;
        padding:0 8px; font-size:12px; white-space:nowrap; cursor:pointer; border:1px solid rgba(255,255,255,.15); }
.clip img, .clip video { height:100%; aspect-ratio:16/9; object-fit:cover; flex:none; }
.clip.sel { outline:2px solid #4aa3ff; }
.v-video { background:#3f6f99; } .v-image { background:#4e6b4c; } .v-tpl { background:#6b5a99; } .v-miss { background:#8a3b3b; }
.t-text { background:#7a6bb5; } .o-ovl { background:#9a7a35; } .a-aud { background:#2f6f6a; }
#ph { position:absolute; top:0; bottom:0; width:2px; background:#4aa3ff; pointer-events:none; z-index:5; }
#ph::before { content:""; position:absolute; top:0; left:-6px; width:14px; height:14px; background:#4aa3ff; border-radius:0 0 4px 4px; }
</style></head><body>
<header><a href="/">&larr; Dashboard</a><h1>Timeline</h1><select id="proj"></select>
  <label>Zoom <input id="zoom" type="range" min="20" max="300" value="90"></label><span id="sum"></span></header>
<div id="mon"><div id="screen"></div><div id="info"></div></div>
<div id="bar"><button id="play">Play</button><span id="time">0:00.0</span>
  <span id="hint">Space = play / pause. Click the ruler or a clip to jump. View only: edit in Visual Assets or scenes.json.</span></div>
<div id="tl"><div id="heads"><div class="rh"></div><div>Text</div><div>Overlays</div><div>Visual</div><div>Narration</div></div>
  <div id="scroll"><div id="inner">
    <div class="ruler" id="ruler"></div>
    <div class="lane" id="L-text"></div><div class="lane" id="L-ovl"></div><div class="lane" id="L-vis"></div><div class="lane" id="L-aud"></div>
    <div id="ph"></div>
  </div></div></div>
<audio id="aud" preload="auto"></audio>
<script src="timeline.js"></script>
</body></html>
